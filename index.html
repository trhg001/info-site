<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="信息公示平台">
    <title>信息公示平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <div class="header-left">
                <div class="site-logo">📋</div>
                <div>
                    <div class="site-title">信息公示平台</div>
                    <div class="site-subtitle">信息公开 · 透明公正 · 服务公众</div>
                </div>
            </div>
            <nav class="header-nav">
                <a href="index.html" class="active">首页</a>
                <a href="#about">关于我们</a>
            </nav>
        </div>
    </header>

    <div class="search-bar">
        <div class="search-inner">
            <div class="search-input-wrap">
                <input type="text" class="search-input" placeholder="搜索公示信息..." maxlength="100">
                <button class="search-clear">✕</button>
            </div>
            <button class="search-btn">搜索</button>
        </div>
    </div>

    <div class="category-nav"></div>

    <div class="result-info"><span></span></div>

    <div class="service-portal">
        <div class="service-portal-inner">
            <div class="service-portal-title">🔗 常用服务平台</div>
            <div class="service-portal-grid">
                <a href="https://online.customs.gov.cn" target="_blank" class="service-card">
                    <div class="service-icon">🏛</div>
                    <div class="service-name">海关政务服务平台</div>
                    <div class="service-desc">行政审批 · 企业备案 · 业务办理</div>
                </a>
                <a href="https://www.singlewindow.cn" target="_blank" class="service-card">
                    <div class="service-icon">🌐</div>
                    <div class="service-name">中国国际贸易单一窗口</div>
                    <div class="service-desc">报关报检 · 舱单申报 · 税费支付</div>
                </a>
                <a href="https://co.ccpit.org" target="_blank" class="service-card">
                    <div class="service-icon">📜</div>
                    <div class="service-name">原产地证申报系统</div>
                    <div class="service-desc">原产地证书 · 自助打印 · 证书查询</div>
                </a>
            </div>
        </div>
    </div>

    <main class="main-container">
        <div class="notice-container"></div>
    </main>

    <div class="pagination"></div>

    <footer class="site-footer">
        <p class="footer-copyright"></p>
        <p class="footer-icp" style="margin-top:4px;"></p>
    </footer>

    <button class="share-fab" title="分享本网站">
        <span class="share-fab-icon">📱</span>
    </button>
    <div class="qr-overlay">
        <div class="qr-modal">
            <button class="qr-close">✕</button>
            <h3>扫码访问</h3>
            <p class="qr-desc">扫描二维码即可在手机上打开本网站</p>
            <div class="qr-code-wrap"><div id="qrcode"></div></div>
            <div class="qr-url" id="qrUrl"></div>
            <button class="qr-copy-btn" onclick="window.copyQrUrl()">📋 复制链接</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/share.js"></script>
    <script src="js/agent.js"></script>
</body>
</html>
