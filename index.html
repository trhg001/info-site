<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>铜仁海关信息公示</title>
<style>
/* ========================================
   信息公示平台 - 样式表
   专业正式风格，适合政务/机构信息公示
   ======================================== */

/* -------- 基础设置 -------- */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --primary: #1a56db;         /* 主色调 - 稳重蓝 */
    --primary-dark: #1e3a8a;
    --primary-light: #dbeafe;
    --accent: #d97706;          /* 强调色 - 金色点缀 */
    --bg: #f5f7fa;
    --bg-card: #ffffff;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --text-light: #9ca3af;
    --border: #e5e7eb;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --shadow-hover: 0 4px 12px rgba(0,0,0,.1);
    --radius: 8px;
    --max-width: 1100px;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
}

a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }

/* -------- 顶部导航 -------- */
.site-header {
    background: var(--primary-dark);
    color: #fff;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.header-inner {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.site-logo {
    width: 40px;
    height: 40px;
    background: var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    flex-shrink: 0;
}

.site-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
}

.site-subtitle {
    font-size: 12px;
    opacity: .75;
    margin-top: 2px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.header-nav {
    display: flex;
    gap: 4px;
}

.header-nav a {
    color: rgba(255,255,255,.85);
    padding: 6px 16px;
    border-radius: 4px;
    font-size: 14px;
    transition: all .2s;
}

.header-nav a:hover,
.header-nav a.active {
    background: rgba(255,255,255,.15);
    color: #fff;
    text-decoration: none;
}

/* -------- 搜索栏 -------- */
.search-bar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 24px 20px;
}

.search-inner {
    max-width: var(--max-width);
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: center;
}

.search-input-wrap {
    flex: 1;
    position: relative;
}

.search-input-wrap::before {
    content: "🔍";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    z-index: 1;
}

.search-input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
    background: #fff;
}

.search-input:focus {
    border-color: var(--primary);
}

.search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: var(--text-light);
    display: none;
}

.search-clear.visible { display: block; }
.search-clear:hover { color: var(--text); }

.search-btn {
    padding: 12px 28px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .2s;
    font-weight: 500;
}

.search-btn:hover { background: var(--primary-dark); }

/* -------- 分类标签 -------- */
.category-nav {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.category-tag {
    padding: 6px 18px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    transition: all .2s;
    color: var(--text-secondary);
    user-select: none;
}

.category-tag:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.category-tag.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}

/* -------- 主体布局 -------- */
.main-container {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 20px;
    min-height: 50vh;
}

/* -------- 公告列表 -------- */
.notice-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
}

.notice-item {
    background: var(--bg-card);
    padding: 20px 24px;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    position: relative;
}

.notice-item:hover { background: #f8fafc; }

.notice-item.pinned { background: #fffbeb; }
.notice-item.pinned:hover { background: #fef3c7; }

.pin-badge {
    position: absolute;
    right: 20px;
    top: 20px;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 10px;
    font-weight: 500;
}

.notice-date-col {
    flex-shrink: 0;
    width: 56px;
    text-align: center;
    background: var(--bg);
    border-radius: 6px;
    padding: 8px 4px;
    line-height: 1.2;
}

.notice-date-day {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
}

.notice-date-month {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
}

.notice-content-col {
    flex: 1;
    min-width: 0;
}

.notice-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.notice-item:hover .notice-title { color: var(--primary); }

.notice-summary {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
}

.notice-meta {
    font-size: 12px;
    color: var(--text-light);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
}

.notice-category-tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 11px;
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 500;
}

/* -------- 空状态 -------- */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
}

.empty-state-icon {
    font-size: 48px;
    margin-bottom: 12px;
}

.empty-state-text {
    font-size: 16px;
}

/* -------- 详情页 -------- */
.detail-page {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 20px 60px;
}

.detail-header {
    border-bottom: 2px solid var(--primary);
    padding-bottom: 24px;
    margin-bottom: 28px;
}

.detail-title {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 16px;
}

.detail-meta {
    display: flex;
    gap: 20px;
    color: var(--text-secondary);
    font-size: 14px;
    flex-wrap: wrap;
    align-items: center;
}

.detail-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
}

.detail-content {
    font-size: 15px;
    line-height: 1.9;
    color: var(--text);
}

.detail-content h3 {
    font-size: 18px;
    margin: 28px 0 12px;
    color: var(--primary-dark);
    padding-left: 12px;
    border-left: 3px solid var(--primary);
}

.detail-content p {
    margin: 10px 0;
    text-indent: 2em;
}

.detail-content table.data-table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 14px;
}

.detail-content table.data-table th {
    background: var(--primary-dark);
    color: #fff;
    padding: 10px 12px;
    text-align: center;
    font-weight: 500;
}

.detail-content table.data-table td {
    padding: 10px 12px;
    border: 1px solid var(--border);
    text-align: center;
}

.detail-content table.data-table tr:nth-child(even) {
    background: var(--bg);
}

.detail-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 20px;
    color: var(--primary);
    font-size: 14px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
}

.detail-back:hover {
    color: var(--primary-dark);
    text-decoration: underline;
}

/* -------- 详情页 - 附件/链接/上传区域 -------- */
.detail-section {
    margin-top: 32px;
    background: #fff;
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
}

.detail-section h3 {
    font-size: 16px;
    margin-bottom: 16px;
    color: var(--primary-dark);
    border: none;
    padding: 0;
}

/* 附件列表 */
.attachment-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.attachment-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--bg);
    border-radius: 8px;
    border: 1px solid var(--border);
    transition: all .2s;
    color: var(--text);
    text-decoration: none;
}

.attachment-item:hover {
    border-color: var(--primary);
    background: var(--primary-light);
    text-decoration: none;
}

.attachment-icon { font-size: 24px; flex-shrink: 0; }

.attachment-name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.attachment-action {
    font-size: 13px;
    color: var(--primary);
    font-weight: 500;
    flex-shrink: 0;
}

/* 相关链接 */
.link-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.link-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--bg);
    border-radius: 8px;
    border: 1px solid var(--border);
    transition: all .2s;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
}

.link-item:hover {
    border-color: var(--primary);
    background: var(--primary-light);
    text-decoration: none;
}

.link-arrow {
    color: var(--primary);
    font-size: 14px;
}

/* 文件上传区域 */
.upload-area {
    cursor: pointer;
}

.upload-dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    transition: all .2s;
    background: var(--bg);
}

.upload-dropzone:hover,
.upload-dropzone.dragover {
    border-color: var(--primary);
    background: var(--primary-light);
}

.upload-icon { font-size: 40px; display: block; margin-bottom: 8px; }

.upload-dropzone p {
    margin: 4px 0;
    font-size: 14px;
    color: var(--text-secondary);
    text-indent: 0;
}

.upload-hint {
    font-size: 12px !important;
    color: var(--text-light) !important;
}

.upload-progress {
    margin-top: 12px;
    padding: 12px 16px;
    background: var(--primary-light);
    border-radius: 8px;
}

.upload-progress-text {
    font-size: 13px;
    color: var(--primary-dark);
    display: block;
    margin-bottom: 6px;
}

.upload-progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
}

.upload-progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 2px;
    animation: progressPulse 1.5s ease-in-out infinite;
    width: 100%;
}

@keyframes progressPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .5; }
}

/* -------- 智能问答机器人 -------- */
.agent-widget {
    position: fixed;
    bottom: 32px;
    right: 92px;
    z-index: 200;
}

.agent-toggle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(26, 86, 219, 0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all .25s;
    animation: fabIn .5s ease-out;
    gap: 0;
    padding: 0;
}

.agent-toggle:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 20px rgba(26, 86, 219, 0.45);
}

.agent-toggle-icon { font-size: 20px; line-height: 1; }

.agent-toggle-text {
    font-size: 8px;
    opacity: .9;
    line-height: 1;
    margin-top: 1px;
}

.agent-panel {
    position: fixed;
    bottom: 96px;
    right: 16px;
    width: 380px;
    max-width: calc(100vw - 32px);
    height: 500px;
    max-height: calc(100vh - 120px);
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,.15);
    display: none;
    flex-direction: column;
    overflow: hidden;
    animation: slideUp .3s ease-out;
}

.agent-panel.open { display: flex; }

.agent-header {
    background: var(--primary);
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 500;
    flex-shrink: 0;
}

.agent-header span { flex: 1; }

.agent-minimize,
.agent-close {
    background: none;
    border: none;
    color: rgba(255,255,255,.8);
    cursor: pointer;
    font-size: 18px;
    padding: 2px 8px;
    border-radius: 4px;
    line-height: 1;
}

.agent-minimize:hover,
.agent-close:hover {
    background: rgba(255,255,255,.2);
    color: #fff;
}

.agent-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f9fafb;
}

.agent-messages::-webkit-scrollbar { width: 4px; }
.agent-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.agent-msg { display: flex; }
.agent-msg.user { justify-content: flex-end; }
.agent-msg.bot { justify-content: flex-start; }

.agent-msg-content {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
}

.agent-msg.user .agent-msg-content {
    background: var(--primary);
    color: #fff;
    border-bottom-right-radius: 4px;
}

.agent-msg.bot .agent-msg-content {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
}

.agent-msg-content code {
    background: rgba(0,0,0,.06);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
}

.agent-msg.user .agent-msg-content code {
    background: rgba(255,255,255,.2);
}

.typing-dot {
    animation: typingPulse 1.4s ease-in-out infinite;
    display: inline-block;
    margin: 0 1px;
    font-size: 8px;
    vertical-align: middle;
    color: var(--text-light);
}

.typing-dot:nth-child(2) { animation-delay: .2s; }
.typing-dot:nth-child(3) { animation-delay: .4s; }

@keyframes typingPulse {
    0%, 60%, 100% { opacity: .3; }
    30% { opacity: 1; }
}

.agent-input-area {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: #fff;
    flex-shrink: 0;
    align-items: flex-end;
}

.agent-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    resize: none;
    font-family: inherit;
    outline: none;
    max-height: 120px;
    line-height: 1.5;
}

.agent-input:focus { border-color: var(--primary); }

.agent-send {
    padding: 10px 18px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background .2s;
}

.agent-send:hover { background: var(--primary-dark); }
.agent-send:disabled { opacity: .5; cursor: default; }

/* -------- 关于页面 -------- */
.about-page {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 20px 60px;
}

.about-page h2 {
    font-size: 24px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--primary);
}

.about-page p {
    margin: 12px 0;
    line-height: 1.9;
}

.about-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
}

.about-card h3 {
    font-size: 18px;
    margin-bottom: 12px;
    color: var(--primary-dark);
}

/* -------- 底部分页 -------- */
.pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 24px;
    padding: 16px;
    flex-wrap: wrap;
}

.page-btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    transition: all .2s;
    color: var(--text);
}

.page-btn:hover:not(:disabled) {
    border-color: var(--primary);
    color: var(--primary);
}

.page-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}

.page-btn:disabled {
    opacity: .4;
    cursor: default;
}

/* -------- 顶部结果统计 -------- */
.result-info {
    padding: 8px 20px 0;
    max-width: var(--max-width);
    margin: 0 auto;
    font-size: 13px;
    color: var(--text-secondary);
}

/* -------- 页脚 -------- */
.site-footer {
    background: var(--primary-dark);
    color: rgba(255,255,255,.7);
    text-align: center;
    padding: 20px;
    font-size: 13px;
    margin-top: 40px;
}

.site-footer a { color: rgba(255,255,255,.9); }

/* -------- 分享浮动按钮 -------- */
.share-fab {
    position: fixed;
    bottom: 32px;
    right: 28px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(26, 86, 219, 0.35);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .25s;
    animation: fabIn .5s ease-out;
}

.share-fab:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 20px rgba(26, 86, 219, 0.45);
}

.share-fab-icon {
    font-size: 22px;
    line-height: 1;
}

@keyframes fabIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* -------- 二维码弹窗 -------- */
.qr-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    animation: fadeIn .25s ease-out;
}

.qr-overlay.show {
    display: flex;
}

.qr-modal {
    background: #fff;
    border-radius: 16px;
    padding: 32px 28px 28px;
    text-align: center;
    max-width: 360px;
    width: 90%;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
    animation: slideUp .3s ease-out;
}

@keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.qr-close {
    position: absolute;
    top: 12px;
    right: 16px;
    background: none;
    border: none;
    font-size: 22px;
    color: var(--text-light);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 50%;
    transition: all .2s;
    line-height: 1;
}

.qr-close:hover {
    color: var(--text);
    background: var(--bg);
}

.qr-modal h3 {
    font-size: 20px;
    color: var(--text);
    margin-bottom: 6px;
}

.qr-desc {

    {
        id: 12,
        title: "阿根廷出口花生仁被检出黄曲霉毒素超标",
        category: "风险预警",
        date: "2026-05-15",
        summary: "欧盟RASFF通报阿根廷出口花生仁黄曲霉毒素B1超标（3.5 µg/kg），荷兰发出警告通报，产品未分销，已通知发货人进行物理处理。",
        content: `
            <h3>一、通报概要</h3>
            <p>据欧盟RASFF消息，2026年5月12日荷兰通报阿根廷出口花生仁黄曲霉毒素B1超标（3.5 &micro;g/kg），编号2026.4160，警告通报。产品未向其他成员国分销，已通知发货人物理处理分类。出口企业应严格按照欧盟要求，注意食品中真菌毒素的存在。</p>
            <h3>二、通报详情</h3>
            <p>本次通报由荷兰通过欧盟食品和饲料快速预警系统（RASFF）发出。通报编号为2026.4160，通报类型为"警告通报"（Alert Notification），表明风险等级较高。涉及产品为阿根廷出口的花生仁（Groundnuts），检出黄曲霉毒素B1含量为3.5 &micro;g/kg，超过欧盟法规（EU）No 165/2010规定的花生中黄曲霉毒素B1最大残留限量2.0 &micro;g/kg的标准。</p>
            <h3>三、处理措施</h3>
            <p>根据通报信息，该批产品未向其他欧盟成员国分销，已通知发货人进行物理处理-分类（Physical Treatment - Sorting），同时通知相关主管当局。这意味着该批货物未进入欧盟市场流通，已在海关或仓库环节被拦截处理。</p>
            <h3>四、风险分析与建议</h3>
            <p>黄曲霉毒素是由黄曲霉和寄生曲霉等真菌产生的次级代谢产物，具有强烈的致癌性、致突变性和致畸性，被国际癌症研究机构（IARC）列为一类致癌物。花生及其制品是黄曲霉毒素污染的高风险品类，出口至欧盟的花生仁必须满足严格的真菌毒素限量标准。出口企业应建立从原料采购、储存运输到加工出口全过程的质量控制体系，加强对原料中真菌毒素的检测频次，确保产品符合进口国标准要求，规避出口退货或通报风险。</p>
        `,

        ]
    },

    {
        id: 13,
        title: "韩国加强对疑似含有毒品成分的海外直购食品检查",
        category: "风险预警",
        date: "2026-05-15",
        summary: "韩国食药部（MFDS）2026年5-6月开展专项检查，针对海外直购食品中疑似含有的大麻成分（CBD、THC等）及苯丙胺等55种毒品成分。",
        content: `
            <h3>一、检查背景</h3>
            <p>2026年5月11日韩国食药部（MFDS）表示，发现在通过大麻合法化国家电商平台进行海外直购的食品中，部分果冻、饮料等疑似含有毒品成分，于5月至6月开展专项检查。检查项目包括大麻成分（CBD、THC等）、苯丙胺、帽柱木碱等共55种毒品成分，同时确认标签信息。食药部将定期检测并与海关合作，阻断相关产品入境流通。</p>
            <h3>二、检查范围与方法</h3>
            <p>本次专项检查主要针对通过大麻合法化国家（如加拿大、美国部分州、荷兰等）的跨境电商平台进行海外直购的食品，重点关注果冻类、饮料类等形态新颖、易于吸引消费者的产品。韩国食药部采用液相色谱-质谱联用（LC-MS/MS）和气相色谱-质谱联用（GC-MS/MS）等高精度分析方法，对55种毒品及精神活性成分进行定性定量检测，包括大麻二酚（CBD）、四氢大麻酚（THC）等大麻素类成分，以及苯丙胺类、帽柱木碱（Mitragynine）等精神活性物质。</p>
            <h3>三、检查措施与执法行动</h3>
            <p>韩国食药部除进行实验室检测外，还将通过产品标签信息核查是否含有被禁止进入韩国的原料及成分。对于检出毒品成分的产品，将依据《食品卫生法》和《毒品类管理法》进行行政处分，包括责令停售、强制召回、废弃处理等，情节严重的将移交司法机关处理。同时，食药部与关税厅（海关）建立信息共享和联合执法机制，在入境通关环节加强布控，对可疑产品实施拦截查验。</p>
            <h3>四、风险提示</h3>
            <p>韩国食药部表示将定期开展此类检测工作，并持续强化与海关等部门合作，迅速阻断疑似含有毒品成分产品的入境及市场流通。相关向韩国出口食品的企业应严格审查产品成分，确保不含韩国禁止使用的任何物质。特别是新型功能性食品和饮品，应在出口前对外方标签信息和成分进行分析确认，避免因成分违规导致产品被查扣、企业被列入黑名单等严重后果。</p>
        `,
        author: "食品伙伴网",
        pinned: false,
        links: [
            { title: "食品伙伴网原文", url: "https://news.foodmate.net/2026/05/743437.html" }
        ]
    },

        content: `
            <h3>一、召回概要</h3>
            <p>2026年5月14日加拿大食品检验局召回我国出口Shaoxing cooking wine（绍兴厨用酒）600mL，UPC代码6 912657 104298，保质期至2028年5月15日，产品在安大略省销售。召回原因：标签未声明过敏原（小麦）。检验局建议对小麦过敏消费者丢弃或退回产品。出口企业应注意目的国标签要求，如实标注过敏原成分。</p>
            <h3>二、召回详情</h3>
            <p>本次召回由加拿大食品检验局（Canadian Food Inspection Agency, CFIA）于2026年5月14日发布。涉及产品名称为"Shaoxing cooking wine"（绍兴厨用酒），规格为600mL瓶装，UPC条形码为6 912657 104298，生产批次的保质期标注至2028年5月15日。该产品已在加拿大安大略省（Ontario）市场销售。CFIA将此次召回分类为"Class I Recall"，即高风险召回，意味着食用该产品可能导致严重健康危害甚至死亡。</p>
            <h3>三、风险分析</h3>
            <p>小麦是加拿大《食品和药品条例》规定的11类优先过敏原之一。厨用酒在酿造过程中通常使用小麦作为主要原料或辅料，含有麸质蛋白等过敏原成分。对于小麦过敏或患有乳糜泻（Celiac disease）的消费者，即使摄入微量小麦蛋白也可能引发严重的过敏反应，包括荨麻疹、呼吸困难、过敏性休克等症状。加拿大食品标签法规要求必须在产品标签上明确声明所有优先过敏原成分。</p>
            <h3>四、应对建议</h3>
            <p>CFIA建议对小麦过敏、患有乳糜泻或其他麸质相关疾病的消费者立即停止食用上述召回产品，检查家中是否存有受召回产品并丢弃或退回购买商店。出口企业应按此提示，在出口食品标签中严格符合目的国所有过敏原声明要求。建议企业在出口前委托专业机构对标签进行合规审核，建立完善的标签管理制度。对于调味酒、复合调味料等成分复杂的产品，更需逐项排查所有原辅料是否含有进口国规定的过敏原，并如实标注。</p>
        `,
        author: "食品伙伴网",
        pinned: false,
        links: [
            { title: "食品伙伴网原文", url: "https://news.foodmate.net/2026/05/743415.html" }
        ]
    },

    {
        id: 15,
        title: "西班牙出口奶酪中检出李斯特菌",
        category: "风险预警",
        date: "2026-05-15",
        summary: "法国通过欧盟RASFF通报西班牙出口奶酪检出李斯特菌，产品已退出市场并从消费者处召回销毁，属警告通报。",
        content: `
            <h3>一、通报概要</h3>
            <p>2026年5月13日法国通过欧盟RASFF通报西班牙出口奶酪不合格（编号2026.4228），检出单核细胞增生李斯特菌。通知国未分销，产品已退出市场，从消费者处召回并销毁，属警告通报。出口企业应严格把控致病菌风险，特别是乳制品等高风险品类。</p>
            <h3>二、通报详情</h3>
            <p>本次通报由法国通过欧盟食品和饲料快速预警系统（RASFF）发出，通报编号为2026.4228，通报类型为"警告通报"（Alert Notification）。涉及产品为西班牙出口的奶酪（Cheese），检出致病菌为单核细胞增生李斯特菌（Listeria monocytogenes）。该菌是一种革兰氏阳性兼性厌氧菌，可引起李斯特菌病（Listeriosis），对孕妇及其胎儿、新生儿、65岁以上老年人和免疫功能低下者危害尤为严重，致死率可达20%-30%。</p>
            <h3>三、处理措施</h3>
            <p>根据通报信息，通知国（法国）未对该批产品进行分销，产品已在市场流通之前被发现并拦截。目前已采取的措施包括：产品退出市场（Withdrawal from the Market），从消费者处召回（Recall from Consumer），并对所有受影响的产品进行销毁处理（Destruction）。上述措施表明各方对此类高风险事件的高度重视和快速响应。</p>
            <h3>四、风险分析与建议</h3>
            <p>单核细胞增生李斯特菌广泛存在于自然环境中，可在冷藏温度（4℃）下生长繁殖，对乳制品、即食食品等构成较大安全隐患。乳制品尤其是软质奶酪、未经巴氏杀菌的牛奶制品是李斯特菌污染的高风险品类。出口企业应建立严格的食品安全管理体系（如HACCP），从原料乳验收、巴氏杀菌、生产环境监控、成品检验等各环节加强致病菌控制。同时应建立完善的追溯体系和召回预案，确保一旦发现问题产品能够迅速定位、有效召回。</p>
        `,
        author: "食品伙伴网",
        pinned: false,
        links: [
            { title: "食品伙伴网原文", url: "https://news.foodmate.net/2026/05/743408.html" }
        ]
    },

    {
        id: 16,
        title: "日本追加中国企业作为食品中甜蜜素的命令检查对象",
        category: "风险预警",
        date: "2026-05-15",
        summary: "日本厚生劳动省2026年5月14日将中国企业JINHUA LAOJIEKOU FOOD CO.,LTD.追加到中国产食品甜蜜素命令检查对象企业清单。",
        content: `
            <h3>一、通报概要</h3>
            <p>5月14日日本厚生劳动省发布健生食输发0514第1号通知，将从JINHUA LAOJIEKOU FOOD CO.,LTD.生产的食品中检出甜蜜素，将该企业追加到中国产食品（甜蜜素）命令检查对象企业清单。出口日本食品企业应严格遵守日本添加剂标准，甜蜜素在日本不得检出。被列入命令检查将增加通关时间和成本。</p>
            <h3>二、通报详情</h3>
            <p>日本厚生劳动省于2026年5月14日发布健生食输发0514第1号通知，宣布将JINHUA LAOJIEKOU FOOD CO.,LTD.（金华老街口食品有限公司）追加列入中国产食品甜蜜素（环己基氨基磺酸，Cyclamate）命令检查对象企业清单。该决定是基于日本进口食品监视指导计划下，在进口时的自主检查（Monitoring Inspection）中从该企业生产的食品中检测出甜蜜素。</p>
            <h3>三、命令检查制度说明</h3>
            <p>命令检查（Command Inspection）是日本进口食品检验体系中最严格的检查措施，要求进口商在货物通关前必须逐批次将货物送指定检查机构检测，并承担全部检测费用。检测结果合格后方可办理通关手续。命令检查通常会导致通关时间延长2-4周，且每批货物检测费用高昂，严重增加企业出口成本和不确定性。与其他被列入命令检查清单的企业相同，该企业如欲解除命令检查，需要连续一定批次（通常约60批次）检测合格，并通过出口国政府主管部门向日本厚生劳动省提出申请。</p>
            <h3>四、风险分析与建议</h3>
            <p>根据日本《食品卫生法》及《食品添加物公定书》规定，甜蜜素（环己基氨基磺酸钠/钙）在日本不得作为食品添加剂使用，食品中不得检出。而在中国、欧盟等多个国家和地区，甜蜜素允许在限定范围和使用量下使用。这种标准差异是导致出口食品被日方通报的常见原因。出口日本食品企业应充分了解中日食品添加剂标准差异，建立针对日本市场的专用配方体系，杜绝使用日本禁用的添加剂及其原料带入风险。此外，企业应加强原料供应商管理和进货检验，建立定期委托检测机制，确保出口日本的每一批产品符合日方标准要求。</p>
        `,
        author: "食品伙伴网",
        pinned: false,
        links: [
            { title: "食品伙伴网原文", url: "https://news.foodmate.net/2026/05/743388.html" }
        ]
    },

    {
        id: 17,
        title: "欧盟通报我国出口塑料厨具和尼龙厨具不合格",
        category: "风险预警",
        date: "2026-05-15",
        summary: "欧盟RASFF 2026年5月13日通报我国出口塑料厨具（检查不足、无认证分析报告）和尼龙厨具（文件不完整）不合格，均为拒绝入境通报。",
        content: `
            <h3>一、通报概要</h3>
            <p>2026年5月13日欧盟RASFF通报我国出口厨具不合格：（1）塑料厨具（欧盟委员会，编号2026.4212）：检查不足且无认证分析报告，产品未投放市场已官方扣留；（2）尼龙厨具（爱尔兰，编号2026.4239）：文件不完整，通知国未分销已官方扣留。均为拒绝入境通报。出口企业应严格按照进口国要求，注意食品接触材料各物质迁移量。</p>
            <h3>二、通报详情</h3>
            <p>本次涉及两起通报，均通过欧盟食品和饲料快速预警系统（RASFF）于2026年5月13日发出，通报类型均为"拒绝入境通报"（Border Rejection Notification）。第一起通报由欧盟委员会发出，编号2026.4212，涉及产品为塑料厨具（Plastic Kitchenware），问题为"检查不足"（Insufficient Checks）且"没有经认证的分析报告"（No Certified Analytical Report）。该批产品尚未投放欧盟市场，已在边境被官方扣留（Official Detention）。第二起通报由爱尔兰发出，编号2026.4239，涉及产品为尼龙厨具（Nylon Kitchenware），问题为"文件不完整"（Incomplete Documentation）。通知国未进行分销，产品已被官方扣留。</p>
            <h3>三、法规背景</h3>
            <p>欧盟对食品接触材料的管理建立了以框架法规（EC）No 1935/2004为基础，以塑料材料法规（EU）No 10/2011、陶瓷指令84/500/EEC等为补充的完整法规体系。根据（EU）No 10/2011，塑料食品接触材料必须进行迁移试验并出具符合性声明（Declaration of Compliance, DoC），证明产品在正常使用条件下各物质迁移量不超过特定迁移限量（Specific Migration Limit, SML）。尼龙厨具中的初级芳香胺（Primary Aromatic Amines, PAA）迁移量不得超过0.01 mg/kg。</p>
            <h3>四、风险分析与建议</h3>
            <p>食品接触材料虽不属于直接食品，但因与食品接触可能发生物质迁移，其安全性直接关系到消费者健康。近年来，欧盟对来自中国的食品接触材料（特别是塑料制品和尼龙制品）查控力度持续加大，通报数量居高不下。出口欧盟的厨具生产企业应从源头把控原料质量，选择符合欧盟法规要求的食品级原料，委托具有ISO 17025认可资质的实验室进行迁移试验，并根据检测结果出具符合性声明（DoC）和支持性文件（Supporting Documents）。进口商或报关时应提供完整的技术文件，包括分析报告、符合性声明、生产流程说明等，确保文件齐全合规，避免因文件问题导致货物被拒绝入境。</p>
        `,
        author: "食品伙伴网",
        pinned: false,
        links: [
            { title: "食品伙伴网原文", url: "https://news.foodmate.net/2026/05/743386.html" }
        ]
    },

    {
        id: 18,
        title: "海关总署令第284号：进出口化妆品检验检疫监督管理办法",
        category: "通知公告",
        date: "2026-05-06",
        summary: "海关总署发布《中华人民共和国海关进出口化妆品检验检疫监督管理办法》，自发布之日起施行，进一步规范进出口化妆品检验检疫监督管理。",
        content: `
            <h3>一、法规概况</h3>
            <p>海关总署令第284号公布的《中华人民共和国海关进出口化妆品检验检疫监督管理办法》，共37条，分为6章：第一章总则、第二章进口检验检疫、第三章出口检验检疫、第四章监督管理、第五章法律责任、第六章附则。该办法于2026年5月6日发布，自2026年12月1日起施行，原国家质量监督检验检疫总局令第143号同时废止。</p>
            <h3>二、第一章 总则（第1-5条）</h3>
            <p>总则部分明确了办法的立法目的和法律依据，包括《中华人民共和国进出口商品检验法》《中华人民共和国国境卫生检疫法》《化妆品监督管理条例》等法律法规。规定了办法的适用范围为进出境化妆品的检验检疫监督管理，明确了海关总署主管全国进出口化妆品检验检疫监督管理工作，直属海关负责所辖区域内进出口化妆品的检验检疫和监督管理工作。</p>
            <h3>三、第二章 进口检验检疫（第6-18条）</h3>
            <p>进口化妆品应当符合我国法律法规、国家强制性标准的要求。进口化妆品的收货人或其代理人应当依法向海关申报，并在海关放行后20日内将进口化妆品相关信息录入海关信息化管理系统。首次进口的化妆品应当提供相关安全性评估资料。进口化妆品标签应当符合我国法律法规、强制性国家标准的规定，使用中文标签或加贴中文标签。特殊用途化妆品还应当提供国务院药品监督管理部门出具的进口化妆品卫生许可批件。海关对进口化妆品实施抽样检验，检验合格的出具《入境货物检验检疫证明》，不合格的依法作退运或销毁处理。</p>
            <h3>四、第三章 出口检验检疫（第19-27条）</h3>
            <p>出口化妆品的发货人或其代理人应当依法向海关申报。海关对出口化妆品实施检验检疫，重点检验涉及安全卫生的项目。出口化妆品生产企业应当建立完善的质量管理体系，对出口化妆品的质量安全负责。经检验检疫合格的出口化妆品，海关出具《出境货物通关单》或电子通关信息。经检验检疫不合格的，可以在海关监督下进行技术处理，经重新检验合格后方可出口；不能进行技术处理或技术处理后仍不合格的，不准出口。出口化妆品因质量问题被进口国（地区）通报或召回的，出口企业应当及时向所在地海关报告。第四章监督管理（第28-33条）规定了海关对进出口化妆品生产经营者实施信用管理、风险监测、追溯管理、信息通报等监督管理措施。第五章法律责任（第34-36条）明确了违反办法规定的法律责任。第六章附则（第37条）规定了施行日期和废止条款。</p>
            <h3>五、企业应对建议</h3>
            <p>进出口化妆品企业应认真学习新办法各项要求，重点关注以下几方面：（1）进口化妆品应确保中文标签合规，提前准备安全性评估资料和卫生许可批件；（2）出口化妆品企业应建立完善的质量管理体系，加强对原料、半成品和成品的质量安全控制；（3）建立健全产品追溯体系，确保产品可追溯至原料来源和生产批次；（4）关注目的国（地区）化妆品法规动态，确保出口产品符合进口国（地区）标准要求；（5）建立召回应急预案，一旦产品被进口国（地区）通报或要求召回，应立即启动应急程序并向海关报告。企业应通过海关总署官方网站（www.customs.gov.cn）或"互联网+海关"平台及时关注相关法规动态和业务指南更新。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/08/article_2026050808301380823.html"}]
    },

    {
        id: 19,
        title: "海关总署第281号令：进出境特殊货物物品卫生检疫管理规定",
        category: "通知公告",
        date: "2026-01-06",
        summary: "海关总署公布《中华人民共和国海关进出境特殊货物物品卫生检疫管理规定》，自2026年8月1日起施行。",
        content: `
            <h3>一、法规概况</h3>
            <p>海关总署令第281号公布的《中华人民共和国海关进出境特殊货物物品卫生检疫管理规定》，于2026年1月6日发布，自2026年8月1日起施行。该规定全面规范了进出境特殊货物物品的卫生检疫管理工作，是海关卫生检疫领域的一项重要制度建设成果。</p>
            <h3>二、适用范围</h3>
            <p>本规定所称"特殊货物物品"主要包括：进出境的特殊生物制品（如疫苗、血液制品、诊断试剂等）、人体组织（如器官、骨髓、角膜等）、血液及其制品、微生物（包括病毒、细菌、真菌等）、人体细胞、干细胞、基因治疗产品等。这些物品因其特殊的生物学特性和潜在的健康安全风险，需要实施比普通货物更为严格的卫生检疫管理。规定明确了上述物品进出境时应当向海关申报，接受卫生检疫查验，未经检疫合格不得进出境。</p>
            <h3>三、主要管理制度</h3>
            <p>规定建立了以下核心管理制度：（1）准入管理制度：对进出境特殊货物物品实施风险评估和准入管理，来自特定国家（地区）的特殊货物物品须经海关总署风险评估并列入准入名单后方可进境；（2）申报管理制度：收发货人或其代理人应当在货物进出境前向海关申报，如实提供货物名称、数量、来源、用途、储存运输条件等信息以及相关证明文件；（3）检疫查验制度：海关对进出境特殊货物物品实施现场查验，包括核对货证是否相符、包装是否符合生物安全要求、储存温度是否符合规定等；（4）实验室检测制度：必要时海关可对特殊货物物品进行实验室检测；（5）后续监管制度：对进境后需继续使用的特殊货物物品实施后续监管，确保其按规定用途使用。</p>
            <h3>四、企业应对建议</h3>
            <p>从事进出境特殊货物物品贸易的企业应当：（1）提前了解并确认拟进出境货物物品是否需要办理特殊物品审批或备案手续；（2）确保货物物品的包装、标识、储存和运输条件符合生物安全要求，特别是涉及感染性物质或冷链运输的物品；（3）如实、准确地向海关申报，不得隐瞒、虚报货物物品的真实属性和风险等级；（4）建立完善的内部管理制度和追溯体系，确保货物物品从源头到终端的全程可追溯；（5）如发生包装破损、泄漏等异常情况，应立即向海关报告并按照应急预案妥善处置。违规进出境特殊货物物品的，将依法承担相应的法律责任，包括警告、罚款、没收货物物品等行政处罚，情节严重构成犯罪的，依法追究刑事责任。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://shenyang.customs.gov.cn/zhanjiang_customs/534855/zfxxgkzn24/lzyj98/zcjd0/7008361/index.html"}]
    },

    {
        id: 20,
        title: "海关总署关于《海关总署关于修改部分规章的决定》的解读",
        category: "通知公告",
        date: "2026-05-15",
        summary: "海关总署发布对部分规章修改决定的解读，涉及多条规章的修订内容、修订背景和实施要求。",
        content: `
            <h3>一、修订背景</h3>
            <p>为贯彻落实党中央、国务院关于深化"放管服"改革、优化营商环境的决策部署，适应新形势下海关监管工作的需要，海关总署对现行有效的海关规章进行了全面清理评估。本次修改涉及进出口商品检验、动植物检疫、食品安全、保税监管等多个业务领域的多部规章，旨在统一执法标准、简化办事程序、强化事中事后监管。修改决定的解读于2026年5月15日发布，对各项修改的背景、主要内容和实施要求进行了系统说明。</p>
            <h3>二、主要修改内容</h3>
            <p>本次规章修改主要涉及以下几个方面：（1）精简审批事项：取消和下放了一批行政审批事项，改为备案管理或告知承诺制，进一步降低企业制度性交易成本；（2）优化监管流程：简化部分检验检疫程序，推行电子化申报和无纸化通关，减少企业申报材料；（3）统一执法标准：对同类监管事项的执法程序、时限要求、文书格式等进行统一规范，减少执法随意性；（4）强化信用管理：将企业信用等级与监管措施挂钩，对高信用企业实施便利化措施，对失信企业实施严格管理；（5）完善罚则条款：根据上位法修订情况和执法实践需要，调整和完善相关罚则条款，增强可操作性。各修改条款的具体内容详见海关总署发布的修改决定原文及各修改后的规章文本。</p>
            <h3>三、企业重点关注事项</h3>
            <p>进出口企业应当重点关注以下几方面：（1）涉及行政审批事项调整的，应确认本企业所办理的业务是否属于取消审批或改为备案管理的范围，按照新要求办理相关手续；（2）涉及申报材料简化的，应当按照新规定准备申报材料，避免提交已被取消的材料导致申报超期；（3）涉及监管流程调整的，应当了解新的监管流程和时限要求，合理安排通关计划；（4）涉及信用管理的，应当关注本企业的信用等级及对应的监管措施，积极维护和提升信用等级。企业可通过海关总署官方网站、"互联网+海关"平台或所在地海关的业务窗口获取最新法规文本和办事指南。</p>
            <h3>四、实施时间与过渡安排</h3>
            <p>本次修改自修改决定公布之日起施行。部分涉及信息系统改造的条款，海关总署将设置合理的过渡期，确保系统升级期间企业业务的正常办理。在过渡期内，新旧规定并行适用，企业可选择按照规定更为便利的方式办理业务。海关总署将适时发布过渡期安排的具体通知，企业应密切关注并按要求执行。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/18/article_2026051809230359025.html"}]
    },

    {
        id: 21,
        title: "海关总署公告2026年第65号：防止埃博拉病毒病疫情传入我国",
        category: "通知公告",
        date: "2026-05-18",
        summary: "海关总署发布公告，就防止埃博拉病毒病疫情传入我国作出部署，对来自疫区的人员、交通工具、货物等实施检疫措施。",
        content: `
            <h3>一、公告背景</h3>
            <p>根据世界卫生组织（WHO）通报，近期非洲部分国家暴发埃博拉病毒病（Ebola Virus Disease, EVD）疫情，对国际公共卫生安全构成严重威胁。为严防埃博拉病毒病疫情传入我国，保护人民群众身体健康和生命安全，海关总署依据《中华人民共和国国境卫生检疫法》及其实施细则、《中华人民共和国传染病防治法》等法律法规，发布2026年第65号公告。本公告自2026年5月18日起施行，有效期6个月。</p>
            <h3>二、第一条：健康申报要求</h3>
            <p>来自埃博拉病毒病疫情发生国家或地区的人员，在入境时应当向出入境海关卫生检疫机关进行健康申报，如实填写《健康申明卡》，申报内容包括：14天内旅行史、埃博拉病毒病接触史、是否出现发热（体温≥37.3℃）、乏力、肌肉疼痛、头痛、咽痛、呕吐、腹泻、皮疹、出血等症状。海关卫生检疫人员将对上述人员进行体温监测、医学巡查和流行病学调查，发现可疑病例的，将按照口岸传染病排查处置相关规定转送指定医疗机构进行隔离诊治。入境人员应当主动配合海关卫生检疫工作，拒绝接受检疫查验或者隐瞒真实情况的，将依法承担相应法律责任。</p>
            <h3>三、第二条：交通工具防疫消毒要求</h3>
            <p>来自埃博拉病毒病疫情发生国家或地区的交通工具（包括但不限于航空器、船舶、列车、汽车等）负责人，在入境前应当向海关申报交通工具上的人员健康状况。入境后，应当按照海关要求将交通工具停靠在指定地点，接受海关实施的预防性消毒处理。在消毒处理完成前，未经海关许可，任何人员不得上下交通工具、装卸货物和物品。来自疫情发生国家或地区的集装箱、货物、行李物品、邮包快件等，根据风险评估情况，必要时由海关实施检疫处理。对可能被埃博拉病毒污染的上述物品，应当在海关监督下进行卫生处理，经检疫合格后方可放行。</p>
            <h3>四、第三条：旅行健康咨询服务</h3>
            <p>海关在口岸加强健康宣传和旅行健康咨询工作，为出入境人员提供埃博拉病毒病疫情防控知识。各直属海关及隶属海关将在口岸现场通过电子显示屏、宣传栏、宣传折页等多种方式，向出入境人员宣传埃博拉病毒病的传播途径、主要症状、预防措施等知识。海关所属国际旅行卫生保健中心将为前往埃博拉病毒病疫情发生国家或地区的人员提供健康咨询和预防建议，包括疫情动态信息、个人防护措施、回国后健康监测等内容。建议计划前往疫情发生国家或地区的人员，出行前到当地国际旅行卫生保健中心进行健康咨询，了解目的地疫情情况和相关防护知识。回国入境时如出现上述可疑症状，应主动向海关申报并接受医学排查。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/19/article_2026051908465759649.html"}]
    },

    {
        id: 22,
        title: "海关总署关于铁路、公路运输方式进口煤炭检验采信有关事项的解读",
        category: "通知公告",
        date: "2026-05-22",
        summary: "海关总署发布关于铁路和公路运输方式进口煤炭检验采信事项的政策解读，明确采信条件和程序。",
        content: `
            <h3>一、政策背景</h3>
            <p>为保障国内能源供应安全，提高进口煤炭通关效率，海关总署在充分调研和试点基础上，于2026年5月22日发布了关于铁路和公路运输方式进口煤炭检验采信有关事项的政策解读。该政策是海关总署深入推进"放管服"改革、优化口岸营商环境的重要举措，旨在通过检验采信机制减少重复检验，缩短通关时间，降低企业成本。</p>
            <h3>二、检验采信制度说明</h3>
            <p>检验采信是指海关依法将符合条件的第三方检验机构出具的检验报告作为评定进口煤炭是否符合国家技术规范强制性要求的依据。实施检验采信的进口煤炭，在通关环节可以凭第三方检验机构出具的品质、环保等项目的检验报告向海关申报，海关对采信范围内的检验项目不再实施批批抽样检验，有效减少货物在口岸的停留时间。适用检验采信的运输方式为铁路运输和公路运输两种，涵盖通过铁路口岸和公路口岸进口的煤炭货物。采信范围主要包括煤炭的发热量、灰分、硫分、水分、粒度等品质指标和环保指标。</p>
            <h3>三、第三方检验机构资质要求</h3>
            <p>从事进口煤炭检验采信业务的第三方检验机构须具备以下条件：（1）取得中国合格评定国家认可委员会（CNAS）认可或国际实验室认可合作组织（ILAC）互认协议成员的认可；（2）具备煤炭检验检测能力，认可范围应当涵盖进口煤炭检验采信所需的检验检测项目；（3）在进口煤炭的主要口岸设有分支机构或指定实验室，能够按照约定时限出具检验报告；（4）具备完善的内部质量控制体系和公正性保证措施。海关总署对符合条件的检验机构实施备案管理并向社会公布名单。备案检验机构应当持续符合资质条件，接受海关的监督检查。</p>
            <h3>四、企业操作指引</h3>
            <p>进口企业如需适用检验采信制度，应当按照以下步骤操作：（1）选择海关备案公布的第三方检验机构，签订委托检验合同；（2）在煤炭装运前或装运时委托检验机构进行检验并取得检验报告；（3）在向海关申报时提交检验采信申请并将检验报告信息录入海关系统；（4）海关审核采信申请及检验报告，符合条件的予以采信并快速放行。企业在选择检验机构时应注意核对机构备案状态和认可范围，确保检验报告的有效性。海关将对采信情况进行后续核查，发现检验机构出具虚假检验报告或企业弄虚作假的，将依法追究相关法律责任并取消检验采信资格。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/22/article_2026052222331519877.html"}]
    },

    {
        id: 23,
        title: "海关总署 农业农村部公告2026年第59号：防止莱索托非洲马瘟传入我国",
        category: "通知公告",
        date: "2026-05-07",
        summary: "联合公告就防止莱索托非洲马瘟传入我国作出规定，禁止直接或间接从莱索托输入马属动物及其相关产品。",
        content: `
            <h3>一、公告背景</h3>
            <p>根据世界动物卫生组织（WOAH）通报，莱索托王国近期暴发非洲马瘟（African Horse Sickness, AHS）疫情。非洲马瘟是由非洲马瘟病毒引起的一种马属动物急性或亚急性虫媒传染病，具有发病急、死亡率高（可达90%以上）的特点，被WOAH列为必须通报的动物疫病，我国将其列为一类动物疫病。为保护我国畜牧业生产安全和公共卫生安全，防止非洲马瘟疫情传入我国，海关总署和农业农村部依据《中华人民共和国进出境动植物检疫法》及其实施条例、《中华人民共和国动物防疫法》等法律法规，联合发布2026年第59号公告，自2026年5月7日起实施。</p>
            <h3>二、公告全文（六项措施）</h3>
            <p><strong>一、禁止直接或间接从莱索托输入马属动物及其相关产品。</strong>马属动物包括马、驴、骡等，相关产品包括马属动物的精液、胚胎、肉及其制品、皮张、鬃毛、蹄角等可传播非洲马瘟病毒的产品。各口岸海关和农业农村部门应加强对来自莱索托的货物、物品的查验，严防上述禁止进境物以伪报、夹藏等方式非法进境。</p>
            <p><strong>二、禁止寄递或携带来自莱索托的马属动物及其相关产品入境。</strong>各进出境邮件处理中心和旅检现场应加强对来自莱索托的邮件、快件和旅客携带物品的检查，一旦发现上述禁止进境物，一律作退回或销毁处理。进出境人员应主动了解并遵守上述规定。</p>
            <p><strong>三、来自莱索托的进境船舶、航空器等运输工具上卸下的动植物性废弃物、泔水等，一律在海关监督下作除害处理。</strong>运输工具负责人应当主动向海关申报，并配合做好废弃物的收集和除害处理工作。不得擅自抛弃、排放或处理上述废弃物，防止造成环境污染和疫情传播。</p>
            <p><strong>四、对来自莱索托的进境运输工具实施防疫消毒处理。</strong>航空器、船舶、列车、汽车等运输工具入境时，应当按照海关指定地点停放（靠），由海关实施预防性消毒处理。运输工具负责人应当为消毒处理工作提供必要的便利和配合。</p>
            <p><strong>五、对非法入境的来自莱索托的马属动物及其相关产品，一律在海关监督下作销毁处理。</strong>对通过夹藏、伪报、瞒报等非法方式进境的上述禁止进境物，一经查获，由海关在入境口岸监督实施销毁处理，所需费用由当事人承担。情节严重的，海关将依据有关法律法规追究当事人的法律责任。</p>
            <p><strong>六、凡违反上述规定者，由海关依照《中华人民共和国进出境动植物检疫法》及其实施条例、《中华人民共和国动物防疫法》等有关法律法规的规定处理，依法追究法律责任。</strong>构成犯罪的，依法移送司法机关追究刑事责任。</p>
            <h3>三、实施影响与建议</h3>
            <p>本公告发布后涉及以下影响：（1）各口岸海关将加强对来自莱索托的运输工具、货物、物品的查验和检疫处理工作，可能对相关航线和班列的装卸、通关时间产生一定影响；（2）在莱索托从事马属动物及相关产品贸易的企业应暂停相关进出口业务，及时调整贸易计划；（3）邮政企业和快递企业应加强对来自莱索托邮件的收寄查验，避免收寄禁限物品；（4）进出境旅客应了解并遵守相关规定，不要携带或邮寄来自莱索托的马属动物及其相关产品。企业如有特殊业务需求，可向所在地直属海关咨询了解具体执行要求。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/13/article_2026051308235444475.html"}]
    },

    {
        id: 24,
        title: "海关总署 农业农村部公告2026年第56号：防止阿根廷痒病传入我国",
        category: "通知公告",
        date: "2026-04-29",
        summary: "联合公告防止阿根廷痒病（羊瘙痒病）传入我国，禁止从阿根廷输入羊及其相关产品。",
        content: `
            <h3>一、公告背景</h3>
            <p>根据世界动物卫生组织（WOAH）通报，阿根廷共和国近期发生痒病（Scrapie，又称羊瘙痒病）疫情。痒病是由朊病毒（Prion）引起的成年绵羊和山羊的一种慢性、进行性、致死性神经系统疾病，属于传染性海绵状脑病（TSE），世界动物卫生组织将其列为必须通报的动物疫病，我国将其列为一类动物疫病。为保护我国畜牧业安全和公共卫生安全，海关总署和农业农村部联合发布2026年第56号公告，自2026年4月29日起实施。</p>
            <h3>二、禁止进境措施</h3>
            <p>公告规定，禁止直接或间接从阿根廷输入羊及其相关产品。羊包括绵羊和山羊，相关产品包括羊的精液、胚胎、肉及其制品、皮张、毛绒、内脏等可传播痒病病原体的产品。停止签发从阿根廷进口羊及其相关产品的《进境动植物检疫许可证》，已签发的许可证自动失效。对来自阿根廷的运输工具（包括船舶、航空器、列车、汽车等）中卸下的动植物性废弃物、泔水等，一律在海关监督下作除害处理，不得擅自抛弃。</p>
            <h3>三、检疫处理要求</h3>
            <p>对来自阿根廷的进境运输工具实施防疫消毒处理。来自阿根廷的进境运输工具上如发现有羊及其相关产品，一律作退回或销毁处理。以任何方式（包括但不限于夹藏、伪报、瞒报、邮寄、携带等）非法入境的来自阿根廷的羊及其相关产品，一经查获，由海关在入境口岸监督销毁，所需费用由当事人承担。凡违反上述规定者，由海关依照《中华人民共和国进出境动植物检疫法》及其实施条例、《中华人民共和国动物防疫法》等法律法规予以处理。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/08/article_2026050814023312718.html"}]
    },

    {
        id: 25,
        title: "海关总署公告2026年第55号：进口西班牙开心果和无花果干检验检疫要求",
        category: "通知公告",
        date: "2026-04-28",
        summary: "海关总署发布关于西班牙开心果和无花果干输华检验检疫和卫生要求的公告，允许符合要求的西班牙开心果和无花果干进口。",
        content: `
            <h3>一、公告背景</h3>
            <p>根据我国相关法律法规和中华人民共和国海关总署与西班牙王国农业、渔业和食品部关于西班牙开心果和无花果干输华检验检疫与卫生要求的规定，海关总署发布2026年第55号公告，自2026年4月28日起实施，允许符合相关要求的西班牙开心果和无花果干进口。此举有助于丰富国内干果市场供应，满足消费者多元化需求。</p>
            <h3>二、检验检疫要求</h3>
            <p>西班牙输华开心果和无花果干应当符合以下检验检疫和卫生要求：（1）产地管理：开心果和无花果干须来自经西班牙官方注册的加工企业和种植基地，种植基地在生长季节应当实施有害生物监测和控制措施；（2）加工储运：产品应当经过挑选、分级、干燥等加工处理，加工和储运过程中应当采取有效的卫生措施，防止有害生物侵染和霉变；（3）质量安全：产品应当符合中国食品安全国家标准，不得带有中方关注的检疫性有害生物，不得含有违禁农药残留，真菌毒素含量不得超过限量标准。</p>
            <h3>三、证书与标识要求</h3>
            <p>每批西班牙输华开心果和无花果干应随附西班牙官方出具的植物检疫证书，证书中应注明该批产品符合中方检验检疫要求。包装应当使用新的、干净卫生的材料，包装上应标注产品名称、产地、生产日期、保质期以及生产企业或出口商信息。货物入境时海关将进行证单核查和现场查验，必要时抽样送实验室进行安全卫生项目检测。经检验检疫合格的准予入境，不合格的依法作退运或销毁处理。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-04/30/article_2026043011233012449.html"}]
    },

    {
        id: 26,
        title: "海关总署公告2026年第54号：非洲国家零关税项下进口货物原产地管理规定",
        category: "通知公告",
        date: "2026-04-28",
        summary: "海关总署公布对同中国建交的20个不属于最不发达国家的非洲国家实施零关税项下进口货物的原产地管理规定。",
        content: `
            <h3>一、公告背景</h3>
            <p>根据国家有关对非政策安排，我国自2025年12月1日起对同中国建交的20个不属于最不发达国家的非洲国家实施零关税待遇。为规范上述国家零关税项下进口货物的原产地管理，海关总署根据《中华人民共和国进出口关税条例》《中华人民共和国海关进出口货物优惠原产地管理规定》等法律法规，发布2026年第54号公告，自2026年4月28日起实施。</p>
            <h3>二、原产地规则</h3>
            <p>享受零关税待遇的进口货物应当符合以下原产地规则：（1）完全获得标准：货物完全在受惠国境内获得或者生产的，视为受惠国原产货物；（2）实质性改变标准：货物在受惠国境内使用非原产材料生产，但经加工后发生实质性改变的，视为受惠国原产货物。实质性改变的判定采用税则归类改变标准，即经过加工后货物在《商品名称及编码协调制度》中前4位数级税则号列发生改变的。如使用其他补充标准（如区域价值成分不低于40%等），应当符合公告规定。</p>
            <h3>三、直接运输与证书要求</h3>
            <p>零关税项下进口货物应当从受惠国直接运输至中国境内。途经第三国（地区）转运的，应当满足以下条件：（1）货物在过境地未进行交易或者消费；（2）除装卸、重新包装或者为使货物保持良好状态所必需的处理外，未进行其他处理；（3）在过境地停留时间未超过3个月。进口申报时应当提交受惠国指定机构签发的有效原产地证书正本，证书格式应当符合公告附件规定。原产地证书自签发之日起1年内有效。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-04/29/article_2026042908570039662.html"}]
    },

    {
        id: 27,
        title: "海关总署公告2026年第53号：进口英国食用水生动物检疫和卫生要求",
        category: "通知公告",
        date: "2026-04-27",
        summary: "海关总署发布关于英国食用水生动物输华检疫和卫生要求的公告，允许符合要求的英国食用水生动物进口。",
        content: `
            <h3>一、公告背景</h3>
            <p>根据中华人民共和国海关总署与大不列颠及北爱尔兰联合王国环境、食品和农村事务部关于英国食用水生动物输华检疫和卫生要求的规定，海关总署发布2026年第53号公告，自2026年4月27日起实施，允许符合相关要求的英国食用水生动物进口。</p>
            <h3>二、适用范围与境外要求</h3>
            <p>公告适用于英国输华的食用水生动物，包括活鱼类、活甲壳类（虾、蟹等）、活软体类（贝类、螺类等）等。英国输华食用水生动物须符合以下条件：（1）来自经中国海关总署注册的境外养殖场或加工企业；（2）养殖场和加工企业的卫生条件应当符合中方要求，建立并有效运行HACCP等食品安全管理体系；（3）养殖用水应当符合水产养殖水质标准，不得使用中国禁止使用的药物和化学物质；（4）产品应当在英国官方监督下进行加工和储运。</p>
            <h3>三、进口检验检疫</h3>
            <p>每批英国输华食用水生动物应当随附英国官方出具的卫生证书，证书应注明产品符合中方检疫和卫生要求的声明。产品包装应当使用新的、清洁卫生的材料，符合国际运输规范。货物入境时，海关将进行单证审核、现场查验和实验室检测。重点检查产品是否鲜活、有无异常死亡、体表是否完好、有无可见寄生虫等。必要时抽样检测药物残留、重金属、致病菌等安全卫生项目。检验检疫合格的予以放行，不合格的作退运、销毁或无害化处理。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-04/30/article_2026043011163626452.html"}]
    },

    {
        id: 28,
        title: "海关总署公告2026年第52号：进口越南鲜食柚子和莱檬植物检疫要求",
        category: "通知公告",
        date: "2026-04-27",
        summary: "海关总署发布关于越南鲜食柚子和莱檬输华植物检疫要求的公告，允许符合要求的越南鲜食柚子和莱檬进口。",
        content: `
            <h3>一、公告背景</h3>
            <p>根据我国相关法律法规和中华人民共和国海关总署与越南社会主义共和国农业与农村发展部关于越南鲜食柚子和莱檬输华植物检疫要求的规定，海关总署发布2026年第52号公告，自2026年4月27日起实施，允许符合相关要求的越南鲜食柚子和莱檬进口。</p>
            <h3>二、植物检疫要求</h3>
            <p>越南输华鲜食柚子和莱檬应当符合以下植物检疫要求：（1）果园管理：果园应当实施良好农业规范（GAP），在越南官方注册登记并接受监管，实施中方关注的检疫性有害生物的监测与控制措施；（2）包装加工：包装厂应当在越南官方注册登记，具有良好的卫生条件和管理制度。包装前果实应当经过清洗、挑选和分级，去除枝叶、土壤等杂质；（3）出口前检疫处理：针对中方关注的检疫性有害生物，越方应当在出口前对果实实施有效的检疫处理措施，确保不带上述有害生物。</p>
            <h3>三、证书标识与入境查验</h3>
            <p>每批越南输华鲜食柚子和莱檬应随附越南官方出具的植物检疫证书，证书中应注明该批产品符合中方植物检疫要求并经检疫处理合格。包装箱上应用中文或英文标注产品名称、产地、果园和包装厂注册号以及"输往中华人民共和国"字样。货物入境时海关将进行证单核查和现场查验，重点检查是否携带检疫性有害生物、农药残留是否超标等。经检疫合格的准予入境，不合格的依法作除害处理、退运或销毁处理。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-04/29/article_2026042908442950150.html"}]
    },

    {
        id: 29,
        title: "海关总署公告2026年第51号：进口西班牙动物蛋白饲料检疫和卫生要求",
        category: "通知公告",
        date: "2026-04-24",
        summary: "海关总署发布关于西班牙动物蛋白饲料输华检疫和卫生要求的公告，规范进口西班牙动物蛋白饲料的检疫工作。",
        content: `
            <h3>一、公告背景</h3>
            <p>根据我国相关法律法规和中华人民共和国海关总署与西班牙王国农业、渔业和食品部关于西班牙动物蛋白饲料输华检疫和卫生要求的规定，海关总署发布2026年第51号公告，自2026年4月24日起实施，规范西班牙动物蛋白饲料输华的检疫工作。</p>
            <h3>二、生产企业要求</h3>
            <p>西班牙输华动物蛋白饲料的生产企业应当经中国海关总署注册登记，并符合以下条件：（1）企业应通过西班牙官方主管部门的批准和持续监管，建立并有效运行危害分析与关键控制点（HACCP）管理体系；（2）原料来源应当安全可控，只能使用经官方兽医检验合格、适合人类食用的动物源性原料，不得使用禁止的动物源性原料（如反刍动物源性蛋白用于反刍动物饲料）；（3）加工过程中应实施充分的热处理，确保有效杀灭病原微生物；（4）产品应当储存在专用仓库内，防止交叉污染。</p>
            <h3>三、产品安全与进口检验</h3>
            <p>产品应当符合中国饲料卫生标准，不得含有违禁药物、病原微生物和超过限量标准的有害物质。每批输华动物蛋白饲料应随附西班牙官方出具的兽医卫生证书，声明产品符合中方检疫和卫生要求。货物入境时，海关将核查官方证书、审核标签标识、查验货物状态，并抽样检测卫生安全项目。重点检测沙门氏菌、肠杆菌科、二噁英及二噁英类多氯联苯等指标。检验检疫合格的准予入境，不合格的依法退运或销毁。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-04/29/article_2026042908353655600.html"}]
    },

    {
        id: 30,
        title: "海关总署公告2026年第50号：进口非洲干辣椒植物检疫要求",
        category: "通知公告",
        date: "2026-04-26",
        summary: "海关总署发布关于非洲干辣椒输华植物检疫要求的公告，允许符合检疫要求的非洲干辣椒进口。",
        content: `
            <h3>一、公告背景</h3>
            <p>根据我国相关法律法规和中华人民共和国海关总署与非洲相关国家政府主管部门关于非洲干辣椒输华植物检疫要求的规定，海关总署发布2026年第50号公告，自2026年4月26日起实施，允许符合相关植物检疫要求的非洲干辣椒进口。</p>
            <h3>二、植物检疫要求</h3>
            <p>非洲输华干辣椒应当符合以下植物检疫要求：（1）产地管理：干辣椒须来自出口国官方注册的种植基地，种植基地应当实施中方关注的检疫性有害生物的监测与控制措施，记录保存至少2年；（2）加工储运：干辣椒应当在出口国注册的加工厂进行干燥、剔除杂质、分级等加工处理，加工和储运过程中应防止有害生物侵染和霉变。产品应当储存在干燥、通风、防虫的仓库内，运输工具应当清洁卫生；（3）特定有害生物防控：鉴于干辣椒可能携带辣椒实蝇（Bactrocera latifrons）、烟草甲（Lasioderma serricorne）等检疫性有害生物，加工过程中应当采取有效措施杀灭上述有害生物。</p>
            <h3>三、进口检验要求</h3>
            <p>每批非洲输华干辣椒应随附出口国官方出具的植物检疫证书，证书中应注明该批产品符合中方植物检疫要求且不带有中方关注的检疫性有害生物的声明。货物入境时海关将进行单证审核、现场查验和实验室检测。重点检查是否携带活虫、虫卵、杂草种子等，并抽样检测农药残留和真菌毒素。经检疫合格的予以放行，不合格的依法进行检疫除害处理或退运、销毁。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-04/29/article_2026042908410898954.html"}]
    },

    {
        id: 31,
        title: "海关总署公告2026年第47号：进口南非鲜食柑橘植物检疫补充要求",
        category: "通知公告",
        date: "2026-04-22",
        summary: "海关总署发布关于南非鲜食柑橘输华植物检疫补充要求的公告，对原有检疫要求进行补充完善。",
        content: `
            <h3>一、公告背景</h3>
            <p>为确保南非鲜食柑橘输华的植物检疫安全，进一步完善原有检疫要求，海关总署在总结前期进口检疫工作经验的基础上，发布2026年第47号公告，明确了南非鲜食柑橘输华植物检疫的补充要求，自2026年4月22日起实施。</p>
            <h3>二、补充要求内容</h3>
            <p>在原有检疫要求基础上，补充增加以下要求：（1）产地冷处理：所有输华鲜食柑橘须在原产地进行冷处理（Cold Treatment），温度和时间应符合中方规定的技术参数，以杀灭实蝇等检疫性有害生物。冷处理数据应记录在案，供中方核查；（2）果园注册登记：输华柑橘须来自南非官方注册并向中方通报的注册果园，注册果园应持续符合良好农业规范要求并接受官方监管；（3）包装标识要求：每个包装箱上应用英文标注"To the People's Republic of China"，并标明果园注册号、包装厂注册号或品牌信息。</p>
            <h3>三、实施监督</h3>
            <p>南非官方应对注册果园和包装厂实施年度审核，并将审核情况通报中方。中方将根据进口检疫情况，适时派检疫官员赴南非对输华柑橘的产地管理、冷处理和检疫工作进行回顾性考察。入境时海关将核查植物检疫证书和冷处理记录，对不符合要求的货物依法作除害处理、退运或销毁处理。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-04/24/article_2026042414020263788.html"}]
    },

    {
        id: 32,
        title: "海关总署公告2026年第23号：扩大公路跨境快速通关改革适用范围至南宁关区",
        category: "通知公告",
        date: "2026-02-27",
        summary: "海关总署宣布将公路跨境快速通关改革适用范围扩大至南宁关区，进一步推动西部陆海新通道建设。",
        content: `
            <h3>一、公告背景</h3>
            <p>为贯彻落实国家关于推动西部陆海新通道建设的战略部署，进一步提升跨境公路运输通关效率，海关总署在前期公路跨境快速通关改革试点成功的基础上，发布2026年第23号公告，决定将改革适用范围扩大至南宁关区，自2026年2月27日起实施。</p>
            <h3>二、快速通关模式说明</h3>
            <p>公路跨境快速通关改革通过信息化手段实现海关与口岸运输企业的数据共享和业务协同。在快速通关模式下，企业可提前向海关传输货物电子信息，海关运用大数据分析进行风险评估和分类处置，实现低风险货物"秒级"放行。货物到达口岸后，系统自动核放，无需停车排队等候人工查验，大幅缩短货物在口岸的停留时间。适用快速通关的进出口货物范围包括一般贸易货物、保税货物和跨境电商货物等。</p>
            <h3>三、企业参与条件与申报要求</h3>
            <p>企业参与公路跨境快速通关应当满足以下条件：（1）在海关企业信用管理系统中认证为一般认证企业及以上信用等级；（2）具备与海关系统对接的信息化条件，能够按要求传输货物通关数据；（3）遵守海关各项监管规定，近一年内无重大走私违规记录。符合条件的南宁关区企业可通过"中国国际贸易单一窗口"向主管海关提出参与申请，经海关审核同意后开通快速通关资格。企业在使用快速通关模式时应确保申报数据真实、准确、完整。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/?agt=2758"}]
    },

    {
        id: 33,
        title: "海关总署公告2026年第19号：河套深港科技创新合作区深圳园区进口货物免税管理办法",
        category: "通知公告",
        date: "2026-02-09",
        summary: "海关总署发布《中华人民共和国海关对河套深港科技创新合作区深圳园区进口货物免税管理办法》。",
        content: `
            <h3>一、公告背景</h3>
            <p>为支持河套深港科技创新合作区建设，促进深港科技创新协同发展，海关总署根据《国务院关于河套深港科技创新合作区发展规划的批复》精神，制定并发布《中华人民共和国海关对河套深港科技创新合作区深圳园区进口货物免税管理办法》，以公告2026年第19号形式公布，自2026年2月9日起实施。</p>
            <h3>二、适用范围与免税条件</h3>
            <p>办法适用于河套深港科技创新合作区深圳园区内注册登记的科研机构、高等院校、科技企业等单位进口用于科学研究、技术开发、教育教学等用途的货物。享受免税政策的进口货物包括：（1）科学研究、技术开发和教育教学所需的仪器设备及其零部件、元器件；（2）实验用的试剂、材料、消耗品等；（3）用于科技馆、图书馆等公益设施的进口设备。上述货物在海关核定的合理数量范围内免征进口关税和进口环节增值税、消费税。免税进口货物应当专用于核定用途，未经海关批准不得转让、移作他用或进行其他处置。</p>
            <h3>三、申报与监管要求</h3>
            <p>进口单位应当通过"中国国际贸易单一窗口"向海关办理免税进口货物的申报手续，填写《进出口货物征免税申请表》，并提交相关证明材料。海关对免税进口货物实施后续监管，监管年限按照海关规定执行。在监管年限内，进口单位应按规定向海关报送货物使用情况年度报告。海关将定期或不定期对免税进口货物的使用情况进行核查，发现违规行为的，依法处理并追缴已减免的税款。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-02/11/article_2026021109380535582.html"}]
    },

    {
        id: 34,
        title: "海关总署公告2026年第18号：海南自由贸易港岛内居民消费零关税进境商品监管暂行办法",
        category: "通知公告",
        date: "2026-02-09",
        summary: "海关总署发布海南自由贸易港岛内居民消费零关税进境商品经营场所及商品的监管暂行办法。",
        content: `
            <h3>一、公告背景</h3>
            <p>为贯彻落实《海南自由贸易港建设总体方案》和《海南自由贸易港法》关于"对岛内居民消费的进境商品，实行正面清单管理，允许岛内免税购买"的规定，海关总署制定了《海南自由贸易港岛内居民消费零关税进境商品监管暂行办法》，以公告2026年第18号形式发布，自2026年2月9日起实施。</p>
            <h3>二、商品范围与经营场所管理</h3>
            <p>零关税进境商品实行正面清单管理，由财政部、海关总署、税务总局会同有关部门制定并公布。列入正面清单的商品应当为岛内居民日常生活消费品，不包括国家禁止进口的商品以及不符合海南自由贸易港产业发展方向的商品。经营零关税进境商品的场所（以下简称"经营场所"）应当经海关验收合格，具备满足海关监管要求的隔离设施、信息化管理系统（与海关联网）、视频监控设备、专用仓库等条件。经营企业应当建立完善的进销存管理系统，确保商品来源、去向可追溯。</p>
            <h3>三、购买与通关监管</h3>
            <p>在海南自由贸易港内有户籍或者在海南自由贸易港缴纳社会保险或者个人所得税的岛内居民，可以在海关认可的经营场所购买零关税进境商品，每人每年享有规定的免税购物额度。购买时经营场所应当核验购买人的身份信息并录入海关监管系统。零关税进境商品从境外进入海南自由贸易港时，海关按照"一线放开"的原则实施监管；商品在"二线"出岛时，海关按照相关规定查验并征收相应税款。经营场所和购买人不得将零关税进境商品以任何方式转售或带离海南自由贸易港。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-02/11/article_2026021109323431211.html"}]
    },

    {
        id: 35,
        title: "海关总署公告2026年第13号：执行《鼓励外商投资产业目录(2025年版)》有关事项",
        category: "通知公告",
        date: "2026-01-27",
        summary: "海关总署发布关于执行《鼓励外商投资产业目录(2025年版)》有关事项的公告，明确相关商品进口税收优惠的执行。",
        content: `
            <h3>一、公告背景</h3>
            <p>经国务院批准，《鼓励外商投资产业目录（2025年版）》已发布实施。为贯彻落实目录规定的进口税收优惠政策，海关总署发布2026年第13号公告，明确外商投资企业在鼓励类项目下进口自用设备享受税收优惠的具体申报要求和审核程序，自2026年1月27日起实施。</p>
            <h3>二、适用范围</h3>
            <p>在《鼓励外商投资产业目录（2025年版）》范围内的外商投资项目（包括增资项目），在投资总额内进口的自用设备（按照合同随设备进口的技术及配套件、备件），除《外商投资项目不予免税的进口商品目录》和《进口不予免税的重大技术装备和产品目录》所列商品外，免征关税。上述进口设备也免征进口环节增值税，但国家另有规定不予免税的除外。目录范围以外的外商投资项目，不适用上述免税政策。</p>
            <h3>三、申报程序与后续管理</h3>
            <p>外商投资企业应在货物进口前向主管海关办理减免税申请手续，提交《进出口货物征免税申请表》、项目主管部门出具的《国家鼓励发展的内外资项目确认书》等材料。海关审核后出具《进出口货物征免税证明》，企业凭此证明办理进口通关手续。免税进口设备在海关监管年限内（一般为3年），应专用于本企业的鼓励类项目，未经海关批准并补缴税款，不得擅自转让、出租、抵押或移作他用。海关将依法对免税进口设备的使用情况进行后续监管和定期核查。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/302249/302266/2011fa33-2.html"}]
    },

    {
        id: 36,
        title: "海关总署公告2026年第12号：启动进出口货物多式联运（海铁、水水）中转模式",
        category: "通知公告",
        date: "2026-01-27",
        summary: "海关总署发布关于启动进出口货物多式联运（海铁、水水）中转模式的公告，进一步推动多式联运发展。",
        content: `
            <h3>一、公告背景</h3>
            <p>为贯彻落实国家关于推进多式联运发展优化调整运输结构的决策部署，海关总署在充分调研和试点基础上，发布2026年第12号公告，决定启动进出口货物多式联运（海铁、水水）中转模式，自2026年1月27日起实施。该模式旨在简化多式联运中转环节的海关手续，优化口岸营商环境，降低企业物流成本。</p>
            <h3>二、模式内容与适用范围</h3>
            <p>多式联运中转模式适用于经海运入境后需转由铁路运输至内陆目的地的进口货物（海铁联运），以及经海运入境后需转由内河水路运输至内陆目的地的进口货物（水水联运）；同时也适用于反向的出口货物。在传统模式下，货物在口岸换装时需要分别办理出入境和转运两套海关手续。实行多式联运中转模式后，企业可凭一份联运提单和一次申报完成全部通关手续，货物在口岸换装环节在海关信息化系统监控下直接转运，无需进行二次报关和查验（低风险货物），显著缩短转运时间。</p>
            <h3>三、企业参与要求</h3>
            <p>参与多式联运中转模式的企业应当满足以下条件：（1）具备海铁或水水联运的实际运输能力和资质；（2）企业信用等级为海关一般认证企业及以上；（3）建立符合海关要求的信息化管理体系，能够实现与海关系统的数据对接；（4）使用符合国际标准的海铁或水水联运提单。企业可通过"中国国际贸易单一窗口"向主管海关提出参与申请，经海关审核同意后开通联运中转资格。在运输过程中，企业应确保货物全程处于海关监管之下，不得擅自开拆、调换或损毁海关封志。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/302249/302266/2011fa33-2.html"}]
    },

    {
        id: 37,
        title: "执行2026年关税调整方案及有关事宜公告的解读",
        category: "通知公告",
        date: "2025-12-31",
        summary: "经国务院批准，《2026年关税调整方案》自2026年1月1日起实施，海关总署公布有关执行事宜的公告解读。",
        content: `
            <h3>一、方案背景</h3>
            <p>经国务院批准，国务院关税税则委员会发布《2026年关税调整方案》，自2026年1月1日起实施。为方便进出口企业准确理解和执行方案内容，海关总署于2025年12月31日发布了有关执行事宜的公告解读，明确了关税调整后相关商品编号申报等有关事项。</p>
            <h3>二、主要调整内容</h3>
            <p>2026年关税调整方案主要涉及以下方面：（1）进口暂定税率调整：根据国内产业发展和供需情况变化，对部分商品实施低于最惠国税率的进口暂定税率；（2）信息技术产品降税：根据《信息技术协定》扩围产品降税安排，继续降低相关商品的最惠国税率；（3）协定税率调整：根据我国与有关国家或地区签署的自由贸易协定和优惠贸易安排，对原产于有关国家或地区的进口货物实施协定税率；（4）税则税目调整：根据产业发展和科学技术进步需要，调整部分商品的税则税目设置和归类规则。</p>
            <h3>三、企业注意事项</h3>
            <p>进出口企业应注意以下事项：（1）及时查询2026年版《中华人民共和国进出口税则》，确认所经营商品的税则号列和适用税率是否发生变化；（2）对于税目调整的商品，应根据新的税则归类规则重新确定商品编码，确保申报准确；（3）对于享受协定税率的进出口货物，应按照新版原产地规则和相关证书要求办理；（4）已签发的原产地证书在过渡期内继续有效，具体安排详见海关总署相关公告。企业如有疑问，可向所在地海关或通过"互联网+海关"平台进行咨询。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2025-12/31/article_2025123119401553789.html"}]
    },

    {
        id: 38,
        title: "进口西班牙动物蛋白肥料检疫和卫生要求的公告",
        category: "通知公告",
        date: "2026-05-14",
        summary: "海关总署发布关于进口西班牙动物蛋白肥料检疫和卫生要求的政策解读，明确进口条件和检验检疫程序。",
        content: `
            <h3>一、公告背景</h3>
            <p>根据我国相关法律法规和中华人民共和国海关总署与西班牙王国农业、渔业和食品部关于西班牙动物蛋白肥料输华检疫和卫生要求的规定，海关总署委托相关部门对进口西班牙动物蛋白肥料的检验检疫和卫生要求进行了技术评估。2026年5月14日海关总署发布相关政策解读，对西班牙动物蛋白肥料输华的具体要求进行了详细说明。</p>
            <h3>二、境外生产企业要求</h3>
            <p>西班牙输华动物蛋白肥料的生产企业应当经中国海关总署注册登记，并具备以下条件：（1）通过西班牙官方主管部门的批准和监督，建立完善的质量管理体系；（2）原料来源应为经官方兽医检验合格的动物源性材料，不得使用禁用原料，加工过程中应经过充分的热处理（如蒸汽水解、高温高压等），确保灭活病原微生物和朊病毒等风险因子；（3）产品应经过质量检测，确保符合中国肥料登记标准和相关安全卫生标准。</p>
            <h3>三、进口检验检疫</h3>
            <p>每批输华动物蛋白肥料应随附西班牙官方出具的植物检疫证书或兽医卫生证书，声明产品已经过规定的处理工艺并符合中方检验检疫要求。货物入境时海关将核查官方证书和产品标签信息，并进行现场查验和抽样检测。重点检测病原微生物指标、重金属含量、有机污染物等安全卫生项目。经检验检疫合格的准予入境和销售使用，不合格的依法退运或销毁处理。进口企业应建立产品销售和使用流向记录，便于追溯。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/14/article_2026051418232375138.html"}]
    },

    {
        id: 39,
        title: "海关总署公告2026年第1号：进口法国苜蓿草检验检疫要求",
        category: "通知公告",
        date: "2026-01-05",
        summary: "海关总署2026年第1号公告，发布关于法国苜蓿草输华检验检疫要求的公告。",
        content: `
            <h3>一、公告背景</h3>
            <p>根据我国相关法律法规和中华人民共和国海关总署与法兰西共和国农业与食品主权部关于法国苜蓿草输华检验检疫要求的规定，海关总署发布2026年第1号公告，自2026年1月5日起实施，允许符合相关要求的法国苜蓿草进口。</p>
            <h3>二、检验检疫要求</h3>
            <p>法国输华苜蓿草应当符合以下检验检疫要求：（1）产地管理：苜蓿草须来自经法国官方注册的种植基地和加工企业，种植基地应当实施中方关注的检疫性有害生物和有毒杂草的监测与控制措施；（2）加工储运：苜蓿草应当经过干燥、压缩（打包或制粒）等加工处理，水分含量符合储存运输要求，加工和储运过程中应防止有害生物侵染和霉变。产品应储存在干燥、防雨的仓库内，运输工具应清洁卫生；（3）不得带有土壤、动物粪便、有害杂草种子以及中方关注的检疫性有害生物。</p>
            <h3>三、进口程序</h3>
            <p>每批法国输华苜蓿草应随附法国官方出具的植物检疫证书，证书中应注明该批产品符合中方检验检疫要求的声明并标注产地和加工企业信息。货物入境前应取得《进境动植物检疫许可证》。货物到达口岸时海关将进行证单审核、现场查验并抽样送实验室检测，重点检查是否携带检疫性有害生物和有毒杂草种子。经检疫合格的准予入境，不合格的依法进行除害处理、退运或销毁。</p>
        `,
        author: "海关总署", pinned: false,
        links: [{title:"政策解读", url:"http://shenzhen.customs.gov.cn/nanning_customs/600356/fdzdgknr6792/zcjd14/6998503/index.html"}]
    },

    {
        id: 52,
        title: "电子口岸IC卡（电子口岸法人卡/操作员卡）办理流程",
        category: "办事指南",
        date: "2026-05-22",
        summary: "企业完成海关备案后，可申请办理电子口岸IC卡（法人卡和操作员卡），用于登录中国国际贸易单一窗口、海关政务服务平台等进行报关、结关等业务操作。",
        content: `
            <h3>一、什么是电子口岸IC卡</h3>
            <p>电子口岸IC卡是企业登录中国电子口岸相关业务系统（如单一窗口、互联网+海关等）的身份认证介质，分为法人卡（主卡）和操作员卡。</p>
            <h3>二、申领条件</h3>

            <p>1. 通过"中国电子口岸"网站或"中国国际贸易单一窗口"提交制卡申请；</p>
            <p>2. 在线填写企业信息、法人信息和操作员信息；</p>
            <p>3. 选择领取方式：邮寄领取或柜台领取；</p>
            <p>4. 部分地区支持合作制卡代理点就近办理。</p>

    {
        id: 53,
        title: "进境（过境）动植物及其产品检疫审批办事指南",
        category: "办事指南",
        date: "2026-05-22",
        summary: "输入动物、动物产品、植物种子种苗、粮食、水果、饲料等需事先申请办理检疫审批，取得《中华人民共和国进境动植物检疫许可证》。申报通过海关政务服务平台在线办理。",
        content: `
            <h3>一、事项名称</h3>
            <p>过境动物、进境特定动植物及其产品检疫审批</p>
            <h3>二、设定依据</h3>
            <p>1.《中华人民共和国进出境动植物检疫法》第十条</p>
            <p>2.《中华人民共和国进出境动植物检疫法实施条例》第九条</p>
            <p>3.《进境动植物检疫审批管理办法》（海关总署令第262号修改）</p>
            <h3>三、适用范围</h3>
            <p>进境活动物（含动物遗传物质）、非食用动物产品、生物材料、粮食（含大豆、小麦等）、水果、烟叶、饲料及饲料添加剂、水生动物、过境动物等。</p>
            <h3>四、申请条件</h3>
            <p>1. 申请单位应具有独立法人资格并直接对外签订贸易合同或协议；</p>
            <p>2. 输出和途经国家或地区无相关动植物疫情；</p>
            <p>3. 符合中国有关动植物检疫法律法规规定；</p>
            <p>4. 符合中国与输出国家或地区签订的双边检疫协定；</p>
            <p>5. 涉及的输出国和生产企业应在海关总署公布的准入名单内。</p>
            <h3>五、申请材料（根据产品类别提供相应材料）</h3>
            <p>1. 进境活动物：指定隔离场使用证（食用水生动物除外）；</p>
            <p>2. 进境粮食：生产加工存放单位初审考核报告；</p>
            <p>3. 进境水果：进境水果存放场所资料；</p>
            <p>4. 过境动物：过境路线说明、输出国动物卫生证书、输入国准许进境证明。</p>
            <h3>六、办理流程</h3>
            <p>1. 企业在签订贸易合同前，通过"海关政务服务平台"（https://customs.chinaport.gov.cn）或"互联网+海关"（http://online.customs.gov.cn）在线提交申请；</p>
            <p>2. 按产品类别上传随附材料扫描件；</p>
            <p>3. 海关自受理之日起20个工作日内完成审核；</p>
            <p>4. 符合条件的签发《中华人民共和国进境动植物检疫许可证》。</p>
            <h3>七、结果名称</h3>
            <p>《中华人民共和国进境动植物检疫许可证》</p>
            <h3>八、收费标准</h3>
            <p>不收费</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [

        ]
    },

    {
        id: 54,
        title: "海关总署公告2026年第74号：中国与马来西亚原产地电子信息联网",
        category: "通知公告",
        date: "2026-05-29",
        summary: "2026年6月1日起中国—马来西亚原产地电子信息交换系统正式运行，实时传输RCEP和中国东盟框架协议项下原产地证书数据，无需重复填报。",
        content: `

            <p>2026年6月1日</p>
            <h3>三、主要内容</h3>
            <p>为进一步便利自由贸易协定项下货物的合规通关，自2026年6月1日起，"中国—马来西亚原产地电子信息交换系统"正式运行，与马来西亚实时传输《区域全面经济伙伴关系协定》（RCEP）项下原产地证书、背对背原产地证书和《中国与东南亚国家联盟全面经济合作框架协议》（中国东盟框架协议）项下原产地证书、流动证明数据。</p>
            <h3>四、通关申报变化</h3>
            <p>1. 进口人凭马来西亚签发的原产地证明申请享受RCEP或中国东盟框架协议项下协定税率时，选择"通关无纸化"方式申报的，无需通过"优惠贸易协定原产地要素申报系统"填报原产地证明电子数据和直接运输规则承诺事项，也无需以电子方式上传原产地证明。</p>
            <p>2. 对于提示"无法查找到原产地证明电子数据"的，2026年6月1日至11月30日期间（过渡期），进口人仍可按原来方式录入原产地证明电子信息。自2026年12月1日起，需按规定向海关申请办理税款担保手续，后续确认已传输原产地证明电子数据的，办理税款担保退还手续。</p>
            <p>3. 选择"有纸报关"方式的，在申报进口时应当提交原产地证明纸质文件。</p>
            <p>本公告自2026年6月1日起实施。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [

    {
