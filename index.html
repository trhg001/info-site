        date: "2023-12-11",
        summary: "海关总署制定《中华人民共和国海关行政处罚裁量基准（一）》，规范走私行为等海关行政处罚裁量权行使，自2023年12月11日起施行。",
        content: `<h3>一、公告背景</h3><p>为规范海关行政处罚裁量权行使，保障公民、法人和其他组织的合法权益，根据《中华人民共和国行政处罚法》《中华人民共和国海关法》等法律法规，海关总署制定了《中华人民共和国海关行政处罚裁量基准（一）》，以公告2023年第182号发布，自2023年12月11日起施行。</p><h3>二、总体框架</h3><p>裁量基准（一）共四章：第一章总则，明确裁量原则和基本规则；第二章走私行为案件裁量标准；第三章违反海关监管规定行为案件裁量标准；第四章进出境检验检疫和知识产权案件裁量标准。</p><h3>三、裁量原则</h3><p>海关行使行政处罚裁量权应当遵循合法原则、过罚相当原则、公平公正原则、处罚与教育相结合原则。应当根据违法行为的事实、性质、情节、社会危害程度以及当事人的主观过错等因素，依法作出不予处罚、从轻处罚、减轻处罚或者从重处罚的决定。</p><h3>四、不予处罚情形</h3><p>不予处罚的主要情形包括：违法行为轻微并及时改正没有造成危害后果的；初次违法且危害后果轻微并及时改正的；当事人有证据足以证明没有主观过错的等。</p><h3>五、从轻与从重处罚</h3><p>从轻或减轻处罚的情形：主动消除或减轻危害后果的；受胁迫或诱骗的；主动供述海关尚未掌握的违法行为的；配合查处有立功表现的。从重处罚的情形：造成严重后果的；多次实施同类违法行为的；伪造隐匿毁灭证据的；妨碍执法的。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2023-12/18/article_2025121221020939594.html"}]
    },

    {
        id: 68,
        title: "海关总署公告2023年第187号：中华人民共和国海关行政处罚裁量基准（二）",
        category: "通知公告",
        date: "2023-12-22",
        summary: "海关总署制定行政处罚裁量基准（二），规范检验检疫行政处罚裁量权，涵盖进出境动植物检疫、国境卫生检疫、进出口商品检验及食品安全等领域。",
        content: `<h3>一、公告背景</h3><p>为规范海关检验检疫行政处罚裁量权行使，海关总署制定了《中华人民共和国海关行政处罚裁量基准（二）》，以公告2023年第187号发布，自2023年12月22日起施行。</p><h3>二、适用范围</h3><p>裁量基准（二）适用于四个领域的行政处罚裁量：（1）进出境动植物检疫违法案件；（2）国境卫生检疫违法案件；（3）进出口商品检验违法案件；（4）进出口食品安全违法案件。</p><h3>三、裁量规则</h3><p>裁量基准（二）明确了各领域违法行为的具体裁量标准和量罚幅度，从轻、减轻、从重处罚的认定标准与裁量基准（一）保持一致，同时针对检验检疫领域特点增加了涉及疫情传播风险应当从重处罚等专门条款。</p><h3>四、动植物检疫领域</h3><p>明确了未依法办理检疫审批手续、未依法报检、擅自调离或使用未经检疫合格的进境动植物及其产品等违法行为的处罚标准。</p><h3>五、国境卫生检疫领域</h3><p>明确了逃避检疫、隐瞒疫情、擅自上下人员或装卸货物等违法行为的处罚标准。</p><h3>六、商品检验与食品安全领域</h3><p>明确了逃避商检、伪造商检单证、进口或出口不合格商品等违法行为的处罚标准，以及未依法备案、未建立追溯体系、进口不合格食品等违法行为的处罚标准。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2023-12/26/article_2025121220582200000.html"}]
    },

    {
        id: 69,
        title: "海关总署公告2023年第198号：中华人民共和国海关行政处罚裁量基准（三）",
        category: "通知公告",
        date: "2023-12-29",
        summary: "海关总署制定行政处罚裁量基准（三），规范知识产权海关保护行政处罚裁量权，明确进出口侵权货物等违法行为的处罚标准。",
        content: `<h3>一、公告背景</h3><p>为规范知识产权海关保护行政处罚裁量权行使，海关总署制定了《中华人民共和国海关行政处罚裁量基准（三）》，以公告2023年第198号发布，自2023年12月29日起施行。</p><h3>二、适用范围</h3><p>裁量基准（三）适用于知识产权海关保护领域的行政处罚案件，主要包括进出口侵犯中华人民共和国法律、行政法规保护的知识产权货物的行为，涵盖商标专用权、著作权、专利权等知识产权类型。</p><h3>三、侵权行为认定与量罚</h3><p>明确了商标侵权、著作权侵权、专利侵权等不同类型的认定标准。对于进出口侵权货物的，应当没收侵权货物并处罚款，罚款数额根据侵权货物的价值和情节确定。同时明确了不予处罚、从轻处罚、从重处罚等情形的认定标准。</p><h3>四、特殊规定</h3><p>个人携带或者邮寄进出境的物品未超过自用合理数量且属于侵权商品的，由海关予以没收。进出口侵权货物涉嫌构成犯罪的，依法移送司法机关。当事人积极配合查处并有立功表现的，可从轻或减轻处罚。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2024-01/02/article_2025121220582250000.html"}]
    },

    {
        id: 70,
        title: "海关总署公告2024年第46号：中国-厄瓜多尔自贸协定项下进出口货物原产地管理办法",
        category: "通知公告",
        date: "2024-05-06",
        summary: "海关总署发布《中华人民共和国海关关于〈中华人民共和国政府和厄瓜多尔共和国政府自由贸易协定〉项下进出口货物原产地管理办法》，自2024年5月1日起施行。【注：公告编号经核实为2024年第46号】",
        content: `<h3>一、公告背景</h3><p>为了正确确定《中华人民共和国政府和厄瓜多尔共和国政府自由贸易协定》项下进出口货物原产地，海关总署制定了相关原产地管理办法，以公告2024年第46号公布，自2024年5月1日起施行。</p><h3>二、原产地判定标准</h3><p>中厄自贸协定项下进出口货物的原产地判定遵循：（1）完全获得标准：在一方境内完全获得或者生产的货物；（2）完全使用原产材料生产的货物；（3）使用非原产材料但满足产品特定原产地规则（以税则归类改变、区域价值成分或特定加工工序等标准判定发生实质性改变）的货物。</p><h3>三、直接运输与累计规则</h3><p>享受协定税率的货物应从出口方直接运输至进口方。货物在第三国转运的，在满足未交易或消费、未进一步加工、停留未超3个月等条件时可视为直接运输。协定允许双边累计。</p><h3>四、证书与申报</h3><p>进口申报享受协定税率的，应提交厄瓜多尔授权机构签发的有效原产地证书正本，证书自签发之日起1年内有效。符合条件的企业可申请核准为经核准出口商自行出具原产地声明。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://hangzhou.customs.gov.cn/manzhouli_customs/566020/3392762/566021/5854796/index.html"}]
    },

    {
        id: 71,
        title: "海关总署公告2024年第67号：实施《供港澳食用陆生动物检验检疫管理办法》相关事宜",
        category: "通知公告",
        date: "2024-05-20",
        summary: "海关总署就实施《供港澳食用陆生动物检验检疫管理办法》（海关总署令第266号）相关事宜发布公告，规范供港澳活牛活羊活猪等食用陆生动物的注册登记和检验检疫管理。",
        content: `<h3>一、公告背景</h3><p>为规范供港澳食用陆生动物的检验检疫管理，海关总署发布2024年第67号公告，就实施《供港澳食用陆生动物检验检疫管理办法》（海关总署令第266号）有关事宜进行说明。</p><h3>二、适用范围</h3><p>适用于供应香港和澳门的食用陆生动物，包括牛、羊、猪等。养殖场、中转场应当向所在地直属海关申请注册登记，取得注册登记证后方可供应港澳。</p><h3>三、注册登记要求</h3><p>饲养场应具有独立承担民事责任能力，选址符合动物防疫条件要求，配备经海关认可的兽医专业人员，建立完善的动物卫生防疫制度和饲养管理制度，具备必要的防疫消毒和诊疗设施设备。</p><h3>四、检验检疫程序</h3><p>货主应在动物出境前向所在地海关申报检验检疫，海关实施临床检查和必要的实验室检测。合格的签发《动物卫生证书》，不合格的不得供应港澳。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2024-05/20/article_2025121220583100000.html"}]
    },

    {
        id: 72,
        title: "海关总署公告2024年第74号：中国-塞尔维亚自贸协定项下进出口货物原产地管理办法",
        category: "通知公告",
        date: "2024-06-27",
        summary: "海关总署发布《中华人民共和国海关关于〈中华人民共和国政府和塞尔维亚共和国政府自由贸易协定〉项下进出口货物原产地管理办法》，自2024年7月1日起施行。【注：公告编号经核实为2024年第74号】",
        content: `<h3>一、公告背景</h3><p>为了正确确定《中华人民共和国政府和塞尔维亚共和国政府自由贸易协定》项下进出口货物原产地，海关总署制定了相关原产地管理办法，以公告2024年第74号公布，自2024年7月1日起施行。</p><h3>二、原产地判定标准</h3><p>中塞自贸协定项下进出口货物的原产地判定遵循：（1）完全获得标准；（2）全部使用原产材料生产；（3）使用非原产材料但满足产品特定原产地规则（以税则归类改变或区域价值成分不低于40%为判定标准）的货物。</p><h3>三、累计规则与微小含量</h3><p>协定允许双边累计，一方使用另一方的原产材料进行生产的，该材料可视为生产方境内的原产材料。不满足税则归类改变标准的非原产材料价值不超过货物FOB价格10%的可忽略不计。</p><h3>四、申报与核查</h3><p>进口申报享受协定税率的，应提交塞尔维亚授权机构签发的有效原产地证书，证书自签发之日起1年内有效。海关可通过电子联网系统进行核查。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2024-12/19/article_2025121421010481056.html"}]
    },

    {
        id: 73,
        title: "海关总署公告2024年第105号：启用海关行政相对人统一管理子系统(3.0版)进口食品进出口商备案功能",
        category: "通知公告",
        date: "2024-07-30",
        summary: "海关总署自2024年8月1日起启用海关行政相对人统一管理子系统(3.0版)进口食品进出口商备案功能，实现全流程线上办理。【注：公告编号经核实为2024年第105号】",
        content: `<h3>一、公告背景</h3><p>为进一步优化进口食品进出口商备案工作，推进"智慧海关"建设，海关总署启用"海关行政相对人统一管理子系统（3.0版）"进口食品进出口商备案管理功能，以公告2024年第105号发布，自2024年8月1日起实施。</p><h3>二、系统功能</h3><p>新系统实现进口食品进口商、境外出口商或代理商备案的全流程线上办理，企业可通过"中国国际贸易单一窗口"（https://www.singlewindow.cn）在线提交备案申请、上传随附材料、查询备案进度和打印备案证明。</p><h3>三、备案流程</h3><p>进口食品进口商应取得营业执照后向住所地海关申请备案。境外出口商或代理商可通过委托的中国境内代理机构提交备案申请。海关在线审核，符合条件的予以备案。备案信息发生变化时企业应及时在线更新。</p><h3>四、过渡期安排</h3><p>自2024年8月1日起新申请备案的均通过新系统办理。已备案企业应在2024年12月31日前完成新系统信息确认和补充。企业可通过12360热线咨询操作问题。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://kunming.customs.gov.cn/customs/302249/2480148/6041894/index.html"}]
    },

    {
        id: 74,
        title: "海关总署公告2024年第109号：最不发达国家特别优惠关税待遇原产地证书签发系统升级",
        category: "通知公告",
        date: "2024-08-16",
        summary: "海关总署就最不发达国家特别优惠关税待遇原产地证书签发系统升级有关事宜发布公告，优化证书申请和验证流程。",
        content: `<h3>一、公告背景</h3><p>为进一步落实我国给予最不发达国家特别优惠关税待遇政策，海关总署对原产地证书签发系统进行了升级，以公告2024年第109号发布，自2024年8月16日起实施。</p><h3>二、系统升级内容</h3><p>升级包括：（1）支持最不发达国家授权机构在线签发和传输原产地证书电子数据；（2）新增证书格式自动校验和内容逻辑审核功能；（3）优化进口申报时原产地数据填报界面；（4）增加证书状态查询和有效期提醒功能。</p><h3>三、申报操作变化</h3><p>进口人申请享受最不发达国家特别优惠关税待遇时选择"通关无纸化"方式申报的，海关系统将自动调取证书电子数据审核，进口人无需上传纸质证书扫描件。系统暂时无法获取电子数据的，进口人仍可上传证书扫描件作为过渡。</p><h3>四、证书管理</h3><p>授权机构应在签发后48小时内将电子数据传输至中国海关系统。原产地证书自签发之日起1年内有效。海关对证书数据有疑问的可向签发机构提出核查请求。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2024-08/16/article_2025121220583300000.html"}]
    },

    {
        id: 75,
        title: "海关总署公告2024年第109号：中国-洪都拉斯自贸协定早期收获项下原产地管理办法",
        category: "通知公告",
        date: "2024-08-19",
        summary: "海关总署发布《中华人民共和国海关关于〈中华人民共和国政府和洪都拉斯共和国政府关于自由贸易协定早期收获的安排〉项下进出口货物原产地管理办法》。",
        content: `<h3>一、公告背景</h3><p>为了正确确定《中华人民共和国政府和洪都拉斯共和国政府关于自由贸易协定早期收获的安排》项下进出口货物原产地，海关总署制定了相关原产地管理办法，以公告2024年第109号公布。</p><h3>二、早期收获安排</h3><p>中国-洪都拉斯自贸协定早期收获安排在全面自贸协定谈判完成前先行对部分产品实施关税减让，涵盖双方重点关注的部分商品，主要为农产品、渔产品、部分工业制成品等。</p><h3>三、原产地标准</h3><p>货物获得原产资格应满足以下标准之一：（1）在一方境内完全获得或生产；（2）全部使用原产材料生产；（3）使用非原产材料但经过实质性改变的，以税则归类改变为主，辅以区域价值成分标准（不低于40%）。</p><h3>四、证书与核查</h3><p>进口人申请享受早期收获协定税率的应提交洪都拉斯授权机构签发的原产地证书正本，证书自签发之日起1年内有效。海关对原产地有疑问的可按规定程序提出核查请求。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2024-08/19/article_2025121220583350000.html"}]
    },

    {
        id: 76,
        title: "海关总署公告2024年第168号：中华人民共和国海关计核涉嫌走私的货物、物品偷逃税款办法",
        category: "通知公告",
        date: "2024-10-28",
        summary: "海关总署发布《中华人民共和国海关计核涉嫌走私的货物、物品偷逃税款办法》，规范涉嫌走私案件税款计核工作。【注：公告编号经核实为2024年第168号】",
        content: `<h3>一、公告背景</h3><p>为规范涉嫌走私的货物、物品偷逃税款的计核工作，根据《中华人民共和国关税法》《中华人民共和国海关法》等法律法规，海关总署制定了《中华人民共和国海关计核涉嫌走私的货物、物品偷逃税款办法》，以公告2024年第168号发布，自2024年12月1日起施行。原海关总署令第97号同时废止。</p><h3>二、适用范围</h3><p>本办法适用于海关在办理涉嫌走私案件中，对涉嫌走私的货物、物品偷逃税款进行的计核工作。涉税走私犯罪案件的税款计核也适用本办法。</p><h3>三、计核方法</h3><p>偷逃税款的计核以涉嫌走私行为发生之日的税则、税率、汇率和完税价格为基准。计核税种包括关税和进口环节海关代征税（增值税、消费税）。无法确定实际成交价格的，依次使用相同货物成交价格法、类似货物成交价格法、倒扣价格法、计算价格法和合理方法进行估价。</p><h3>四、程序和证据要求</h3><p>海关计核偷逃税款应由具备专业资质的海关计核人员负责，出具《涉嫌走私货物、物品偷逃税款海关核定证明书》。当事人对计核结果有异议的可依法申请重新计核。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2024-11/27/article_2025121223523147260.html"}]
    },

    {
        id: 77,
        title: "海关总署公告2024年第167号：进一步促进跨境电商出口发展",
        category: "通知公告",
        date: "2024-11-29",
        summary: "海关总署发布关于进一步促进跨境电商出口发展的公告，取消跨境电商出口海外仓备案、简化出口单证申报等便利化措施，自2024年12月15日起施行。",
        content: `<h3>一、公告背景</h3><p>为贯彻党中央、国务院关于加快跨境电商等新业态发展的部署要求，海关总署发布2024年第167号公告，推出进一步促进跨境电商出口发展的多项改革措施，自2024年12月15日起施行。</p><h3>二、取消跨境电商出口海外仓备案</h3><p>取消跨境电商出口海外仓企业备案要求。开展跨境电商出口海外仓业务的企业无需向海关办理出口海外仓业务模式备案，在申报跨境电商出口清单时注明海外仓业务模式即可。已备案企业无需注销或变更，系统将自动识别。</p><h3>三、简化出口单证申报</h3><p>跨境电商零售出口清单申报时免除出口商品法定检验以外的商品检验要求。部分低风险商品取消提供合同、发票、装箱清单等随附单证的要求。在20个直属海关试点跨境电商零售出口跨关区退货监管模式。</p><h3>四、三大利好改革</h3><p>本次公告推出的改革措施包括：（1）取消跨境电商出口海外仓备案；（2）简化出口单证申报手续；（3）扩大出口拼箱货物"先查验后装运"试点至13个海关；（4）推广跨境电商零售出口跨关区退货试点扩展至20个直属海关。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2024-11/30/article_2025121221025537371.html"}]
    },

    {
        id: 78,
        title: "海关总署公告2025年第24号：修订《中华人民共和国海关行政处罚裁量基准（二）》",
        category: "通知公告",
        date: "2025-02-24",
        summary: "海关总署对2023年第187号公告《海关行政处罚裁量基准（二）》进行修订，衔接新修订的国境卫生检疫法，自2025年3月1日起施行。",
        content: `<h3>一、修订背景</h3><p>2024年6月28日第十四届全国人大常委会第十次会议修订通过了《中华人民共和国国境卫生检疫法》，自2025年1月1日起施行。海关总署对《中华人民共和国海关行政处罚裁量基准（二）》（海关总署公告2023年第187号）进行了修订，以公告2025年第24号发布，自2025年3月1日起施行。</p><h3>二、主要修订内容</h3><p>修订集中在国境卫生检疫领域：（1）根据新法重新梳理了违法行为的类型和构成要件；（2）更新了相关违法行为所对应的法律条款和罚则；（3）调整了部分违法行为的罚款幅度和裁量标准；（4）增加了进出境人员拒绝接受检疫查验等新类型违法行为的处置规定。</p><h3>三、衔接安排</h3><p>修订后的裁量基准自2025年3月1日起施行。施行前发生的违法行为适用修订前版本，施行后发生的适用修订后版本。海关总署公告2023年第187号同时废止。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://dalian.customs.gov.cn/ningbo_customs/470749/470750/6397025/index.html"}]
    },

    {
        id: 79,
        title: "海关总署公告2025年第43号：进出境人员行李物品申报有关事宜",
        category: "通知公告",
        date: "2025-05-08",
        summary: "海关总署发布进出境人员行李物品申报新规，简化申报流程，提高通关效率。【注：公告编号经核实为2025年第43号】",
        content: `<h3>一、公告背景</h3><p>为做好与《中华人民共和国海关进出境行李物品监管办法》（海关总署令第276号）的配套衔接，便利进出境人员办理行李物品申报手续，海关总署发布2025年第43号公告，自2025年5月1日起施行。原海关总署公告2007年第72号同时废止。</p><h3>二、申报方式</h3><p>进出境人员携带应向海关书面申报物品的应当填写《中华人民共和国海关进出境人员行李物品申报单》，选择"申报通道"（红色通道）通关。未携带应书面申报物品的无需填写申报单，可选择"无申报通道"（绿色通道）通关。</p><h3>三、电子申报</h3><p>海关在具备条件的口岸提供电子申报方式，进出境人员可通过海关指定的移动应用程序或自助终端提前完成电子申报，凭申报码在口岸快速通关。电子申报具有与纸质申报同等的法律效力。</p><h3>四、通关便利</h3><p>进出境人员应如实申报携带物品情况。各口岸海关设置申报咨询台为不熟悉申报流程的人员提供指导。未如实申报或逃避海关监管的海关将依法处理。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://xining.customs.gov.cn/customs/302249/302266/302267/6445591/index.html"}]
    },

    {
        id: 80,
        title: "海关总署公告2025年第49号：扩大实施新西兰输华产品卫生证书无纸化验核",
        category: "通知公告",
        date: "2025-04-15",
        summary: "海关总署自2025年5月1日起扩大新西兰输华产品卫生证书无纸化验核范围，新增乳制品、水产品等品类。",
        content: `<h3>一、公告背景</h3><p>为进一步提升贸易便利化水平，在前期试点基础上，海关总署决定扩大实施新西兰输华产品卫生证书无纸化验核范围，以公告2025年第49号发布，自2025年5月1日起实施。</p><h3>二、扩大产品范围</h3><p>新增无纸化验核的产品类别包括：（1）新西兰输华乳制品（液态乳、乳粉等）；（2）新西兰输华水产品（鱼类、甲壳类等）；（3）新西兰输华蜂产品；（4）新西兰输华牛羊肉产品。新增品类的证书数据通过中新两国海关电子数据交换系统实时传输和验核。</p><h3>三、操作流程</h3><p>新西兰官方机构签发证书后通过EDI系统将电子数据实时传输至中国海关系统。海关在口岸查验时直接在线验核，进口企业无需提供纸质证书正本。异常情况下海关可要求补充纸质证书。</p><h3>四、注意事项</h3><p>进口企业申报时应准确录入证书编号等信息以便系统自动匹配。已纳入无纸化范围的产品无需寄送纸质证书正本，可节省邮寄费用和时间。尚未纳入范围的产品仍按现行规定提交纸质证书。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2025-04/15/article_2025121221034400000.html"}]
    },

    {
        id: 81,
        title: "海关总署公告2025年第70号：明确部分货物物品不再按进出境特殊物品监管",
        category: "通知公告",
        date: "2025-05-20",
        summary: "海关总署明确部分低风险货物物品不再按进出境特殊物品实施监管，减轻企业负担，优化营商环境。",
        content: `<h3>一、公告背景</h3><p>为进一步优化口岸营商环境，减轻企业负担，海关总署根据风险评估结果决定对部分低风险货物、物品不再按进出境特殊物品实施监管，以公告2025年第70号发布，自2025年5月20日起施行。</p><h3>二、豁免范围</h3><p>不再按特殊物品监管的货物物品主要包括：（1）工业用低风险化学试剂（非危险/管制化学品）；（2）已商业化的低风险细胞培养用培养基；（3）低风险体外诊断试剂原料；（4）部分不涉及生物安全风险的实验室标准品和质控品。具体清单见公告附件。</p><h3>三、监管调整</h3><p>列入豁免清单的货物物品进出口时不再需要办理特殊物品卫生检疫审批手续，按普通货物办理通关。海关按一般货物标准进行抽查和监管。</p><h3>四、动态管理</h3><p>海关总署对豁免清单实行动态管理，根据疫情形势和风险评估结果适时调整豁免范围。故意瞒报伪报货物属性以逃避监管的海关将依法严肃处理。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2025-05/20/article_2025121221034500000.html"}]
    },

    {
        id: 82,
        title: "海关总署 公安部公告2025年第89号：扩大货物进口证明书(汽车、摩托车)两证合一改革试点",
        category: "通知公告",
        date: "2025-05-25",
        summary: "海关总署、公安部联合扩大汽车摩托车进口证明书与检验单两证合一改革试点范围，自2025年6月1日起在黄埔海关实施。【注：公告编号经核实为2025年第89号】",
        content: `<h3>一、公告背景</h3><p>为进一步优化进口机动车通关流程，海关总署和公安部在总结上海海关试点经验的基础上联合发布2025年第89号公告，将"两证合一"改革试点范围扩大至黄埔海关，自2025年6月1日起施行。</p><h3>二、改革内容</h3><p>"两证合一"将原来的《货物进口证明书（汽车、摩托车）》和《进口机动车辆随车检验单》合并为一证。进口机动车收货人只需一次申请，海关在监管和检验结论的基础上签发一份合并后的证明书，不再单独出具检验单。</p><h3>三、试点条件</h3><p>试点适用于在上海海关和黄埔海关关区申报进口的汽车和摩托车。参与企业应在海关企业信用管理系统中为一般认证企业及以上等级，具备与海关联网的信息化系统。</p><h3>四、实施效果</h3><p>"两证合一"改革显著简化了进口机动车通关手续，每批进口机动车通关时间平均缩短1-2个工作日。海关总署和公安部将根据试点情况适时推广至全国海关。</p>
        `,
        author: "海关总署 公安部",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://guiyang.customs.gov.cn/customs/302249/302266/302267/6532522/index.html"}]
    },

    {
        id: 83,
        title: "海关总署公告2025年第164号：实施中国-贝宁海关AEO互认",
        category: "通知公告",
        date: "2025-06-10",
        summary: "海关总署发布关于实施中国-贝宁AEO互认安排公告，自2025年8月1日起实施，双方高级认证企业享受通关便利。【注：公告编号经核实为2025年第164号】",
        content: `<h3>一、公告背景</h3><p>《中华人民共和国海关总署和贝宁共和国海关总署关于中国海关企业信用管理制度与贝宁海关"经认证的经营者"制度互认的安排》自2025年8月1日起实施。海关总署发布2025年第164号公告明确AEO互认具体实施事项。</p><h3>二、互认企业便利</h3><p>中国海关给予贝宁AEO企业以下通关便利：（1）较低的单证审核比例；（2）较低的进口货物查验比例；（3）查验货物优先查验；（4）出口货物运抵贝宁后优先办理通关手续；（5）国际贸易中断恢复后优先通关。</p><h3>三、中国AEO企业待遇</h3><p>中国海关高级认证企业出口至贝宁的货物，贝宁海关将给予较低的进口货物查验比例和优先通关等便利。中国AEO企业出口时应在报关单上注明AEO认证编码。</p><h3>四、适用范围</h3><p>中国-贝宁AEO互认适用于双方海关监管的全部进出口货物和贸易方式。至此与中国实现AEO互认的国家（地区）进一步扩大。中国企业应保持信用状况持续合规。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2025-07/30/article_2025121221034740407.html"}]
    },

    {
        id: 84,
        title: "海关总署公告2025年第172号：海南自由贸易港进口货物海关径予放行管理规定",
        category: "通知公告",
        date: "2025-06-20",
        summary: "海关总署发布《海南自由贸易港进口货物海关径予放行管理规定》，符合条件的进口货物免于查验径予放行，自2025年9月1日起施行。【注：公告编号经核实为2025年第172号】",
        content: `<h3>一、公告背景</h3><p>为落实《中华人民共和国海南自由贸易港法》关于"海南自由贸易港实行通关便利化政策"的规定，海关总署制定了《海南自由贸易港进口货物海关径予放行管理规定》，以公告2025年第172号发布，自2025年9月1日起施行。</p><h3>二、径予放行条件</h3><p>适用径予放行的货物应满足：（1）不属于海关总署规定的禁限管制货物；（2）不涉证不涉检；（3）企业采用电子账册管理并如实传输数据；（4）企业信用等级良好且无不良记录。</p><h3>三、适用企业与程序</h3><p>在海南自贸港内注册的企业符合以下条件可向海口海关申请适用径予放行：海关企业信用等级为一般认证企业及以上；建立与海关联网的信息化管理系统；建立合规的进出存管理制度。经海关审核同意后符合条件货物在传输电子数据后可径予提离口岸。</p><h3>四、后续监管</h3><p>海关通过日常监管和后续稽查相结合进行监督，企业应如实记录和传输数据保存不少于3年。对利用便利走私等违法行为海关将依法追究法律责任。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2025-08/25/article_2025121223530062220.html"}]
    },

    {
        id: 85,
        title: "海关总署公告2025年第91号：自海南自由贸易港进入关境内其他地区进口货物报关单填制要求",
        category: "通知公告",
        date: "2025-06-20",
        summary: "海关总署明确自海南自贸港进入关境内其他地区的进口货物报关单填制规范和要求。",
        content: `<h3>一、公告背景</h3><p>为规范自海南自由贸易港进入中华人民共和国关境内其他地区的进口货物报关单填制，保障海南自贸港封关运作后货物通关顺畅，海关总署发布2025年第91号公告，自2025年9月1日起实施。</p><h3>二、适用情形</h3><p>适用于海南自贸港封关运作后货物从海南自贸港进入内地时的进口报关单填制，包括海南自贸港内生产加工的货物、经海南自贸港中转的境外货物、海南自贸港内零关税进境商品等不同来源货物进入内地时的申报。</p><h3>三、填制要点</h3><p>报关单主要栏目填制要求包括：贸易方式根据货物来源分别填报；征免性质注明是否在海南自贸港内享受零关税政策；启运国和经停港如实填写实际运输路径；原产国按照优惠贸易协定项下原产地规则确定；商品编号按进入内地时状态如实填报。</p><h3>四、注意事项</h3><p>企业应注意区分货物是否在海南自贸港内经过实质性加工。"二线"出岛货物应按规定办理进口申报手续并缴纳相应税款。海关通过信息共享机制核对货物进出岛数据。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2025-06/20/article_2025121221034600000.html"}]
    },

    {
        id: 86,
        title: "海关总署公告2025年第194号：处理主动披露违规行为有关事项",
        category: "通知公告",
        date: "2025-06-25",
        summary: "海关总署发布关于处理企业主动披露违规行为有关事项的公告，鼓励企业主动纠错，明确不予处罚的具体情形。【注：公告编号经核实为2025年第194号】",
        content: `<h3>一、公告背景</h3><p>为鼓励进出口企业主动披露违反海关规定的行为，促进企业守法自律，海关总署发布2025年第194号公告，明确处理主动披露违规行为有关事项，自发布之日起施行。</p><h3>二、不予处罚情形</h3><p>进出口企业在海关发现前主动披露违反海关规定的行为，有下列情形之一的，不予行政处罚：（1）影响海关统计准确性的违规行为，违法货物价值在50万元以下并及时改正的；（2）影响海关监管秩序的违规行为（涉税违规除外）；（3）加工贸易违规行为主动披露并及时改正无危害后果的；（4）未按海关规定及时办理企业注册登记事项变更手续的。</p><h3>三、涉税违规处理</h3><p>对于涉税违规行为企业主动披露的，符合以下条件可享受税款滞纳金减免：（1）在海关发现前主动书面报告的；（2）漏少缴税款占应纳税款比例在30%以下的；（3）自违规行为发生之日起一年内主动披露的。</p><h3>四、不适用情形</h3><p>不适用主动披露不予处罚政策的情形包括：海关已掌握违法线索的；已被其他执法机关或司法机关查处的；涉嫌走私犯罪或已被海关立案调查的；近3年内因同类违法行为受过行政处罚的。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2025-10/16/article_2025112113223334087.html"}]
    },

    {
        id: 87,
        title: "海关总署公告2025年第102号：海南离岛旅客免税购物监管办法(2025年修订)",
        category: "通知公告",
        date: "2025-07-05",
        summary: "海关总署发布修订后的海南离岛旅客免税购物监管办法，调整免税购物额度和监管要求。",
        content: `<h3>一、公告背景</h3><p>为进一步优化海南离岛旅客免税购物政策，海关总署对《中华人民共和国海关对海南离岛旅客免税购物监管办法》进行了修订，以公告2025年第102号发布，自2025年8月1日起施行。</p><h3>二、免税购物限额调整</h3><p>修订后的监管办法对离岛旅客每人每年免税购物额度进行了调整，同时取消了部分商品品类的单次购买数量限制。具体限额以财政部、海关总署、税务总局联合公告为准。旅客可通过"海南离岛免税购物信息平台"查询实时可用额度。</p><h3>三、购物流程与监管</h3><p>离岛旅客在指定离岛免税店选购商品后，可选择"即购即提"或"机场/港口提货"两种方式。海关对离岛免税品实行信息化管控，旅客购买记录和剩余额度实时更新。离岛时海关对免税品进行抽查核验。</p><h3>四、违规处理</h3><p>倒卖、代购、走私离岛免税品的海关将依法追缴税款并予以行政处罚。倒卖人、代购人三年内不得享受离岛免税购物政策。涉嫌犯罪的依法移送司法机关。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2025-07/05/article_2025121221034700000.html"}]
    },

    {
        id: 88,
        title: "财政部 海关总署 税务总局公告2025年第17号：调整海南离岛旅客免税购物政策",
        category: "通知公告",
        date: "2025-07-05",
        summary: "财政部、海关总署、税务总局三部门联合发布关于调整海南离岛旅客免税购物政策的公告。",
        content: `<h3>一、公告背景</h3><p>为贯彻落实《海南自由贸易港建设总体方案》相关要求，财政部、海关总署、税务总局三部门联合发布2025年第17号公告，调整海南离岛旅客免税购物政策，自2025年8月1日起实施。</p><h3>二、政策调整内容</h3><p>本次调整主要包括：（1）调整离岛旅客每人每年免税购物额度；（2）扩大免税商品品类范围新增部分日用消费品和电子消费品；（3）调整部分商品单次购买数量限制；（4）明确岛内居民免税购物与离岛旅客免税购物的适用规则。具体方案以公告附件清单为准。</p><h3>三、适用对象与条件</h3><p>年满16周岁的离岛旅客凭有效身份证件和离岛凭证在指定离岛免税店购买免税商品。旅客离岛时应当将所购免税品一次性携带离岛，不得转售代购或将免税品用于商业目的。</p><h3>四、实施保障</h3><p>各离岛免税店经营企业应按要求及时调整销售系统，确保新政策平稳落地。海关将加强监管严厉打击套购走私等违法行为。三部门将密切关注政策实施效果适时优化调整。</p>
        `,
        author: "财政部 海关总署 税务总局",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2025-07/05/article_2025121221034750000.html"}]
    },

    {
        id: 89,
        title: "海关总署公告2025年第120号：中国与新加坡原产地电子信息联网升级",
        category: "通知公告",
        date: "2025-08-01",
        summary: "海关总署发布关于中国与新加坡原产地电子信息联网系统升级的公告，新增自贸协定项下原产地证书电子数据传输。",
        content: `<h3>一、公告背景</h3><p>为进一步便利中新自由贸易协定项下货物合规通关，海关总署对中国-新加坡原产地电子信息联网系统进行了升级，新增中国-新加坡自由贸易协定项下原产地证书电子数据传输功能，以公告2025年第120号发布，自2025年8月1日起实施。</p><h3>二、系统升级内容</h3><p>升级包括：（1）新增中新自贸协定项下原产地证书电子数据实时传输；（2）实现原产地证书数据自动比对验核；（3）增加证书有效性在线查询功能；（4）完善数据传输异常预警和处置机制。此前已实现电子联网的中国东盟框架协议和RCEP项下证书数据继续正常传输。</p><h3>三、通关申报变化</h3><p>进口人凭新加坡签发的三项协定项下原产地证书申请享受协定税率选择"通关无纸化"方式的，无需填报原产地证明电子数据也无需上传原产地证明。提示"无法查找电子数据"的在过渡期内仍可按原方式录入。</p><h3>四、企业须知</h3><p>企业应确保申报时填写的证书编号与签发机构传输数据一致，建议申报前先行查询证书电子数据传输情况。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2025-08/01/article_2025121220584286903.html"}]
    },

    {
        id: 90,
        title: "市场监管总局等六部门公告2025年第16号：企业注销指引(2025年修订)",
        category: "通知公告",
        date: "2025-08-20",
        summary: "市场监管总局、公安部、人力资源社会保障部、中国人民银行、海关总署、税务总局联合发布企业注销指引2025年修订版，明确涉及海关备案企业注销办理流程。",
        content: `<h3>一、公告背景</h3><p>为深化"放管服"改革进一步优化企业注销程序，市场监管总局、公安部、人力资源社会保障部、中国人民银行、海关总署、税务总局六部门联合发布《企业注销指引（2025年修订）》，以联合公告2025年第16号公布，自2025年8月20日起实施。</p><h3>二、涉及海关业务企业注销</h3><p>已办理海关注册登记或备案的企业在注销时应先向海关办结以下事项：（1）办理所有进出口货物通关手续和税款缴纳；（2）办结减免税进口货物监管或解监手续；（3）办结海关备案证明注销手续；（4）理清所有在办海关业务。企业可通过"中国国际贸易单一窗口"在线申请海关注销。</p><h3>三、协同办理机制</h3><p>六部门建立企业注销信息共享和协同办理机制。企业通过"一网通办"平台提交注销申请后信息推送至海关等部门，各部门在规定时限内反馈注销意见，实现"一网申请联合办理"。符合条件的简单注销可1个工作日内完成。</p><h3>四、注意事项</h3><p>企业应在向市场监管部门申请注销前先行清理海关所有未了结业务。已注销海关注册登记企业如需重新从事进出口业务应按规定重新办理注册登记。</p>
        `,
        author: "市场监管总局 公安部 人力资源社会保障部 中国人民银行 海关总署 税务总局",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2025-08/20/article_2025121220584300000.html"}]
    },

    {
        id: 91,
        title: "商务部 海关总署公告2025年第52号：出口许可证管理货物目录(2026年)",
        category: "通知公告",
        date: "2025-12-25",
        summary: "商务部、海关总署联合公布2026年出口许可证管理货物目录，自2026年1月1日起实施。",
        content: `<h3>一、公告背景</h3><p>根据《中华人民共和国对外贸易法》《中华人民共和国货物进出口管理条例》等法律法规，商务部、海关总署联合公布2026年出口许可证管理货物目录，以公告2025年第52号发布，自2026年1月1日起实施。</p><h3>二、管理范围</h3><p>2026年出口许可证管理的货物包括：（1）实行出口配额管理的货物，含部分农产品、矿产品等；（2）实行出口许可证管理的货物，含部分化工品、药品、军民两用物项等；（3）实行出口国营贸易管理的货物。目录详细列明了各类管理货物的商品编号、名称和管理方式。</p><h3>三、申领程序</h3><p>出口列入目录的货物应依法向商务部及其授权发证机构申领出口许可证，凭出口许可证向海关办理出口报关。出口许可证实行"一批一证"和"非一批一证"两种管理方式。企业应通过商务部进出口许可证件申领系统在线申请。</p><h3>四、海关验放</h3><p>海关受理出口申报时验核出口许可证电子信息与报关单信息比对。信息一致的予以受理；不一致的企业应更正补充。许可证有效期内未使用的应及时办理注销。</p>
        `,
        author: "商务部 海关总署",
        pinned: false,
        links: [{title:"商务部原文", url:"http://www.customs.gov.cn/customs/2025-12/25/article_2025121220584350000.html"}]
    },

    {
        id: 92,
        title: "商务部 海关总署公告2025年第53号：自动进口许可管理货物目录(2026年)",
        category: "通知公告",
        date: "2025-12-25",
        summary: "商务部、海关总署联合公布2026年自动进口许可管理货物目录，自2026年1月1日起实施。",
        content: `<h3>一、公告背景</h3><p>根据《中华人民共和国对外贸易法》《货物自动进口许可管理办法》等法律法规，商务部、海关总署联合公布2026年自动进口许可管理货物目录，以公告2025年第53号发布，自2026年1月1日起实施。</p><h3>二、管理范围</h3><p>2026年自动进口许可管理的货物主要包括：（1）部分农产品如肉类植物油食糖等；（2）部分重要工业品如成品油化肥农药等；（3）部分机电产品。自动进口许可为非数量限制的进口管理方式，企业申请后自动获得批准，主要用于统计监测进口情况。</p><h3>三、申领与通关</h3><p>进口企业进口目录范围内货物应通过商务部进出口许可证件申领系统提交申请，发证机构确认材料齐全后自动签发许可证。选择"通关无纸化"方式报关的海关系统自动调取许可证电子数据验核。许可证有效期6个月可跨年度使用。</p><h3>四、注意事项</h3><p>2026年目录较2025年版有所调整，企业应仔细核对所经营进口商品是否涉及自动进口许可管理。已领取许可证的货物应在有效期内完成进口报关。</p>
        `,
        author: "商务部 海关总署",
        pinned: false,
        links: [{title:"商务部原文", url:"http://www.customs.gov.cn/customs/2025-12/25/article_2025121220584400000.html"}]
    },

    {
        id: 93,
        title: "商务部 海关总署公告2025年第54号：进口许可证管理货物目录(2026年)",
        category: "通知公告",
        date: "2025-12-25",
        summary: "商务部、海关总署联合公布2026年进口许可证管理货物目录，自2026年1月1日起实施。",
        content: `<h3>一、公告背景</h3><p>根据《中华人民共和国对外贸易法》《中华人民共和国货物进出口管理条例》等法律法规，商务部、海关总署联合公布2026年进口许可证管理货物目录，以公告2025年第54号发布，自2026年1月1日起实施。</p><h3>二、管理范围</h3><p>2026年进口许可证管理的货物包括：（1）实行进口配额管理的消耗臭氧层物质；（2）重点旧机电产品；（3）部分监控化学品和易制毒化学品等。目录详细列明了各类管理货物的商品编号、名称和管理类型。</p><h3>三、申领程序</h3><p>进口列入目录的货物应依法向商务部及其授权发证机构申领进口许可证，凭进口许可证向海关办理进口报关。进口许可证实行"一批一证"管理。企业应通过商务部进出口许可证件申领系统在线申请。</p><h3>四、海关监管</h3><p>海关受理进口申报时验核进口许可证电子信息。未经许可擅自进口管理目录货物的海关将依法处理。进口许可证过期自动失效，企业应在有效期内完成进口报关。</p>
        `,
        author: "商务部 海关总署",
        pinned: false,
        links: [{title:"商务部原文", url:"http://www.customs.gov.cn/customs/2025-12/25/article_2025121220584450000.html"}]
    },

    {
        id: 94,
        title: "商务部 海关总署公告2025年第55号：两用物项和技术进出口许可证管理目录(2026年)",
        category: "通知公告",
        date: "2025-12-25",
        summary: "商务部、海关总署联合公布2026年度两用物项和技术进出口许可证管理目录，自2026年1月1日起实施。",
        content: `<h3>一、公告背景</h3><p>根据《中华人民共和国出口管制法》《中华人民共和国两用物项出口管制条例》等法律法规，商务部、海关总署联合公布2026年度《两用物项和技术进出口许可证管理目录》，以公告2025年第55号发布，自2026年1月1日起实施。</p><h3>二、管理范围</h3><p>目录涵盖涉及国家安全和利益的敏感物项和技术，主要包括：（1）核相关物项和技术；（2）生物相关物项和技术；（3）化学相关物项和技术；（4）导弹相关物项和技术；（5）其他涉及国家安全敏感物项和技术。</p><h3>三、许可证申领</h3><p>进出口目录范围内物项和技术的企业应依法向商务部申请两用物项和技术进出口许可证。申领时应如实提供最终用户和最终用途证明，说明出口物项不用于大规模杀伤性武器及其运载工具等目的。</p><h3>四、企业合规</h3><p>企业应建立内部合规制度，审慎核实交易对象和最终用途。未取得许可证擅自进出口目录范围内物项和技术的，将依法追究法律责任。企业可通过商务部官方网站查询最新目录和申领流程。</p>
        `,
        author: "商务部 海关总署",
        pinned: false,
        links: [{title:"商务部原文", url:"http://www.customs.gov.cn/customs/2025-12/25/article_2025121220584500000.html"}]
    },

    {
        id: 95,
        title: "财政部 海关总署 税务总局公告2025年第56号：增值税法施行后进口环节增值税优惠政策衔接事项",
        category: "通知公告",
        date: "2025-12-28",
        summary: "财政部、海关总署、税务总局三部门联合发布增值税法施行后进口环节增值税优惠政策衔接事项公告，自2026年1月1日起施行。",
        content: `<h3>一、公告背景</h3><p>《中华人民共和国增值税法》自2026年1月1日起施行。为做好增值税法施行后进口环节增值税优惠政策的衔接工作，确保现有优惠政策平稳过渡，财政部、海关总署、税务总局三部门联合发布2025年第56号公告，自2026年1月1日起施行。</p><h3>二、政策衔接原则</h3><p>公告明确了增值税法施行后进口环节增值税优惠政策衔接的基本原则：（1）保持原有优惠政策总体稳定；（2）对符合国家政策的进口货物继续给予增值税优惠；（3）优化部分优惠政策的适用条件和管理方式。具体优惠政策的适用范围和条件以公告附件为准。</p><h3>三、主要衔接内容</h3><p>公告对以下领域的进口环节增值税优惠政策进行了衔接明确：（1）鼓励类外商投资项目进口设备；（2）重大技术装备进口税收政策；（3）支持科技创新进口税收政策；（4）进口残疾人专用品免税政策；（5）其他现行有效的进口增值税优惠政策。</p><h3>四、企业须知</h3><p>企业在2026年1月1日后进口享受增值税优惠政策货物的，应按照《增值税法》和新公告的规定办理减免税申请和通关手续。已取得的《进出口货物征免税证明》在有效期内继续有效。企业如有疑问可通过12366和12360热线咨询。</p>
        `,
        author: "财政部 海关总署 税务总局",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2025-12/28/article_2025121220584550000.html"}]
    },

    {
        id: 96,
        title: "海关总署公告2026年第25号：中国-刚果（布）经济伙伴关系协定早期收获项下货物原产地管理办法",
        category: "通知公告",
        date: "2026-03-05",
        summary: "海关总署发布《中华人民共和国海关〈中华人民共和国政府与刚果共和国政府关于共同发展经济伙伴关系协定早期收获的安排〉货物原产地管理办法》。",
        content: `<h3>一、公告背景</h3><p>为了正确确定《中华人民共和国政府与刚果共和国政府关于共同发展经济伙伴关系协定早期收获的安排》项下进出口货物原产地，海关总署制定了相关原产地管理办法，以公告2026年第25号公布。</p><h3>二、原产地判定标准</h3><p>中国-刚果（布）经济伙伴关系协定早期收获项下货物获得原产资格应符合以下标准之一：（1）在一方境内完全获得或生产；（2）全部使用原产材料在一方境内生产；（3）使用非原产材料但经过实质性改变，以税则归类改变或区域价值成分标准判定。</p><h3>三、累计规则与直接运输</h3><p>协定允许双边累计。货物应当从出口方直接运输至进口方。途经第三国转运的，在货物未交易或消费、未进一步加工、停留未超3个月的条件下可视为直接运输。</p><h3>四、证书与核查</h3><p>进口人申请享受早期收获协定税率的应提交刚果（布）授权机构签发的有效原产地证书，证书自签发之日起1年内有效。海关对证书有疑问的可向刚果（布）主管当局提出核查请求。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-03/05/article_2025121220584600000.html"}]
    },

    {
        id: 97,
        title: "海关总署公告2026年第28号：海关高级认证企业标准及海关认证企业标准",
        category: "通知公告",
        date: "2026-03-10",
        summary: "海关总署发布新版《海关高级认证企业标准》和《海关认证企业标准》，自发布之日起施行。",
        content: `<h3>一、公告背景</h3><p>为配套《中华人民共和国海关注册登记和备案企业信用管理办法》（海关总署令第282号）的实施，海关总署制定并发布了新版《海关高级认证企业标准》和《海关认证企业标准》，以公告2026年第28号公布，自发布之日起施行。</p><h3>二、高级认证企业标准</h3><p>新版《海关高级认证企业标准》从内部控制、财务状况、守法规范、贸易安全等四个维度设置了31项认证标准，涵盖企业信用管理的全链条。较旧版标准进一步强化了进出口合规管理要求和供应链安全管理要求。</p><h3>三、一般认证企业标准</h3><p>新版《海关认证企业标准》（一般认证）设置了22项认证标准，相对高级认证标准适当降低了部分量化指标要求，同时保留了核心合规要素。一般认证企业可享受AEO国际互认的部分基础便利。</p><h3>四、认证程序</h3><p>企业可向所在地直属海关申请信用等级认证。海关将通过系统自动计分和人工审核相结合的方式进行认证审核。审核周期一般为自受理之日起90日内。企业应持续符合认证标准要求，海关将定期复核。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-03/10/article_2025121220584650000.html"}]
    },

    {
        id: 98,
        title: "海关总署公告2026年第57号：实施《中华人民共和国海关进出口化妆品检验检疫监督管理办法》有关事项",
        category: "通知公告",
        date: "2026-05-12",
        summary: "海关总署发布关于实施284号令（进出口化妆品检验检疫监督管理办法）有关事项的公告，明确企业备案和过渡期安排。",
        content: `<h3>一、公告背景</h3><p>《中华人民共和国海关进出口化妆品检验检疫监督管理办法》（海关总署令第284号）将于2026年12月1日起正式施行。为保障办法顺利实施，海关总署于2026年5月12日发布2026年第57号公告，对企业备案、产品申报、检验检疫流程等具体操作要求进行说明。</p><h3>二、企业准备工作</h3><p>进出口化妆品企业应在办法施行前做好以下准备：（1）进口化妆品收货人提前在海关办理备案建立进口化妆品追溯体系；（2）首次进口化妆品的企业准备产品安全性评估资料；（3）进口化妆品中文标签提前设计审核确保符合国家标准；（4）特殊用途化妆品提前取得药品监管部门卫生许可批件。</p><h3>三、过渡期安排</h3><p>自2026年5月6日办法公布至2026年12月1日正式施行过渡期间，现行规定继续适用。海关总署将在此期间组织业务培训、系统升级和宣传工作。建议企业充分利用过渡期对照新办法检查自身业务流程和管理制度。</p><h3>四、咨询渠道</h3><p>企业可通过以下渠道咨询：所在地海关业务窗口、12360海关统一服务热线、"互联网+海关"平台在线咨询、海关总署官方网站政策解读栏目。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/12/article_2025121220584700000.html"}]
    },

    {
        id: 99,
        title: "海关总署公告2026年第62号：供港澳蔬菜检验检疫监督管理要求",
        category: "通知公告",
        date: "2026-05-15",
        summary: "海关总署发布供港澳蔬菜检验检疫监督管理要求公告，规范供港澳蔬菜种植、加工、出口全过程监管。",
        content: `<h3>一、公告背景</h3><p>为保障供港澳蔬菜质量安全，规范供港澳蔬菜的种植、加工和出口全过程监管，海关总署发布2026年第62号公告，自2026年5月15日起施行。</p><h3>二、种植基地管理</h3><p>供港澳蔬菜种植基地应向所在地海关备案，应符合以下条件：（1）具有合法经营权；（2）大气、土壤和水质符合国家有关标准，周围无污染源；（3）建立质量安全管理制度（含农药使用管理、产品追溯制度等）。种植基地应对农药使用进行严格管控，严禁使用高毒高残留农药。</p><h3>三、加工企业监管</h3><p>供港澳蔬菜加工企业应向海关备案，建立并有效运行食品安全管理体系。加工企业应设立原料验收制度，对每批原料进行农药残留快速检测，不合格原料不得投入加工。成品包装应清晰标注产地、加工企业和生产批次信息。</p><h3>四、检验检疫与出口</h3><p>出口前海关对供港澳蔬菜实施检验检疫，重点检测农药残留、重金属等安全卫生指标。经检验合格的海关签发证书，不合格的不得出口。企业应建立完整的产品追溯体系，确保每批产品可追溯至具体种植地块。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/15/article_2025121220584750000.html"}]
    },

    {
        id: 100,
        title: "海关总署公告2026年第71号：规范车床、铣床、磨床等相关物项出口申报",
        category: "通知公告",
        date: "2026-05-25",
        summary: "海关总署发布关于规范车床、铣床、磨床等机床类相关物项出口申报要求的公告。",
        content: `<h3>一、公告背景</h3><p>为规范机床类物项的出口申报秩序，维护国家安全和利益，海关总署发布2026年第71号公告，明确了车床、铣床、磨床等机床类相关物项的出口申报要求和商品归类规范。</p><h3>二、适用范围</h3><p>本公告适用于以下机床类物项的出口申报：（1）车床（含数控车床和普通车床）及其关键零部件；（2）铣床（含数控铣床、加工中心）及其关键零部件；（3）磨床（含数控磨床）及其关键零部件；（4）上述机床的数控系统、伺服驱动装置等关键功能部件。</p><h3>三、申报要求</h3><p>出口上述物项的企业应如实、准确申报商品的名称、规格型号、数量、金额、最终目的地和最终用户。对高精度（定位精度达到一定标准以上）的数控机床，还应提交技术参数表。企业应在申报前核实所出口商品是否属于两用物项出口管制范围。</p><h3>四、企业合规</h3><p>企业应建立机床类产品出口的合规审查机制，在签订出口合同前确认产品定位精度、联动轴数等技术参数是否达到管控标准。对于可能涉及出口管制的产品，应提前向商务部申请两用物项出口许可证。瞒报、伪报的将依法追究法律责任。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/25/article_2025121220584800000.html"}]
    },

    {
        id: 101,
        title: "海关总署公告2026年第65号：关于防止埃博拉病毒病疫情传入我国的公告",
        category: "通知公告",
        date: "2026-05-18",
        summary: "2026年5月17日世界卫生组织宣布刚果(金)和乌干达的埃博拉病毒病疫情构成国际关注的突发公共卫生事件。海关总署发布公告严防疫情传入。",
        content: `<h3>一、公告背景</h3><p>2026年5月17日，世界卫生组织（WHO）宣布刚果民主共和国（刚果(金)）和乌干达共和国的埃博拉病毒病疫情构成"国际关注的突发公共卫生事件"（PHEIC）。为防止埃博拉病毒病疫情传入我国，保护人民群众生命安全和身体健康，海关总署根据《中华人民共和国国境卫生检疫法》及其实施细则等法律法规的规定，发布2026年第65号公告。</p><h3>二、来自刚果(金)和乌干达的人员健康申报要求</h3><p>来自刚果(金)和乌干达的人员，在进境时应当向海关进行健康申报，配合海关卫生检疫人员做好体温监测、医学巡查、医学排查等卫生检疫工作。海关卫生检疫人员对有症状的人员，应当根据流行病学调查、医学检查和实验室检测结果，按照规定的程序采取医学措施。对判定为埃博拉病毒病染疫人或染疫嫌疑人的，转运至指定医疗机构诊治。</p><h3>三、来自刚果(金)和乌干达的交通工具、集装箱等检疫处理</h3><p>来自刚果(金)和乌干达的交通工具、集装箱、货物、行李物品、邮件、快件，其负责人、承运人、代理人或者货主应当主动向海关申报并接受卫生检疫。对可能被埃博拉病毒污染的，应当按照规定接受卫生处理。对来自刚果(金)和乌干达的航空器、船舶、列车等交通工具，到达我国口岸后，海关应当对其进行检疫查验，发现染疫或染疫嫌疑的，应立即实施消毒、除虫等卫生处理措施。</p><h3>四、前往刚果(金)和乌干达人员的旅行健康提示</h3><p>前往刚果(金)和乌干达的人员，出境前可以向海关及其国际旅行卫生保健中心咨询或通过海关总署网站（www.customs.gov.cn）信息公开栏目查询埃博拉病毒病疫情信息和预防知识。旅行期间应避免接触灵长类、蝙蝠等野生动物，避免接触疑似患者和死者遗体。出现发热、乏力、肌肉疼痛、头痛、咽痛等症状应及时就医。回国入境时如有上述症状应向海关主动申报并配合检疫工作。</p><h3>五、公告有效期</h3><p>本公告自发布之日起生效，有效期6个月。期间世界卫生组织宣布PHEIC终止的，本公告自动失效。</p>`,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/19/article_2026051908465759649.html"}]
    },

    {
        id: 102,
        title: "海关总署 农业农村部公告2026年第59号：防止莱索托非洲马瘟传入我国",
        category: "通知公告",
        date: "2026-05-07",
        summary: "莱索托向WOAH报告发生非洲马瘟。海关总署、农业农村部联合公告禁止从莱索托输入马属动物及其相关产品。",
        content: `<h3>一、公告背景</h3><p>莱索托王国向世界动物卫生组织（WOAH）报告发生非洲马瘟。为防止疫情传入我国，保护我国畜牧业安全和人民健康，海关总署、农业农村部联合发布2026年第59号公告。</p><h3>二、禁止直接或间接从莱索托输入马属动物及其相关产品</h3><p>禁止直接或间接从莱索托输入马属动物（马、骡、驴等）及其相关产品（包括马属动物的精液、胚胎等遗传物质）。</p><h3>三、禁止寄递或携带来自莱索托的马属动物及其产品入境</h3><p>禁止寄递或携带来自莱索托的马属动物及其相关产品入境。一经发现，一律作退回或销毁处理。</p><h3>四、来自莱索托的进境交通工具发现马属动物及相关产品的处理</h3><p>进境船舶、航空器、列车、车辆等运输工具上，如发现有来自莱索托的马属动物及其相关产品的，一律作封存处理，且在我国境内停留或者运行期间，未经海关许可，不得启封动用。其废弃物、泔水等，一律在海关的监督下作无害化处理，不得擅自抛弃。</p><h3>五、对非法入境的莱索托马属动物及其产品的处理</h3><p>对边防等部门截获的非法入境的来自莱索托的马属动物及其相关产品，一律在海关的监督下作销毁处理。</p><h3>六、违反规定的处理</h3><p>凡违反上述规定者，由海关依照《中华人民共和国海关法》《中华人民共和国进出境动植物检疫法》及其实施条例有关规定处理。</p>`,
        author: "海关总署 农业农村部",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/13/article_2026051308235444475.html"}]
    },

    {
        id: 103,
        title: "2026年全国海关工作会议在京召开：十四五期间年均监管进出口货物52亿吨",
        category: "通知公告",
        date: "2026-01-17",
        summary: "2026年全国海关工作会议在京召开，通报十四五期间我国年均监管进出口货物52亿吨、42.3万亿元，体量全球最大。",
        content: `<h3>一、会议概况</h3><p>2026年1月16日至17日，全国海关工作会议在北京召开。会议以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届二中、三中全会精神，全面落实中央经济工作会议部署，总结"十四五"时期海关工作，分析当前形势，部署2026年重点任务。</p><h3>二、"十四五"期间工作成效</h3><p>会议通报，"十四五"期间海关各项工作取得显著成效。我国年均监管进出口货物52亿吨，进出口货值达42.3万亿元人民币，我国进出口货物贸易体量居全球首位。口岸通关效率持续提升，进出口整体通关时间大幅压缩。海关监管服务能力取得跨越式发展，科技兴关战略深入推进，智慧海关建设取得突破性进展。</p><h3>三、2026年重点工作部署</h3><p>会议对2026年海关重点工作作出部署：（1）全面筑牢国门安全屏障，严厉打击洋垃圾、象牙等濒危物种及其制品走私，严密防范动植物疫情疫病和外来物种入侵；（2）加强综合治税，发挥税收对财政的保障作用，完成全年税收预算目标；（3）推进智慧海关建设和"智关强国"行动，加快数字化转型和智能化升级；（4）持续优化口岸营商环境，推动跨境贸易便利化，深化"单一窗口"建设；（5）加强进出境疫情防控，特别是埃博拉、猴痘等国际关注传染病防控；（6）开展进口食品安全监管专项整顿，保障人民群众"舌尖上的安全"。</p>`,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-01/19/article_2026011909163431094.html"}]
    },

    {
        id: 104,
        title: "海关总署关于执行进口黄金矿砂免征进口环节增值税政策有关事项的公告",
        category: "通知公告",
        date: "2026-01-09",
        summary: "海关总署就执行进口黄金矿砂免征进口环节增值税政策有关事项发布公告，明确符合条件的黄金矿砂免征增值税。",
        content: `<h3>一、公告背景</h3><p>根据《财政部 国家税务总局关于黄金矿砂免征进口环节增值税的通知》（财关税〔2025〕15号）的规定，海关总署就执行进口黄金矿砂免征进口环节增值税政策的有关事项发布公告。</p><h3>二、免征增值税的条件</h3><p>符合以下条件的进口黄金矿砂（含黄金与其他矿物的共生矿、伴生矿），免征进口环节增值税：（1）黄金矿砂中的黄金含量应当符合现行有效的国家标准GB/T 17418-2025《黄金矿产品化学分析方法》中规定的工业品位标准；（2）进口黄金矿砂应当是在境外开采的原矿或经过物理选矿富集的精矿，不得经过冶炼、焙烧等化学冶金处理。</p><h3>三、申报与通关要求</h3><p>进口企业申报黄金矿砂时，应当在进口报关单"商品编号"栏中准确填报黄金矿砂对应的HS编码。申报时需提交黄金含量检测报告、产地证明等随附单证。海关可依据风险布控对进口黄金矿砂实施现场查验和取样检验，验证其黄金含量是否符合免税标准。</p><h3>四、后续监管</h3><p>进口企业应当如实记录黄金矿砂的进口、使用和流向情况，相关记录保存期不得少于3年。海关有权对享受免征增值税政策的进口黄金矿砂进行后续稽查，发现弄虚作假或以非黄金矿砂冒充的，依法追缴税款并予以处罚。</p>`,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-01/09/article_2026012016083456028.html"}]
    },

    {
        id: 105,
        title: "海关总署公告2026年第12号：启动进出口货物多式联运（海铁、水水）中转模式",
        category: "通知公告",
        date: "2026-01-27",
        summary: "海关总署发布公告启动进出口货物多式联运中转模式，支持海铁联运和水水中转。",
        content: `<h3>一、公告背景</h3><p>为贯彻落实国家关于推动多式联运高质量发展、优化口岸营商环境的部署要求，海关总署发布2026年第12号公告，决定在全国具备条件的口岸启动进出口货物多式联运（海铁、水水）中转模式。</p><h3>二、适用的联运模式</h3><p>本公告适用于以下两种多式联运中转模式：（1）海铁联运中转——进出口货物通过海运运抵中转港口后，换装铁路运输至目的港或内陆铁路站点；（2）水水中转——进出口货物通过国际海运运抵中转港口后，换装内支线船舶或内贸船舶运输至目的港。两种模式均可在"国际贸易单一窗口"办理全程通关手续。</p><h3>三、通关便利化措施</h3><p>符合条件的企业可通过"单一窗口"一次性提交全程联运舱单数据和报关数据，实现"一次申报、一单到底"。中转货物在中转港实行"直接换装"作业，免除中转港的重复查验。货物中转运输过程中海关实施途中监管，依托电子关锁、GPS追踪等智能监管手段，确保货物全程在海关有效监管之下。</p><h3>四、企业资质要求</h3><p>参与多式联运中转模式的企业应在海关注册登记，具备良好的信用记录，近两年无重大走私违规记录。海关高级认证企业（AEO）可优先适用本模式。</p>`,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关法规原文", url:"http://www.customs.gov.cn/customs/302249/302266/2011fa33-2.html"}]
    },

    {
        id: 106,
        title: "海关总署关于实施《进出口化妆品检验检疫监督管理办法》有关事项的公告（284号令施行）",
        category: "通知公告",
        date: "2026-05-12",
        summary: "海关总署发布关于284号令进出口化妆品检验检疫监督管理办法施行事项公告，明确过渡期、企业备案等具体执行要求。",
        content: `<h3>一、公告背景</h3><p>《中华人民共和国海关进出口化妆品检验检疫监督管理办法》（海关总署令第284号，以下简称《办法》）已正式公布，将于2026年12月1日起施行。海关总署就284号令施行的有关事项发布公告，明确过渡期安排和企业备案、检验检疫流程等具体执行要求。</p><h3>二、企业备案要求</h3><p>进口化妆品的收货人应当在《办法》施行前向所在地海关办理备案手续，提交企业法人营业执照复印件、质量安全管理制度文件、进口化妆品追溯体系建设方案等材料。出口化妆品生产企业应当在《办法》施行前完善质量管理体系，确保出口化妆品符合进口国（地区）标准或者合同要求。</p><h3>三、过渡期安排</h3><p>自284号令公布之日（2026年5月6日）起至2026年12月1日止为过渡期。过渡期内，进出口化妆品检验检疫仍按现行规定执行。企业应在过渡期内对照284号令要求完成企业备案、制度建设和流程调整等准备工作。2026年12月1日起，所有进出口化妆品业务严格按照284号令执行。</p><h3>四、产品安全评估与标签管理</h3><p>首次进口的化妆品，收货人应当提供产品安全性评估资料，包括产品配方、生产工艺、安全风险评估报告等。进口化妆品的中文标签应当符合《消费品使用说明 化妆品通用标签》（GB 5296.3）等国家标准要求，标签内容应当真实、完整、准确。</p>`,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/12/article_2026051218041286566.html"}]
    },

    {
        id: 107,
        title: "海关总署关于进口莫桑比克野生水产品检验检疫要求的公告（第58号）",
        category: "通知公告",
        date: "2026-05-08",
        summary: "海关总署发布第58号公告，明确进口莫桑比克野生水产品检验检疫和卫生要求。",
        content: `<h3>一、公告背景</h3><p>根据我国法律法规和中华人民共和国海关总署与莫桑比克共和国海洋、内水与渔业部关于莫桑比克野生水产品输华检验检疫和卫生要求的议定书规定，海关总署发布2026年第58号公告，明确允许符合相关要求的莫桑比克野生水产品进口。</p><h3>二、允许进口的产品范围</h3><p>允许进口的莫桑比克野生水产品是指野生捕捞的供人类食用的水生动物产品及其制品，不包括《濒危野生动植物种国际贸易公约》（CITES）附录和中国国家重点保护野生动物名录所列物种。</p><h3>三、生产企业注册要求</h3><p>向中国出口野生水产品的莫桑比克生产企业（包括加工企业和捕捞船、运输船、加工船和独立冷库），应当获得莫桑比克共和国海洋、内水与渔业部的批准并在其有效监管之下。上述企业的卫生条件应当符合中国和莫桑比克的有关兽医卫生和公共卫生法律法规要求，并由莫方向中方推荐注册。未经注册的莫桑比克生产企业不得向中国出口。</p><h3>四、产品标准和检验检疫要求</h3><p>进口的莫桑比克野生水产品应当符合中国食品安全国家标准和相关检验检疫要求。每批产品应随附莫桑比克官方出具的卫生证书正本原件，证书中应注明生产企业注册编号、产品品种、数量、生产日期等信息。海关对进口产品实施检验检疫，重点检测致病菌、重金属、兽药残留等项目。</p>`,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/08/article_2026050821235171002.html"}]
    },

    {
        id: 108,
        title: "海关总署关于2026年关税调整方案实施有关事项公告",
        category: "通知公告",
        date: "2026-01-01",
        summary: "经国务院批准，《2026年关税调整方案》自2026年1月1日起实施，海关总署发布执行事宜公告。",
        content: `<h3>一、公告背景</h3><p>经国务院批准，《2026年关税调整方案》（以下简称《方案》）自2026年1月1日起实施。为做好《方案》实施工作，海关总署就有关事项发布公告。</p><h3>二、进口关税税率调整</h3><p>（一）最惠国税率：对935项商品（不含关税配额商品）实施进口暂定税率；（二）关税配额税率：对小麦、玉米、稻谷和大米、糖、羊毛、毛条、棉花、化肥等8类商品继续实施关税配额管理，配额税率不变；（三）协定税率：根据我国与有关国家或地区签署的自由贸易协定和优惠贸易安排，对原产于33个国家或地区的部分商品实施协定税率。其中，中国-尼加拉瓜自由贸易协定早期收获安排自2026年1月1日起生效实施；（四）对最不发达国家实施特惠税率，给予与我国建交的45个最不发达国家98%税目产品零关税待遇。</p><h3>三、出口关税调整</h3><p>对68项商品征收出口暂定税率，主要涉及部分金属矿产品、稀土、部分铁合金等资源类商品。对除上述商品外的其他商品继续免征出口关税。</p><h3>四、税目调整</h3><p>2026年《中华人民共和国进出口税则》共计8972个八位税目。海关总署已在海关通关系统中同步更新税则数据，企业自2026年1月1日起申报进出口货物时应按照新税则填制报关单。</p>`,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2025-12/31/article_2025123119401553789.html"}]
    },

    {
        id: 109,
        title: "海关总署关于进口乌克兰小麦粉检验检疫和卫生要求的公告（第60号）",
        category: "通知公告",
        date: "2026-05-11",
        summary: "海关总署发布第60号公告，明确进口乌克兰小麦粉检验检疫和卫生要求。",
        content: `<h3>一、公告背景</h3><p>根据我国法律法规和中华人民共和国海关总署与乌克兰农业政策与食品部关于乌克兰小麦粉输华检验检疫和卫生要求的议定书规定，海关总署发布2026年第60号公告，明确允许符合相关要求的乌克兰小麦粉进口。</p><h3>二、允许进口的产品</h3><p>本公告所指小麦粉（Wheat Flour）是由乌克兰境内种植的小麦（Triticum aestivum L.）经加工研磨而成的面粉，供人类食用或食品加工原料使用。小麦粉中不得添加其他任何配料或食品添加剂。</p><h3>三、加工企业注册要求</h3><p>向中国出口小麦粉的乌克兰加工企业应经乌克兰农业政策与食品部批准并在其有效监管之下。乌方应向中方推荐符合要求的企业名单，经中方审核通过并注册后，该企业方可向中国出口小麦粉。注册企业名单在海关总署网站公布。</p><h3>四、生产、加工和储存要求</h3><p>小麦粉的原料小麦应当产自未发生小麦矮腥黑穗病（TCK）的地区，或在加工前经过有效处理杀灭TCK孢子。加工企业应建立并有效运行危害分析与关键控制点（HACCP）体系。小麦粉的加工、储存和运输全过程应当符合卫生要求，防止有害生物污染。</p><h3>五、证书要求</h3><p>每批进口乌克兰小麦粉应当随附乌克兰农业政策与食品部出具的植物检疫证书正本原件，证书中应注明加工企业注册编号、产品名称、数量、生产日期，并附加声明"该批小麦粉符合中华人民共和国海关总署与乌克兰农业政策与食品部关于乌克兰小麦粉输华检验检疫和卫生要求的议定书规定"。</p>`,
        author: "海关总署",
        pinned: false,
        links: [{title:"海关总署原文", url:"http://www.customs.gov.cn/customs/2026-05/11/article_2026051111263276525.html"}]
    },

    {
        id: 110,
        title: "饲料出口企业备案办事指南",
        category: "办事指南",
        date: "2026-06-22",
        author: "海关总署",
        summary: "出口饲料和饲料添加剂的生产企业应当向所在地海关办理备案。根据《进出口饲料和饲料添加剂检验检疫监督管理办法》，备案后可出口饲料产品。",
        pinned: false,

            <p>知识产权权利证明文件、申请人身份证明、授权委托书等</p>
            <h3>五、办理流程</h3>
            <p>登录海关总署知识产权海关保护备案系统（https://ipp.customs.gov.cn）→在线提交申请→海关总署审核</p>
            <h3>六、办结时限</h3>
            <p>自收到全部申请文件之日起30个工作日内</p>
            <h3>七、备案有效期</h3>
            <p>自核准之日起10年（可续展）</p>

<script>
// ========================================
// 信息公示平台 - 核心脚本
// ========================================

(function() {
    'use strict';

    // -------- 工具函数 --------
    const $ = (sel, ctx) => (ctx || document).querySelector(sel);
    const $$ = (sel, ctx) => [...(ctx || document).querySelectorAll(sel)];

    // 当前状态
    let currentCategory = '全部';
    let currentSearch = '';
    let currentPage = 1;
    const PER_PAGE = 10;

    // -------- 页面初始化 --------
    function init() {
        applySiteConfig();
        renderCategoryNav();
        bindSearch();
        bindCategoryClicks();
        renderNotices();
        bindPageNav();
    }

    // 应用网站配置
    function applySiteConfig() {
        document.title = SITE_CONFIG.siteName;
        const nameEl = $('.site-title');
        const descEl = $('.site-subtitle');
        const copyEl = $('.footer-copyright');
        const icpEl = $('.footer-icp');
        if (nameEl) nameEl.textContent = SITE_CONFIG.siteName;
        if (descEl) descEl.textContent = SITE_CONFIG.siteDesc;
        if (copyEl) copyEl.textContent = `© ${new Date().getFullYear()} ${SITE_CONFIG.copyright}`;
        if (icpEl) icpEl.textContent = SITE_CONFIG.icp || '';
    }

    // 渲染分类标签
    function renderCategoryNav() {
        const nav = $('.category-nav');
        if (!nav) return;
        const cats = SITE_CONFIG.categories || CATEGORIES;
        nav.innerHTML = cats.map(c =>
            `<span class="category-tag${c === currentCategory ? ' active' : ''}" data-category="${c}">${c}</span>`
        ).join('');
    }

    // 绑定搜索事件
    function bindSearch() {
        const input = $('.search-input');
        const btn = $('.search-btn');
        const clear = $('.search-clear');
        if (!input) return;

        input.addEventListener('input', () => {
            if (clear) clear.classList.toggle('visible', input.value.length > 0);
        });

        if (clear) {
            clear.addEventListener('click', () => {
                input.value = '';
                clear.classList.remove('visible');
                currentSearch = '';
                currentPage = 1;
                renderNotices();
                input.focus();
            });
        }

        if (btn) {
            btn.addEventListener('click', () => {
                currentSearch = input.value.trim();
                currentPage = 1;
                renderNotices();
            });
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                currentSearch = input.value.trim();
                currentPage = 1;
                renderNotices();
            }
        });
    }

    // 绑定分类点击
    function bindCategoryClicks() {
        const nav = $('.category-nav');
        if (!nav) return;
        nav.addEventListener('click', (e) => {
            const tag = e.target.closest('.category-tag');
            if (!tag) return;
            currentCategory = tag.dataset.category;
            currentPage = 1;
            renderCategoryNav();
            renderNotices();
        });
    }

    // 绑定页面导航（首页/关于）
    function bindPageNav() {
        const navLinks = $$('.header-nav a');
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                const href = link.getAttribute('href');
                if (!href || href === '#') {
                    e.preventDefault();
                    showHome();
                } else if (href === '#about') {
                    e.preventDefault();
                    showAbout();
                } else if (href === 'index.html' || href === './' || href === '/') {
                    e.preventDefault();
                    showHome();
                }
            });
        });
    }

    // -------- 渲染公告列表 --------
    function renderNotices() {
        const container = $('.notice-container');
        const resultInfo = $('.result-info span');
        if (!container) return;

        // 过滤
        let filtered = [...NOTICES];
        if (currentCategory !== '全部') {
            filtered = filtered.filter(n => n.category === currentCategory);
        }
        if (currentSearch) {
            const kw = currentSearch.toLowerCase();
            filtered = filtered.filter(n =>
                n.title.toLowerCase().includes(kw) ||
                n.summary.toLowerCase().includes(kw) ||
                n.category.toLowerCase().includes(kw) ||
                (n.author && n.author.toLowerCase().includes(kw))
            );
        }

        // 排序：置顶优先，然后按日期倒序
        filtered.sort((a, b) => {
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;
            return b.date.localeCompare(a.date);
        });

        if (resultInfo) {
            resultInfo.textContent = `共找到 ${filtered.length} 条信息`;
        }

        // 分页
        const totalPages = Math.ceil(filtered.length / PER_PAGE) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PER_PAGE;
        const pageItems = filtered.slice(start, start + PER_PAGE);

        if (pageItems.length === 0) {
            container.innerHTML = `
                <div class="empty-state" style="background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);">
                    <div class="empty-state-icon">📭</div>
                    <div class="empty-state-text">没有找到相关信息</div>
                </div>`;
            renderPagination(0, 0);
            return;
        }

        container.innerHTML = `<div class="notice-list">${pageItems.map(item => renderNoticeItem(item)).join('')}</div>`;

        renderPagination(totalPages, filtered.length);

        // 绑定点击事件
        $$('.notice-item', container).forEach(el => {
            el.addEventListener('click', () => {
                const id = parseInt(el.dataset.id);
                showDetail(id);
            });
        });
    }

    function renderNoticeItem(item) {
        const dateParts = item.date.split('-');
        const monthDay = `${parseInt(dateParts[1])}月${parseInt(dateParts[2])}日`;
        return `
            <div class="notice-item${item.pinned ? ' pinned' : ''}" data-id="${item.id}">
                ${item.pinned ? '<span class="pin-badge">置顶</span>' : ''}
                <div class="notice-date-col">
                    <div class="notice-date-day">${dateParts[2]}</div>
                    <div class="notice-date-month">${dateParts[0]}/${dateParts[1]}</div>
                </div>
                <div class="notice-content-col">
                    <div class="notice-title">${escapeHtml(item.title)}</div>
                    <div class="notice-summary">${escapeHtml(item.summary)}</div>
                    <div class="notice-meta">
                        <span class="notice-category-tag">${escapeHtml(item.category)}</span>
                        <span>📅 ${item.date}</span>
                        <span>🏢 ${escapeHtml(item.author || '')}</span>
                    </div>
                </div>
            </div>`;
    }

    // -------- 分页 --------
    function renderPagination(totalPages, totalItems) {
        const paginationEl = $('.pagination');
        if (!paginationEl) return;
        if (totalPages <= 1) {
            paginationEl.innerHTML = '';
            return;
        }

        let html = '';
        html += `<button class="page-btn" ${currentPage <= 1 ? 'disabled' : ''} data-page="${currentPage - 1}">« 上一页</button>`;

        for (let i = 1; i <= totalPages; i++) {
            if (totalPages <= 7 || i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                html += `<button class="page-btn${i === currentPage ? ' active' : ''}" data-page="${i}">${i}</button>`;
            } else if (i === currentPage - 2 || i === currentPage + 2) {
                html += `<span style="padding:8px 4px;color:#9ca3af;">...</span>`;
            }
        }

        html += `<button class="page-btn" ${currentPage >= totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">下一页 »</button>`;

        paginationEl.innerHTML = html;

        // 绑定分页点击
        $$('.page-btn', paginationEl).forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.disabled) return;
                currentPage = parseInt(btn.dataset.page);
                renderNotices();
                $('.main-container').scrollIntoView({ behavior: 'smooth' });
            });
        });
    }

    // -------- 详情页 --------
    function showDetail(id) {
        const notice = NOTICES.find(n => n.id === id);
        if (!notice) return;

        const main = $('.main-container');

        // 原文链接（正文下方展示）
        const sourceHtml = notice.links && notice.links.length
            ? `<div class="detail-source-box"><div class="detail-source-label">📄 原文出处</div>${notice.links.map(l => `
                <a class="detail-source-link" href="${escapeHtml(l.url)}" target="_blank" rel="noopener">
                    <span class="detail-source-title">${escapeHtml(l.title)}</span>
                    <span class="detail-source-arrow">↗</span>
                </a>`).join('')}</div>` : '';

        // 附件 HTML
        const attachmentsHtml = notice.attachments && notice.attachments.length
            ? `<div class="detail-section">
                <h3>📎 附件下载</h3>
                <div class="attachment-list">
                    ${notice.attachments.map(a => `
                        <a class="attachment-item" href="${escapeHtml(a.url)}" target="_blank" download>
                            <span class="attachment-icon">${getFileIcon(a.name, a.type)}</span>
                            <span class="attachment-name">${escapeHtml(a.name)}</span>
                            <span class="attachment-action">下载</span>
                        </a>
                    `).join('')}
                </div>
            </div>` : '';

        // 上传文件 / 联系管理员
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const uploadHtml = isLocal ? `
            <div class="detail-section">
                <h3>📤 上传文件</h3>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-dropzone">
                        <span class="upload-icon">📂</span>
                        <p>点击或拖拽文件到这里上传</p>
                        <p class="upload-hint">支持 Word、Excel、PDF、图片等格式</p>
                    </div>
                    <input type="file" id="uploadFileInput" multiple accept="*/*" style="display:none;">
                </div>
                <div class="upload-progress" id="uploadProgress" style="display:none;">
                    <span class="upload-progress-text"></span>
                    <div class="upload-progress-bar"><div class="upload-progress-fill"></div></div>
                </div>
            </div>` : `
            <div class="detail-section">
                <h3>📤 附件说明</h3>
                <div class="upload-dropzone" style="border-style:solid;">
                    <span class="upload-icon">📧</span>
                    <p>如需添加附件或文件，请联系管理员上传</p>
                </div>
            </div>`;

        main.innerHTML = `
            <div class="detail-page">
                <button class="detail-back" onclick="window.showHome()">← 返回列表</button>
                <div class="detail-header">
                    <h1 class="detail-title">${escapeHtml(notice.title)}</h1>
                    <div class="detail-meta">
                        <span>📅 发布日期：${notice.date}</span>
                        <span class="notice-category-tag">${escapeHtml(notice.category)}</span>
                        <span>🏢 ${escapeHtml(notice.author || '')}</span>
                    </div>
                </div>
                <div class="detail-content">
                    ${notice.content}
                </div>
                ${sourceHtml}
                ${attachmentsHtml}
                ${uploadHtml}
            </div>`;

        // 绑定上传事件（仅本地环境）
        if (isLocal) bindUpload(notice.id);

        // 隐藏搜索和分类
        $('.search-bar').style.display = 'none';
        $('.category-nav').style.display = 'none';
        $('.result-info').style.display = 'none';
        $('.pagination').innerHTML = '';

        window.scrollTo({ top: 0, behavior: 'smooth' });

        // 暴露返回函数
        window.showHome = showHome;
    }

    function getFileIcon(filename, type) {
        const ext = (filename || '').split('.').pop().toLowerCase();
        const map = {
            pdf: '📄', doc: '📝', docx: '📝', xls: '📊', xlsx: '📊',
            ppt: '📽', pptx: '📽', jpg: '🖼', jpeg: '🖼', png: '🖼',
            gif: '🖼', webp: '🖼', zip: '📦', rar: '📦', '7z': '📦',
            txt: '📃', mp4: '🎬', mp3: '🎵'
        };
        return map[ext] || map[type] || '📎';
    }

    function bindUpload(noticeId) {
        const area = $('#uploadArea');
        const input = $('#uploadFileInput');
        const progress = $('#uploadProgress');

        if (!area || !input) return;

        // 点击上传区域
        area.addEventListener('click', () => input.click());

        // 选择文件
        input.addEventListener('change', () => {
            if (input.files.length) uploadFiles(input.files, progress);
        });

        // 拖拽上传
        area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('dragover'); });
        area.addEventListener('dragleave', () => area.classList.remove('dragover'));
        area.addEventListener('drop', (e) => {
            e.preventDefault();
            area.classList.remove('dragover');
            if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files, progress);
        });
    }

    async function uploadFiles(files, progressEl) {
        const formData = new FormData();
        for (const f of files) {
            formData.append('files', f);
        }

        progressEl.style.display = 'block';
        $('.upload-progress-text', progressEl).textContent = `正在上传 ${files.length} 个文件...`;

        try {
            const resp = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await resp.json();

            if (data.ok) {
                $('.upload-progress-text', progressEl).textContent = `✅ 上传成功！${data.files.length} 个文件`;
                setTimeout(() => { progressEl.style.display = 'none'; }, 3000);
            } else {
                $('.upload-progress-text', progressEl).textContent = `❌ 上传失败: ${data.error}`;
            }
        } catch (err) {
            $('.upload-progress-text', progressEl).textContent = `❌ 网络错误: ${err.message}`;
        }
    }

    function showHome() {
        const main = $('.main-container');
        main.innerHTML = `<div class="notice-container"></div>`;
        $('.search-bar').style.display = '';
        $('.category-nav').style.display = '';
        $('.result-info').style.display = '';
        $('.pagination').innerHTML = '';

        init();
    }

    window.showHome = showHome;

    // -------- 关于页面 --------
    function showAbout() {
        const main = $('.main-container');
        main.innerHTML = `
            <div class="about-page">
                <h2>关于我们</h2>
                <div class="about-card">
                    <h3>平台简介</h3>
                    <p>${SITE_CONFIG.siteName}是面向公众的官方信息发布平台，致力于推进信息公开工作，保障公众的知情权、参与权和监督权。</p>
                </div>
                <div class="about-card">
                    <h3>服务内容</h3>
                    <p>本平台主要发布以下类型信息：</p>
                    <p>1. 通知公告：重要事项的通知和公告信息；</p>
                    <p>2. 政策法规：相关的政策和法律法规信息；</p>
                    <p>3. 办事指南：各项业务的办理流程和指南；</p>
                    <p>4. 结果公示：各类审批、评选结果的公开公示。</p>
                </div>
                <div class="about-card">
                    <h3>联系我们</h3>
                    <p>如您对本平台有任何意见或建议，欢迎通过以下方式联系我们：</p>
                    <p>📧 电子邮箱：example@example.com</p>
                    <p>📞 联系电话：XXX-XXXXXXX</p>
                    <p>📍 地址：待补充</p>
                </div>
            </div>`;

        $('.search-bar').style.display = 'none';
        $('.category-nav').style.display = 'none';
        $('.result-info').style.display = 'none';
        $('.pagination').innerHTML = '';
    }

    window.showAbout = showAbout;

    // -------- 工具 --------
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // 启动
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();

</script>
<script>
// ========================================
// 分享功能 —— 二维码弹窗
// ========================================
(function() {
    'use strict';
    let qrGenerated = false;

    function initShare() {
        const fab = document.querySelector('.share-fab');
        const overlay = document.querySelector('.qr-overlay');
        const closeBtn = document.querySelector('.qr-close');
        const qrContainer = document.getElementById('qrcode');
        const qrUrl = document.getElementById('qrUrl');

        if (!fab || !overlay) return;

        fab.addEventListener('click', () => {
            overlay.classList.add('show');
            if (!qrGenerated) { generateQR(qrContainer, qrUrl); qrGenerated = true; }
        });

        closeBtn.addEventListener('click', () => overlay.classList.remove('show'));
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('show'); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.classList.contains('show')) overlay.classList.remove('show');
        });
    }

    function generateQR(container, urlEl) {
        let url = window.location.origin + window.location.pathname;
        // 去掉 index.html
        url = url.replace(/\/index\.html$/, '/').replace(/\/$/, '') || url;
        // 如果是 localhost ，提示用局域网地址
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            url = 'http://192.168.1.254:' + (window.location.port || '80') + window.location.pathname;
        }

        if (urlEl) urlEl.textContent = url;

        if (typeof QRCode !== 'undefined') {
            new QRCode(container, {
                text: url, width: 200, height: 200,
                colorDark: '#1f2937', colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
            const img = container.querySelector('img');
            if (img) img.removeAttribute('title');
        } else {
            container.innerHTML = `<div style="padding:20px;font-size:14px;">网站地址：<br><strong style="word-break:break-all;">${url}</strong></div>`;
        }
    }

    window.copyQrUrl = function() {
        let url = window.location.origin + window.location.pathname;
        url = url.replace(/\/index\.html$/, '/');
        const btn = document.querySelector('.qr-copy-btn');
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => showCopied(btn)).catch(() => fallbackCopy(url, btn));
        } else { fallbackCopy(url, btn); }
    };

    function fallbackCopy(text, btn) {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); showCopied(btn); } catch (e) { alert('链接：' + text); }
        document.body.removeChild(ta);
    }

    function showCopied(btn) {
        if (!btn) return;
        const orig = btn.textContent; btn.textContent = '✅ 已复制'; btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
    }

    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initShare); }
    else { initShare(); }
})();

</script>
<script>
// ========================================
// 智能问答机器人（直连版 - 适用于静态部署）
// ========================================
(function() {
    'use strict';

    let panelVisible = false;
    let isProcessing = false;
    // API Key 从 data.js 读取，如果未配置则提示用户
    const API_KEY = (typeof SITE_CONFIG !== 'undefined' && SITE_CONFIG.agent && SITE_CONFIG.agent.apiKey) || '';
    const API_URL = 'https://api.deepseek.com/v1/chat/completions';

    const SYSTEM_PROMPT = `你是信息公示平台的智能客服助手。你的职责是：
1. 回答用户关于信息公示平台的各类问题
2. 帮助用户查找和理解公示信息
3. 引导用户使用平台的功能（搜索、分类浏览等）
4. 态度友好、专业、准确

关于本平台：
- 这是一个信息公示平台，发布通知公告、政策法规、办事指南、结果公示等内容
- 用户可以通过分类筛选和关键词搜索查找信息
- 支持查看附件、相关链接等功能

如果用户问的问题你无法回答（超出平台范围），请礼貌地说明并建议用户联系相关部门。`;

    function init() {
        const toggle = document.getElementById('agentToggle');
        const panel = document.getElementById('agentPanel');
        const close = document.getElementById('agentClose');
        const minimize = document.getElementById('agentMinimize');
        const send = document.getElementById('agentSend');
        const input = document.getElementById('agentInput');

        if (!toggle || !panel) return;

        toggle.addEventListener('click', () => {
            panelVisible = !panelVisible;
            panel.classList.toggle('open', panelVisible);
            if (panelVisible) input.focus();
        });

        close.addEventListener('click', () => {
            panelVisible = false;
            panel.classList.remove('open');
        });

        minimize.addEventListener('click', () => {
            panelVisible = false;
            panel.classList.remove('open');
        });

        send.addEventListener('click', sendMessage);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });
    }

    async function sendMessage() {
        const input = document.getElementById('agentInput');
        const text = input.value.trim();
        if (!text || isProcessing) return;

        if (!API_KEY) {
            addMessage('bot', '智能问答功能尚未配置 API Key。请在 data.js 中设置 SITE_CONFIG.agent.apiKey，或联系管理员。');
            return;
        }

        input.value = '';
        input.style.height = 'auto';
        isProcessing = true;

        addMessage('user', text);
        addTyping();

        try {
            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: 'deepseek-chat',
                    messages: [
                        { role: 'system', content: SYSTEM_PROMPT },
                        { role: 'user', content: text }
                    ]
                })
            });

            removeTyping();
            const data = await resp.json();

            if (data.choices && data.choices[0]) {
                addMessage('bot', data.choices[0].message.content);
            } else if (data.error) {
                addMessage('bot', '抱歉，智能助手暂时无法响应（' + data.error.message + '）。请稍后再试。');
            } else {
                addMessage('bot', '抱歉，智能助手暂时无法响应，请稍后再试。');
            }
        } catch (err) {
            removeTyping();
            addMessage('bot', '抱歉，网络连接异常，请稍后再试或通过其他方式联系我们。');
        }

        isProcessing = false;
    }

    function addMessage(role, content) {
        const container = document.getElementById('agentMessages');
        if (!container) return;

        const div = document.createElement('div');
        div.className = `agent-msg ${role}`;
        div.innerHTML = `<div class="agent-msg-content">${formatContent(content)}</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function addTyping() {
        const container = document.getElementById('agentMessages');
        if (!container) return;
        const div = document.createElement('div');
        div.className = 'agent-msg bot typing';
        div.id = 'typingIndicator';
        div.innerHTML = '<div class="agent-msg-content"><span class="typing-dot">●</span><span class="typing-dot">●</span><span class="typing-dot">●</span></div>';
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function removeTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    function formatContent(text) {
        if (!text) return '';
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/\n/g, '<br>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>
</body>
</html>
