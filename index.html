<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>铜仁海关信息公示</title>
    <style>
/* ========================================
   信息公示平台 - 样式表
   专业正式风格，适合政务/机构信息公示
   ======================================== */

/* -------- 基础设置 -------- */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --primary: #1a56db;         /* 主色调 - 稳重蓝 */
    --primary-dark: #1e3a8a;
    --primary-light: #dbeafe;
    --accent: #d97706;          /* 强调色 - 金色点缀 */
    --bg: #f5f7fa;
    --bg-card: #ffffff;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --text-light: #9ca3af;
    --border: #e5e7eb;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --shadow-hover: 0 4px 12px rgba(0,0,0,.1);
    --radius: 8px;
    --max-width: 1100px;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
}

a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }

/* -------- 顶部导航 -------- */
.site-header {
    background: var(--primary-dark);
    color: #fff;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.header-inner {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.site-logo {
    width: 40px;
    height: 40px;
    background: var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    flex-shrink: 0;
}

.site-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
}

.site-subtitle {
    font-size: 12px;
    opacity: .75;
    margin-top: 2px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.header-nav {
    display: flex;
    gap: 4px;
}

.header-nav a {
    color: rgba(255,255,255,.85);
    padding: 6px 16px;
    border-radius: 4px;
    font-size: 14px;
    transition: all .2s;
}

.header-nav a:hover,
.header-nav a.active {
    background: rgba(255,255,255,.15);
    color: #fff;
    text-decoration: none;
}

/* -------- 搜索栏 -------- */
.search-bar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 24px 20px;
}

.search-inner {
    max-width: var(--max-width);
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: center;
}

.search-input-wrap {
    flex: 1;
    position: relative;
}

.search-input-wrap::before {
    content: "🔍";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    z-index: 1;
}

.search-input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
    background: #fff;
}

.search-input:focus {
    border-color: var(--primary);
}

.search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: var(--text-light);
    display: none;
}

.search-clear.visible { display: block; }
.search-clear:hover { color: var(--text); }

.search-btn {
    padding: 12px 28px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .2s;
    font-weight: 500;
}

.search-btn:hover { background: var(--primary-dark); }

/* -------- 分类标签 -------- */
.category-nav {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.category-tag {
    padding: 6px 18px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    transition: all .2s;
    color: var(--text-secondary);
    user-select: none;
}

.category-tag:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.category-tag.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}

/* -------- 主体布局 -------- */
.main-container {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 20px;
    min-height: 50vh;
}

/* -------- 公告列表 -------- */
.notice-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
}

.notice-item {
    background: var(--bg-card);
    padding: 20px 24px;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    position: relative;
}

.notice-item:hover { background: #f8fafc; }

.notice-item.pinned { background: #fffbeb; }
.notice-item.pinned:hover { background: #fef3c7; }

.pin-badge {
    position: absolute;
    right: 20px;
    top: 20px;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 10px;
    font-weight: 500;
}

.notice-date-col {
    flex-shrink: 0;
    width: 56px;
    text-align: center;
    background: var(--bg);
    border-radius: 6px;
    padding: 8px 4px;
    line-height: 1.2;
}

.notice-date-day {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
}

.notice-date-month {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
}

.notice-content-col {
    flex: 1;
    min-width: 0;
}

.notice-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.notice-item:hover .notice-title { color: var(--primary); }

.notice-summary {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
}

.notice-meta {
    font-size: 12px;
    color: var(--text-light);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
}

.notice-category-tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 11px;
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 500;
}

/* -------- 空状态 -------- */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
}

.empty-state-icon {
    font-size: 48px;
    margin-bottom: 12px;
}

.empty-state-text {
    font-size: 16px;
}

/* -------- 详情页 -------- */
.detail-page {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 20px 60px;
}

.detail-header {
    border-bottom: 2px solid var(--primary);
    padding-bottom: 24px;
    margin-bottom: 28px;
}

.detail-title {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 16px;
}

.detail-meta {
    display: flex;
    gap: 20px;
    color: var(--text-secondary);
    font-size: 14px;
    flex-wrap: wrap;
    align-items: center;
}

.detail-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
}

.detail-content {
    font-size: 15px;
    line-height: 1.9;
    color: var(--text);
}

.detail-content h3 {
    font-size: 18px;
    margin: 28px 0 12px;
    color: var(--primary-dark);
    padding-left: 12px;
    border-left: 3px solid var(--primary);
}

.detail-content p {
    margin: 10px 0;
    text-indent: 2em;
}

.detail-content table.data-table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 14px;
}

.detail-content table.data-table th {
    background: var(--primary-dark);
    color: #fff;
    padding: 10px 12px;
    text-align: center;
    font-weight: 500;
}

.detail-content table.data-table td {
    padding: 10px 12px;
    border: 1px solid var(--border);
    text-align: center;
}

.detail-content table.data-table tr:nth-child(even) {
    background: var(--bg);
}

.detail-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 20px;
    color: var(--primary);
    font-size: 14px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
}

.detail-back:hover {
    color: var(--primary-dark);
    text-decoration: underline;
}

/* -------- 详情页 - 附件/链接/上传区域 -------- */
.detail-section {
    margin-top: 32px;
    background: #fff;
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
}

.detail-section h3 {
    font-size: 16px;
    margin-bottom: 16px;
    color: var(--primary-dark);
    border: none;
    padding: 0;
}

/* 附件列表 */
.attachment-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.attachment-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--bg);
    border-radius: 8px;
    border: 1px solid var(--border);
    transition: all .2s;
    color: var(--text);
    text-decoration: none;
}

.attachment-item:hover {
    border-color: var(--primary);
    background: var(--primary-light);
    text-decoration: none;
}

.attachment-icon { font-size: 24px; flex-shrink: 0; }

.attachment-name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.attachment-action {
    font-size: 13px;
    color: var(--primary);
    font-weight: 500;
    flex-shrink: 0;
}

/* 相关链接 */
.link-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.link-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--bg);
    border-radius: 8px;
    border: 1px solid var(--border);
    transition: all .2s;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
}

.link-item:hover {
    border-color: var(--primary);
    background: var(--primary-light);
    text-decoration: none;
}

.link-arrow {
    color: var(--primary);
    font-size: 14px;
}

/* 文件上传区域 */
.upload-area {
    cursor: pointer;
}

.upload-dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    transition: all .2s;
    background: var(--bg);
}

.upload-dropzone:hover,
.upload-dropzone.dragover {
    border-color: var(--primary);
    background: var(--primary-light);
}

.upload-icon { font-size: 40px; display: block; margin-bottom: 8px; }

.upload-dropzone p {
    margin: 4px 0;
    font-size: 14px;
    color: var(--text-secondary);
    text-indent: 0;
}

.upload-hint {
    font-size: 12px !important;
    color: var(--text-light) !important;
}

.upload-progress {
    margin-top: 12px;
    padding: 12px 16px;
    background: var(--primary-light);
    border-radius: 8px;
}

.upload-progress-text {
    font-size: 13px;
    color: var(--primary-dark);
    display: block;
    margin-bottom: 6px;
}

.upload-progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
}

.upload-progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 2px;
    animation: progressPulse 1.5s ease-in-out infinite;
    width: 100%;
}

@keyframes progressPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .5; }
}

/* -------- 智能问答机器人 -------- */
.agent-widget {
    position: fixed;
    bottom: 32px;
    right: 92px;
    z-index: 200;
}

.agent-toggle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(26, 86, 219, 0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all .25s;
    animation: fabIn .5s ease-out;
    gap: 0;
    padding: 0;
}

.agent-toggle:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 20px rgba(26, 86, 219, 0.45);
}

.agent-toggle-icon { font-size: 20px; line-height: 1; }

.agent-toggle-text {
    font-size: 8px;
    opacity: .9;
    line-height: 1;
    margin-top: 1px;
}

.agent-panel {
    position: fixed;
    bottom: 96px;
    right: 16px;
    width: 380px;
    max-width: calc(100vw - 32px);
    height: 500px;
    max-height: calc(100vh - 120px);
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,.15);
    display: none;
    flex-direction: column;
    overflow: hidden;
    animation: slideUp .3s ease-out;
}

.agent-panel.open { display: flex; }

.agent-header {
    background: var(--primary);
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 500;
    flex-shrink: 0;
}

.agent-header span { flex: 1; }

.agent-minimize,
.agent-close {
    background: none;
    border: none;
    color: rgba(255,255,255,.8);
    cursor: pointer;
    font-size: 18px;
    padding: 2px 8px;
    border-radius: 4px;
    line-height: 1;
}

.agent-minimize:hover,
.agent-close:hover {
    background: rgba(255,255,255,.2);
    color: #fff;
}

.agent-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f9fafb;
}

.agent-messages::-webkit-scrollbar { width: 4px; }
.agent-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.agent-msg { display: flex; }
.agent-msg.user { justify-content: flex-end; }
.agent-msg.bot { justify-content: flex-start; }

.agent-msg-content {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
}

.agent-msg.user .agent-msg-content {
    background: var(--primary);
    color: #fff;
    border-bottom-right-radius: 4px;
}

.agent-msg.bot .agent-msg-content {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
}

.agent-msg-content code {
    background: rgba(0,0,0,.06);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
}

.agent-msg.user .agent-msg-content code {
    background: rgba(255,255,255,.2);
}

.typing-dot {
    animation: typingPulse 1.4s ease-in-out infinite;
    display: inline-block;
    margin: 0 1px;
    font-size: 8px;
    vertical-align: middle;
    color: var(--text-light);
}

.typing-dot:nth-child(2) { animation-delay: .2s; }
.typing-dot:nth-child(3) { animation-delay: .4s; }

@keyframes typingPulse {
    0%, 60%, 100% { opacity: .3; }
    30% { opacity: 1; }
}

.agent-input-area {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: #fff;
    flex-shrink: 0;
    align-items: flex-end;
}

.agent-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    resize: none;
    font-family: inherit;
    outline: none;
    max-height: 120px;
    line-height: 1.5;
}

.agent-input:focus { border-color: var(--primary); }

.agent-send {
    padding: 10px 18px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background .2s;
}

.agent-send:hover { background: var(--primary-dark); }
.agent-send:disabled { opacity: .5; cursor: default; }

/* -------- 关于页面 -------- */
.about-page {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 20px 60px;
}

.about-page h2 {
    font-size: 24px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--primary);
}

.about-page p {
    margin: 12px 0;
    line-height: 1.9;
}

.about-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
}

.about-card h3 {
    font-size: 18px;
    margin-bottom: 12px;
    color: var(--primary-dark);
}

/* -------- 底部分页 -------- */
.pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 24px;
    padding: 16px;
    flex-wrap: wrap;
}

.page-btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    transition: all .2s;
    color: var(--text);
}

.page-btn:hover:not(:disabled) {
    border-color: var(--primary);
    color: var(--primary);
}

.page-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}

.page-btn:disabled {
    opacity: .4;
    cursor: default;
}

/* -------- 顶部结果统计 -------- */
.result-info {
    padding: 8px 20px 0;
    max-width: var(--max-width);
    margin: 0 auto;
    font-size: 13px;
    color: var(--text-secondary);
}

/* -------- 页脚 -------- */
.site-footer {
    background: var(--primary-dark);
    color: rgba(255,255,255,.7);
    text-align: center;
    padding: 20px;
    font-size: 13px;
    margin-top: 40px;
}

.site-footer a { color: rgba(255,255,255,.9); }

/* -------- 分享浮动按钮 -------- */
.share-fab {
    position: fixed;
    bottom: 32px;
    right: 28px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(26, 86, 219, 0.35);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .25s;
    animation: fabIn .5s ease-out;
}

.share-fab:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 20px rgba(26, 86, 219, 0.45);
}

.share-fab-icon {
    font-size: 22px;
    line-height: 1;
}

@keyframes fabIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* -------- 二维码弹窗 -------- */
.qr-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    animation: fadeIn .25s ease-out;
}

.qr-overlay.show {
    display: flex;
}

.qr-modal {
    background: #fff;
    border-radius: 16px;
    padding: 32px 28px 28px;
    text-align: center;
    max-width: 360px;
    width: 90%;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
    animation: slideUp .3s ease-out;
}

@keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.qr-close {
    position: absolute;
    top: 12px;
    right: 16px;
    background: none;
    border: none;
    font-size: 22px;
    color: var(--text-light);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 50%;
    transition: all .2s;
    line-height: 1;
}

.qr-close:hover {
    color: var(--text);
    background: var(--bg);
}

.qr-modal h3 {
    font-size: 20px;
    color: var(--text);
    margin-bottom: 6px;
}

.qr-desc {

    {
        id: 7,
        title: "出口食品原料种植场备案——茶叶、食用菌种植基地办事指南",
        category: "办事指南",
        date: "2026-05-19",
        summary: "海关总署对出口食品原料种植场实施备案管理，实施备案管理的出口食品原料品种目录包括蔬菜（含栽培食用菌）、茶叶等。",
        content: `
            <h3>一、事项名称</h3>
            <p>出口食品原料种植场备案（茶叶、食用菌等）</p>
            <h3>二、设定依据</h3>
            <p>1.《中华人民共和国食品安全法》第九十九条：出口食品生产企业和出口食品原料种植、养殖场应当向国家出入境检验检疫部门备案。</p>
            <p>2.《中华人民共和国进出口食品安全管理办法》（海关总署249号令）</p>
            <p>3.《关于公布实施备案管理出口食品原料品种目录的公告》：蔬菜（含栽培食用菌）、茶叶、大米、禽肉、禽蛋、猪肉、兔肉、蜂产品、水产品。</p>
            <p>4.《出口食品原料种植场备案管理规定》</p>
            <h3>三、适用范围</h3>
            <p>本指南适用于茶叶种植基地、食用菌（栽培）种植基地等出口食品原料种植场的备案申请。</p>
            <h3>四、申请条件</h3>
            <p>具有独立法人资格的出口食品生产加工企业、种植场、农民专业合作经济组织或者行业协会等组织均可申请。</p>
            <h3>五、种植场基本要求</h3>
            <p>1. 种植场有合法经营种植用地的证明文件；</p>
            <p>2. 符合当地海关确定的土地面积要求；</p>
            <p>3. 大气、土壤和灌溉用水符合国家有关标准，周边无污染源；</p>
            <p>4. 建立完善的质量安全管理制度（组织机构、农业投入品管理、疫情疫病监测、有毒有害物质控制、生产和追溯记录制度等）；</p>
            <p>5. 配备专职或兼职植保员。</p>
            <h3>六、申请材料</h3>
            <p>1.《出口食品原料种植场备案申请表》（加盖公章）；</p>
            <p>2. 种植场平面图；</p>
            <p>3. 种植场合法经营种植用地的证明材料；</p>
            <p>4. 质量安全管理制度文件；</p>
            <p>5. 种植场负责人、植保员身份证复印件及相关资格证明。</p>
            <h3>七、办理流程</h3>
            <p>1. 种植场向所在地主管海关申请备案；</p>
            <p>2. 所在地海关受理后进行文件审核，必要时现场审核；</p>
            <p>3. 审核符合条件的，予以备案并公布备案号。</p>
            <h3>八、办理途径</h3>
            <p>网上办理：登录"互联网+海关"平台（http://online.customs.gov.cn），进入"企业管理和稽查"版块；或登录"中国国际贸易单一窗口"（https://www.singlewindow.cn）"企业资质"模块。</p>
            <h3>九、收费标准</h3>
            <p>不收费</p>
            <h3>十、茶叶出口注意事项</h3>
            <p>出口茶叶企业还需同时办理出口食品生产企业备案。出口茶叶的原料必须来自备案种植场。</p>
            <h3>十一、食用菌出口注意事项</h3>
            <p>栽培食用菌属于实施备案管理的出口食品原料品种，其种植场（含大棚、厂房等栽培设施）须向海关备案。</p>
        `,
        author: "海关总署",
        pinned: false,
        links: [
            { title: "兰州海关——出口食品原料种植场备案", url: "http://shenzhen.customs.gov.cn/lanzhou_customs/553151/553153/553156/2693663/index.html" },
            { title: "海关总署——茶叶出口咨询答复", url: "http://www.customs.gov.cn/eportal/ui?msgDataId=18beeadc2863465dbdb3218399423d8e&pageId=374112" }
        ]

        content: `
            <h3>一、事项名称</h3>

            <h3>三、出境水果果园申请条件</h3>
            <p>1. 连片种植，面积在100亩以上；</p>
            <p>2. 周围无影响水果生产的污染源；</p>
            <p>3. 有专职或者兼职植保员，负责果园有害生物监测防治等工作；</p>
            <p>4. 建立完善的质量管理体系（组织机构、人员培训、有害生物监测与控制、农用化学品使用管理、良好农业操作规范等）；</p>
            <p>5. 近两年未发生重大植物疫情。</p>
            <h3>四、出境水果包装厂申请条件</h3>
            <p>1. 厂区整洁卫生，有满足水果贮存要求的原料场、成品库；</p>
            <p>2. 水果存放、加工、处理、储藏等功能区相对独立、布局合理，且与生活区采取隔离措施；</p>
            <p>3. 具有符合检疫要求的清洗、加工、防虫防病及除害处理设施；</p>
            <p>4. 加工水果所使用的水源及农用化学品均须符合食品卫生要求；</p>
            <p>5. 有完善的卫生质量管理体系，包括对水果供货、加工、包装、储运等环节的管理；</p>
            <p>6. 配备专职或者兼职植保员；</p>
            <p>7. 有与其加工能力相适应的提供水果货源的果园，或者与供货果园建有固定的供货关系。</p>
            <h3>五、申请材料</h3>
            <p>果园：《出境水果果园注册登记申请表》、果园示意图和平面图。</p>
            <p>包装厂：《出境水果包装厂注册登记申请表》、厂区平面图、工艺流程简要说明、供货果园名单及供货合约复印件。</p>
            <h3>六、办理流程</h3>
            <p>登录"互联网+海关"平台（https://online.customs.gov.cn）提交申请并上传材料；海关进行文件审核和现场考核；20个工作日内作出决定。</p>

            <h3>八、收费标准</h3>
            <p>不收费</p>
        `,

// ========================================
// 信息公示平台 - 核心脚本
// ========================================

(function() {
    'use strict';

    // -------- 工具函数 --------
    const $ = (sel, ctx) => (ctx || document).querySelector(sel);
    const $$ = (sel, ctx) => [...(ctx || document).querySelectorAll(sel)];

    // 当前状态
    let currentCategory = '全部';
    let currentSearch = '';
    let currentPage = 1;
    const PER_PAGE = 10;

    // -------- 页面初始化 --------
    function init() {
        applySiteConfig();
        renderCategoryNav();
        bindSearch();
        bindCategoryClicks();
        renderNotices();
        bindPageNav();
    }

    // 应用网站配置
    function applySiteConfig() {
        document.title = SITE_CONFIG.siteName;
        const nameEl = $('.site-title');
        const descEl = $('.site-subtitle');
        const copyEl = $('.footer-copyright');
        const icpEl = $('.footer-icp');
        if (nameEl) nameEl.textContent = SITE_CONFIG.siteName;
        if (descEl) descEl.textContent = SITE_CONFIG.siteDesc;
        if (copyEl) copyEl.textContent = `© ${new Date().getFullYear()} ${SITE_CONFIG.copyright}`;
        if (icpEl) icpEl.textContent = SITE_CONFIG.icp || '';
    }

    // 渲染分类标签
    function renderCategoryNav() {
        const nav = $('.category-nav');
        if (!nav) return;
        const cats = SITE_CONFIG.categories || CATEGORIES;
        nav.innerHTML = cats.map(c =>
            `<span class="category-tag${c === currentCategory ? ' active' : ''}" data-category="${c}">${c}</span>`
        ).join('');
    }

    // 绑定搜索事件
    function bindSearch() {
        const input = $('.search-input');
        const btn = $('.search-btn');
        const clear = $('.search-clear');
        if (!input) return;

        input.addEventListener('input', () => {
            if (clear) clear.classList.toggle('visible', input.value.length > 0);
        });

        if (clear) {
            clear.addEventListener('click', () => {
                input.value = '';
                clear.classList.remove('visible');
                currentSearch = '';
                currentPage = 1;
                renderNotices();
                input.focus();
            });
        }

        if (btn) {
            btn.addEventListener('click', () => {
                currentSearch = input.value.trim();
                currentPage = 1;
                renderNotices();
            });
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                currentSearch = input.value.trim();
                currentPage = 1;
                renderNotices();
            }
        });
    }

    // 绑定分类点击
    function bindCategoryClicks() {
        const nav = $('.category-nav');
        if (!nav) return;
        nav.addEventListener('click', (e) => {
            const tag = e.target.closest('.category-tag');
            if (!tag) return;
            currentCategory = tag.dataset.category;
            currentPage = 1;
            renderCategoryNav();
            renderNotices();
        });
    }

    // 绑定页面导航（首页/关于）
    function bindPageNav() {
        const navLinks = $$('.header-nav a');
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                const href = link.getAttribute('href');
                if (!href || href === '#') {
                    e.preventDefault();
                    showHome();
                } else if (href === '#about') {
                    e.preventDefault();
                    showAbout();
                } else if (href === 'index.html' || href === './' || href === '/') {
                    e.preventDefault();
                    showHome();
                }
            });
        });
    }

    // -------- 渲染公告列表 --------
    function renderNotices() {
        const container = $('.notice-container');
        const resultInfo = $('.result-info span');
        if (!container) return;

        // 过滤
        let filtered = [...NOTICES];
        if (currentCategory !== '全部') {
            filtered = filtered.filter(n => n.category === currentCategory);
        }
        if (currentSearch) {
            const kw = currentSearch.toLowerCase();
            filtered = filtered.filter(n =>
                n.title.toLowerCase().includes(kw) ||
                n.summary.toLowerCase().includes(kw) ||
                n.category.toLowerCase().includes(kw) ||
                (n.author && n.author.toLowerCase().includes(kw))
            );
        }

        // 排序：置顶优先，然后按日期倒序
        filtered.sort((a, b) => {
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;
            return b.date.localeCompare(a.date);
        });

        if (resultInfo) {
            resultInfo.textContent = `共找到 ${filtered.length} 条信息`;
        }

        // 分页
        const totalPages = Math.ceil(filtered.length / PER_PAGE) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PER_PAGE;
        const pageItems = filtered.slice(start, start + PER_PAGE);

        if (pageItems.length === 0) {
            container.innerHTML = `
                <div class="empty-state" style="background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);">
                    <div class="empty-state-icon">📭</div>
                    <div class="empty-state-text">没有找到相关信息</div>
                </div>`;
            renderPagination(0, 0);
            return;
        }

        container.innerHTML = `<div class="notice-list">${pageItems.map(item => renderNoticeItem(item)).join('')}</div>`;

        renderPagination(totalPages, filtered.length);

        // 绑定点击事件
        $$('.notice-item', container).forEach(el => {
            el.addEventListener('click', () => {
                const id = parseInt(el.dataset.id);
                showDetail(id);
            });
        });
    }

    function renderNoticeItem(item) {
        const dateParts = item.date.split('-');
        const monthDay = `${parseInt(dateParts[1])}月${parseInt(dateParts[2])}日`;
        return `
            <div class="notice-item${item.pinned ? ' pinned' : ''}" data-id="${item.id}">
                ${item.pinned ? '<span class="pin-badge">置顶</span>' : ''}
                <div class="notice-date-col">
                    <div class="notice-date-day">${dateParts[2]}</div>
                    <div class="notice-date-month">${dateParts[0]}/${dateParts[1]}</div>
                </div>
                <div class="notice-content-col">
                    <div class="notice-title">${escapeHtml(item.title)}</div>
                    <div class="notice-summary">${escapeHtml(item.summary)}</div>
                    <div class="notice-meta">
                        <span class="notice-category-tag">${escapeHtml(item.category)}</span>
                        <span>📅 ${item.date}</span>
                        <span>🏢 ${escapeHtml(item.author || '')}</span>
                    </div>
                </div>
            </div>`;
    }

    // -------- 分页 --------
    function renderPagination(totalPages, totalItems) {
        const paginationEl = $('.pagination');
        if (!paginationEl) return;
        if (totalPages <= 1) {
            paginationEl.innerHTML = '';
            return;
        }

        let html = '';
        html += `<button class="page-btn" ${currentPage <= 1 ? 'disabled' : ''} data-page="${currentPage - 1}">« 上一页</button>`;

        for (let i = 1; i <= totalPages; i++) {
            if (totalPages <= 7 || i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                html += `<button class="page-btn${i === currentPage ? ' active' : ''}" data-page="${i}">${i}</button>`;
            } else if (i === currentPage - 2 || i === currentPage + 2) {
                html += `<span style="padding:8px 4px;color:#9ca3af;">...</span>`;
            }
        }

        html += `<button class="page-btn" ${currentPage >= totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">下一页 »</button>`;

        paginationEl.innerHTML = html;

        // 绑定分页点击
        $$('.page-btn', paginationEl).forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.disabled) return;
                currentPage = parseInt(btn.dataset.page);
                renderNotices();
                $('.main-container').scrollIntoView({ behavior: 'smooth' });
            });
        });
    }

    // -------- 详情页 --------
    function showDetail(id) {
        const notice = NOTICES.find(n => n.id === id);
        if (!notice) return;

        const main = $('.main-container');

        // 附件 HTML
        const attachmentsHtml = notice.attachments && notice.attachments.length
            ? `<div class="detail-section">
                <h3>📎 附件下载</h3>
                <div class="attachment-list">
                    ${notice.attachments.map(a => `
                        <a class="attachment-item" href="${escapeHtml(a.url)}" target="_blank" download>
                            <span class="attachment-icon">${getFileIcon(a.name, a.type)}</span>
                            <span class="attachment-name">${escapeHtml(a.name)}</span>
                            <span class="attachment-action">下载</span>
                        </a>
                    `).join('')}
                </div>
            </div>` : '';

        // 相关链接 HTML
        const linksHtml = notice.links && notice.links.length
            ? `<div class="detail-section">
                <h3>🔗 相关链接</h3>
                <div class="link-list">
                    ${notice.links.map(l => `
                        <a class="link-item" href="${escapeHtml(l.url)}" target="_blank" rel="noopener">
                            <span>${escapeHtml(l.title)}</span>
                            <span class="link-arrow">↗</span>
                        </a>
                    `).join('')}
                </div>
            </div>` : '';

        // 上传文件 / 联系管理员
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const uploadHtml = isLocal ? `
            <div class="detail-section">
                <h3>📤 上传文件</h3>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-dropzone">
                        <span class="upload-icon">📂</span>
                        <p>点击或拖拽文件到这里上传</p>
                        <p class="upload-hint">支持 Word、Excel、PDF、图片等格式</p>
                    </div>
                    <input type="file" id="uploadFileInput" multiple accept="*/*" style="display:none;">
                </div>
                <div class="upload-progress" id="uploadProgress" style="display:none;">
                    <span class="upload-progress-text"></span>
                    <div class="upload-progress-bar"><div class="upload-progress-fill"></div></div>
                </div>
            </div>` : `
            <div class="detail-section">
                <h3>📤 附件说明</h3>
                <div class="upload-dropzone" style="border-style:solid;">
                    <span class="upload-icon">📧</span>
                    <p>如需添加附件或文件，请联系管理员上传</p>
                </div>
            </div>`;

        main.innerHTML = `
            <div class="detail-page">
                <button class="detail-back" onclick="window.showHome()">← 返回列表</button>
                <div class="detail-header">
                    <h1 class="detail-title">${escapeHtml(notice.title)}</h1>
                    <div class="detail-meta">
                        <span>📅 发布日期：${notice.date}</span>
                        <span class="notice-category-tag">${escapeHtml(notice.category)}</span>
                        <span>🏢 ${escapeHtml(notice.author || '')}</span>
                    </div>
                </div>
                <div class="detail-content">
                    ${notice.content}
                </div>
                ${attachmentsHtml}
                ${linksHtml}
                ${uploadHtml}
            </div>`;

        // 绑定上传事件（仅本地环境）
        if (isLocal) bindUpload(notice.id);

        // 隐藏搜索和分类
        $('.search-bar').style.display = 'none';
        $('.category-nav').style.display = 'none';
        $('.result-info').style.display = 'none';
        $('.pagination').innerHTML = '';

        window.scrollTo({ top: 0, behavior: 'smooth' });

        // 暴露返回函数
        window.showHome = showHome;
    }

    function getFileIcon(filename, type) {
        const ext = (filename || '').split('.').pop().toLowerCase();
        const map = {
            pdf: '📄', doc: '📝', docx: '📝', xls: '📊', xlsx: '📊',
            ppt: '📽', pptx: '📽', jpg: '🖼', jpeg: '🖼', png: '🖼',
            gif: '🖼', webp: '🖼', zip: '📦', rar: '📦', '7z': '📦',
            txt: '📃', mp4: '🎬', mp3: '🎵'
        };
        return map[ext] || map[type] || '📎';
    }

    function bindUpload(noticeId) {
        const area = $('#uploadArea');
        const input = $('#uploadFileInput');
        const progress = $('#uploadProgress');

        if (!area || !input) return;

        // 点击上传区域
        area.addEventListener('click', () => input.click());

        // 选择文件
        input.addEventListener('change', () => {
            if (input.files.length) uploadFiles(input.files, progress);
        });

        // 拖拽上传
        area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('dragover'); });
        area.addEventListener('dragleave', () => area.classList.remove('dragover'));
        area.addEventListener('drop', (e) => {
            e.preventDefault();
            area.classList.remove('dragover');
            if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files, progress);
        });
    }

    async function uploadFiles(files, progressEl) {
        const formData = new FormData();
        for (const f of files) {
            formData.append('files', f);
        }

        progressEl.style.display = 'block';
        $('.upload-progress-text', progressEl).textContent = `正在上传 ${files.length} 个文件...`;

        try {
            const resp = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await resp.json();

            if (data.ok) {
                $('.upload-progress-text', progressEl).textContent = `✅ 上传成功！${data.files.length} 个文件`;
                setTimeout(() => { progressEl.style.display = 'none'; }, 3000);
            } else {
                $('.upload-progress-text', progressEl).textContent = `❌ 上传失败: ${data.error}`;
            }
        } catch (err) {
            $('.upload-progress-text', progressEl).textContent = `❌ 网络错误: ${err.message}`;
        }
    }

    function showHome() {
        const main = $('.main-container');
        main.innerHTML = `<div class="notice-container"></div>`;
        $('.search-bar').style.display = '';
        $('.category-nav').style.display = '';
        $('.result-info').style.display = '';
        $('.pagination').innerHTML = '';

        init();
    }

    window.showHome = showHome;

    // -------- 关于页面 --------
    function showAbout() {
        const main = $('.main-container');
        main.innerHTML = `
            <div class="about-page">
                <h2>关于我们</h2>
                <div class="about-card">
                    <h3>平台简介</h3>
                    <p>${SITE_CONFIG.siteName}是面向公众的官方信息发布平台，致力于推进信息公开工作，保障公众的知情权、参与权和监督权。</p>
                </div>
                <div class="about-card">
                    <h3>服务内容</h3>
                    <p>本平台主要发布以下类型信息：</p>
                    <p>1. 通知公告：重要事项的通知和公告信息；</p>
                    <p>2. 政策法规：相关的政策和法律法规信息；</p>
                    <p>3. 办事指南：各项业务的办理流程和指南；</p>
                    <p>4. 结果公示：各类审批、评选结果的公开公示。</p>
                </div>
                <div class="about-card">
                    <h3>联系我们</h3>
                    <p>如您对本平台有任何意见或建议，欢迎通过以下方式联系我们：</p>
                    <p>📧 电子邮箱：example@example.com</p>
                    <p>📞 联系电话：XXX-XXXXXXX</p>
                    <p>📍 地址：待补充</p>
                </div>
            </div>`;

        $('.search-bar').style.display = 'none';
        $('.category-nav').style.display = 'none';
        $('.result-info').style.display = 'none';
        $('.pagination').innerHTML = '';
    }

    window.showAbout = showAbout;

    // -------- 工具 --------
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // 启动
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();

    </script>

// ========================================
// 分享功能 —— 二维码弹窗
// ========================================
(function() {
    'use strict';
    let qrGenerated = false;

    function initShare() {
        const fab = document.querySelector('.share-fab');
        const overlay = document.querySelector('.qr-overlay');
        const closeBtn = document.querySelector('.qr-close');
        const qrContainer = document.getElementById('qrcode');
        const qrUrl = document.getElementById('qrUrl');

        if (!fab || !overlay) return;

        fab.addEventListener('click', () => {
            overlay.classList.add('show');
            if (!qrGenerated) { generateQR(qrContainer, qrUrl); qrGenerated = true; }
        });

        closeBtn.addEventListener('click', () => overlay.classList.remove('show'));
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('show'); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.classList.contains('show')) overlay.classList.remove('show');
        });
    }

    function generateQR(container, urlEl) {
        let url = window.location.origin + window.location.pathname;
        // 去掉 index.html
        url = url.replace(/\/index\.html$/, '/').replace(/\/$/, '') || url;
        // 如果是 localhost ，提示用局域网地址
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            url = 'http://192.168.1.254:' + (window.location.port || '80') + window.location.pathname;
        }

        if (urlEl) urlEl.textContent = url;

        if (typeof QRCode !== 'undefined') {
            new QRCode(container, {
                text: url, width: 200, height: 200,
                colorDark: '#1f2937', colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
            const img = container.querySelector('img');
            if (img) img.removeAttribute('title');
        } else {
            container.innerHTML = `<div style="padding:20px;font-size:14px;">网站地址：<br><strong style="word-break:break-all;">${url}</strong></div>`;
        }
    }

    window.copyQrUrl = function() {
        let url = window.location.origin + window.location.pathname;
        url = url.replace(/\/index\.html$/, '/');
        const btn = document.querySelector('.qr-copy-btn');
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => showCopied(btn)).catch(() => fallbackCopy(url, btn));
        } else { fallbackCopy(url, btn); }
    };

    function fallbackCopy(text, btn) {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); showCopied(btn); } catch (e) { alert('链接：' + text); }
        document.body.removeChild(ta);
    }

    function showCopied(btn) {
        if (!btn) return;
        const orig = btn.textContent; btn.textContent = '✅ 已复制'; btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
    }

    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initShare); }
    else { initShare(); }
})();

    <script>
// ========================================
// 智能问答机器人（直连版 - 适用于静态部署）
// ========================================
(function() {
    'use strict';

    let panelVisible = false;
    let isProcessing = false;
    // API Key 从 data.js 读取，如果未配置则提示用户
    const API_KEY = (typeof SITE_CONFIG !== 'undefined' && SITE_CONFIG.agent && SITE_CONFIG.agent.apiKey) || '';
    const API_URL = 'https://api.deepseek.com/v1/chat/completions';

    const SYSTEM_PROMPT = `你是信息公示平台的智能客服助手。你的职责是：
1. 回答用户关于信息公示平台的各类问题
2. 帮助用户查找和理解公示信息
3. 引导用户使用平台的功能（搜索、分类浏览等）
4. 态度友好、专业、准确

关于本平台：
- 这是一个信息公示平台，发布通知公告、政策法规、办事指南、结果公示等内容
- 用户可以通过分类筛选和关键词搜索查找信息
- 支持查看附件、相关链接等功能

如果用户问的问题你无法回答（超出平台范围），请礼貌地说明并建议用户联系相关部门。`;

    function init() {
        const toggle = document.getElementById('agentToggle');
        const panel = document.getElementById('agentPanel');
        const close = document.getElementById('agentClose');
        const minimize = document.getElementById('agentMinimize');
        const send = document.getElementById('agentSend');
        const input = document.getElementById('agentInput');

        if (!toggle || !panel) return;

        toggle.addEventListener('click', () => {
            panelVisible = !panelVisible;
            panel.classList.toggle('open', panelVisible);
            if (panelVisible) input.focus();
        });

        close.addEventListener('click', () => {
            panelVisible = false;
            panel.classList.remove('open');
        });

        minimize.addEventListener('click', () => {
            panelVisible = false;
            panel.classList.remove('open');
        });

        send.addEventListener('click', sendMessage);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });
    }

    async function sendMessage() {
        const input = document.getElementById('agentInput');
        const text = input.value.trim();
        if (!text || isProcessing) return;

        if (!API_KEY) {
            addMessage('bot', '智能问答功能尚未配置 API Key。请在 data.js 中设置 SITE_CONFIG.agent.apiKey，或联系管理员。');
            return;
        }

        input.value = '';
        input.style.height = 'auto';
        isProcessing = true;

        addMessage('user', text);
        addTyping();

        try {
            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: 'deepseek-chat',
                    messages: [
                        { role: 'system', content: SYSTEM_PROMPT },
                        { role: 'user', content: text }
                    ]
                })
            });

            removeTyping();
            const data = await resp.json();

            if (data.choices && data.choices[0]) {
                addMessage('bot', data.choices[0].message.content);
            } else if (data.error) {
                addMessage('bot', '抱歉，智能助手暂时无法响应（' + data.error.message + '）。请稍后再试。');
            } else {
                addMessage('bot', '抱歉，智能助手暂时无法响应，请稍后再试。');
            }
        } catch (err) {
            removeTyping();
            addMessage('bot', '抱歉，网络连接异常，请稍后再试或通过其他方式联系我们。');
        }

        isProcessing = false;
    }

    function addMessage(role, content) {
        const container = document.getElementById('agentMessages');
        if (!container) return;

        const div = document.createElement('div');
        div.className = `agent-msg ${role}`;
        div.innerHTML = `<div class="agent-msg-content">${formatContent(content)}</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function addTyping() {
        const container = document.getElementById('agentMessages');
        if (!container) return;
        const div = document.createElement('div');
        div.className = 'agent-msg bot typing';
        div.id = 'typingIndicator';
        div.innerHTML = '<div class="agent-msg-content"><span class="typing-dot">●</span><span class="typing-dot">●</span><span class="typing-dot">●</span></div>';
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function removeTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    function formatContent(text) {
        if (!text) return '';
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/\n/g, '<br>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

    </script>
</body>
</html>
